<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>KCMPS — thumbnail</title>
<link rel="stylesheet" href="styles.css" />
<style>
html, body { height: 100%; }
body { margin: 0; display: flex; background: var(--color-accent-2); }
.mark { flex: 1; display: flex; align-items: center; justify-content: center; padding: 64px; overflow: hidden; }
.mark img { max-width: 100%; max-height: 100%; }
.strip { width: 25%; display: flex; flex-direction: column; }
.strip i { flex: 1; }
</style>
</head>
<body>
<div class="mark"><img src="assets/logo-mark.png" alt="" /></div>
<aside class="strip"><i style="background: var(--color-accent-300)"></i><i style="background: var(--color-accent-500)"></i><i style="background: var(--color-accent-700)"></i><i style="background: var(--color-accent-900)"></i></aside>
</body>
</html>
