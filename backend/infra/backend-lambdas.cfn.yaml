    DependsOn: ListDesignsLogGroup
    Properties:
      FunctionName: !Sub kcmps-${EnvName}-list-designs
      Runtime: !Ref Runtime
      Architectures: [arm64]
      Handler: index.handler
      # Reuses DesignLibraryLambdaRole even though this is a read — it
      # already grants exactly the S3 GetObject this handler's presigned
      # downloads need on the originals bucket, and a read-only Lambda
      # doesn't warrant a third IAM role for this one feature.
      Role: !GetAtt DesignLibraryLambdaRole.Arn
      MemorySize: 256
      Timeout: 15
      Code: { S3Bucket: !Ref ArtifactsBucket, S3Key: !Sub "${ArtifactsPrefix}/kcmps-list-designs.zip" }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName

  PatchDesignFunction:
    Type: AWS::Lambda::Function
    DependsOn: PatchDesignLogGroup
    Properties:
      FunctionName: !Sub kcmps-${EnvName}-patch-design
      Runtime: !Ref Runtime
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt DesignLibraryLambdaRole.Arn
      MemorySize: 256
      # Same headroom as PublishDesignFunction: the draft->published action
      # runs the identical scan-verdict read + S3 copy + manifest Scan.
      Timeout: 30
      Code: { S3Bucket: !Ref ArtifactsBucket, S3Key: !Sub "${ArtifactsPrefix}/kcmps-patch-design.zip" }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          DESIGN_ORIGINALS_BUCKET: !Ref DesignOriginalsBucket
          PUBLIC_ASSETS_BUCKET: !Ref PublicAssetsBucket
          PUBLIC_ASSETS_KEY_PREFIX: !Ref PublicAssetsKeyPrefix
          PUBLIC_ASSETS_PATH: !Ref PublicAssetsPath
          # Approval workflow: ListUsersInGroup(Admin) per submit/approve.
          COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId

  PurgeArchivedDesignsFunction:
    Type: AWS::Lambda::Function
    DependsOn: PurgeArchivedDesignsLogGroup
    Properties:
      FunctionName: !Sub kcmps-${EnvName}-purge-archived-designs
      Runtime: !Ref Runtime
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt JobsLambdaRole.Arn
      MemorySize: 256
      Timeout: 60
      Code: { S3Bucket: !Ref ArtifactsBucket, S3Key: !Sub "${ArtifactsPrefix}/kcmps-purge-archived-designs.zip" }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          DESIGN_ORIGINALS_BUCKET: !Ref DesignOriginalsBucket

  # ---------------------------------------------------------------------------
  # SES relay / staff mail panel (backend/mail/*.js) — 5 functions, MailLambdaRole.
  # IngestInboundFunction is S3-event-triggered (permission below; the actual S3
  # notification config is set via CLI against InboundMailBucket, which this
  # stack doesn't own — see that parameter's description). The other 4 are API-
  # invoked, JWT-authorizer-gated, wired into HttpApi below like every other
  # staff-api route.
  # ---------------------------------------------------------------------------
  IngestInboundFunction:
    Type: AWS::Lambda::Function
    DependsOn: IngestInboundLogGroup
    Properties:
      FunctionName: !Sub kcmps-${EnvName}-ingest-inbound
      Runtime: !Ref Runtime
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt MailLambdaRole.Arn
      MemorySize: 256
      Timeout: 30
      Code: { S3Bucket: !Ref ArtifactsBucket, S3Key: !Sub "${ArtifactsPrefix}/kcmps-ingest-inbound.zip" }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          EXPECTED_FORWARDER_HOST: !Ref ExpectedForwarderHost
          UPLOADS_BUCKET_NAME: !Ref UploadsBucket

  PermIngestInboundS3:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref IngestInboundFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub arn:aws:s3:::${InboundMailBucket}
      SourceAccount: !Ref AWS::AccountId

  GetMailboxesFunction:
    Type: AWS::Lambda::Function
    DependsOn: GetMailboxesLogGroup
    Properties:
      FunctionName: !Sub kcmps-${EnvName}-get-mailboxes
      Runtime: !Ref Runtime
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt MailLambdaRole.Arn
      MemorySize: 256
      Timeout: 10
      Code: { S3Bucket: !Ref ArtifactsBucket, S3Key: !Sub "${ArtifactsPrefix}/kcmps-get-mailboxes.zip" }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName

  GetMailMessagesFunction:
    Type: AWS::Lambda::Function
    DependsOn: GetMailMessagesLogGroup
    Properties:
      FunctionName: !Sub kcmps-${EnvName}-get-mail-messages
      Runtime: !Ref Runtime
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt MailLambdaRole.Arn
      MemorySize: 256
      Timeout: 10
      Code: { S3Bucket: !Ref ArtifactsBucket, S3Key: !Sub "${ArtifactsPrefix}/kcmps-get-mail-messages.zip" }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName

  GetMailMessageFunction:
    Type: AWS::Lambda::Function
    DependsOn: GetMailMessageLogGroup
    Properties:
      FunctionName: !Sub kcmps-${EnvName}-get-mail-message
      Runtime: !Ref Runtime
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt MailLambdaRole.Arn
      MemorySize: 256
      Timeout: 10
      Code: { S3Bucket: !Ref ArtifactsBucket, S3Key: !Sub "${ArtifactsPrefix}/kcmps-get-mail-message.zip" }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          UPLOADS_BUCKET_NAME: !Ref UploadsBucket

  MarkMailReadFunction:
    Type: AWS::Lambda::Function
    DependsOn: MarkMailReadLogGroup
    Properties:
      FunctionName: !Sub kcmps-${EnvName}-mark-mail-read
      Runtime: !Ref Runtime
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt MailLambdaRole.Arn
      MemorySize: 256
      Timeout: 10
      Code: { S3Bucket: !Ref ArtifactsBucket, S3Key: !Sub "${ArtifactsPrefix}/kcmps-mark-mail-read.zip" }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName

  # The one mail Lambda that SENDS. Unlike the customer-notification
  # Lambdas elsewhere in this template — which stay dark on staging by
  # leaving FROM_EMAIL/SES_SENDER unset — this one has no "dark" mode:
  # sending is its entire function, so it is instead constrained by
  # MailAllowedRecipients (see that parameter) and by the FromAddress
  # condition on MailLambdaRole's ses-send policy.
  SendMailReplyFunction:
    Type: AWS::Lambda::Function
    DependsOn: SendMailReplyLogGroup
    Properties:
      FunctionName: !Sub kcmps-${EnvName}-send-mail-reply
      Runtime: !Ref Runtime
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt MailLambdaRole.Arn
      MemorySize: 256
      Timeout: 15
      Code: { S3Bucket: !Ref ArtifactsBucket, S3Key: !Sub "${ArtifactsPrefix}/kcmps-send-mail-reply.zip" }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          MAIL_ALLOWED_RECIPIENTS: !Ref MailAllowedRecipients
          MAIL_SENDER_NAME: KCMPS

  # ---------------------------------------------------------------------------
  # HTTP API — same 13 routes/shape as prod's kcmps-checkout-api, same Cognito
  # JWT authorizer config (literally the same pool/client, since staging reuses
  # kcmps-user-pool-v2). CORS scoped to staging origins only.
  # ---------------------------------------------------------------------------
  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub kcmps-checkout-api-${EnvName}
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins: [https://dev.kcmps.com, http://localhost:5500, http://localhost:5501]
        # PATCH added for PATCH /designs/{id} (patch-design.js); PUT/DELETE
        # added for PUT/DELETE /staff/pin (staff-pin.js) — every other route
        # in this API is GET/POST only.
        AllowMethods: [GET, POST, PATCH, PUT, DELETE, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 300

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: $default
      AutoDeploy: true

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: !Sub kcmps-cognito-jwt-${EnvName}
      AuthorizerType: JWT
      IdentitySource: ["$request.header.Authorization"]
      JwtConfiguration:
        Audience: [!Ref CognitoClientId]
        Issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}

  # -- Integrations (Lambda proxy, one per function that's API-invoked) --
  CreateOrderIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt CreateOrderFunction.Arn, PayloadFormatVersion: "2.0" } }
  SubmitPaymentProofIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt SubmitPaymentProofFunction.Arn, PayloadFormatVersion: "2.0" } }
  UploadDesignFileIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt UploadDesignFileFunction.Arn, PayloadFormatVersion: "2.0" } }
  LookupOrderIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt LookupOrderFunction.Arn, PayloadFormatVersion: "2.0" } }
  CancelOrderIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt CancelOrderFunction.Arn, PayloadFormatVersion: "2.0" } }
  GetOrdersIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt GetOrdersFunction.Arn, PayloadFormatVersion: "2.0" } }
  AdvanceLineItemIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt AdvanceLineItemFunction.Arn, PayloadFormatVersion: "2.0" } }
  VerifyPaymentIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt VerifyPaymentFunction.Arn, PayloadFormatVersion: "2.0" } }
  GetMessagesIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt GetMessagesFunction.Arn, PayloadFormatVersion: "2.0" } }
  SendMessageIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt SendMessageFunction.Arn, PayloadFormatVersion: "2.0" } }
  GetUnreadMessagesIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt GetUnreadMessagesFunction.Arn, PayloadFormatVersion: "2.0" } }
  AddCorrespondenceIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt AddCorrespondenceFunction.Arn, PayloadFormatVersion: "2.0" } }
  SetOrderTagsIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt SetOrderTagsFunction.Arn, PayloadFormatVersion: "2.0" } }
  CreateManualOrderIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt CreateManualOrderFunction.Arn, PayloadFormatVersion: "2.0" } }
  StaffPinIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt StaffPinFunction.Arn, PayloadFormatVersion: "2.0" } }
  DashboardPrefsIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt DashboardPrefsFunction.Arn, PayloadFormatVersion: "2.0" } }
  StationsIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt StationsFunction.Arn, PayloadFormatVersion: "2.0" } }

  # Cash Book + job costing
  LogTransactionIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt LogTransactionFunction.Arn, PayloadFormatVersion: "2.0" } }
  VoidTransactionIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt VoidTransactionFunction.Arn, PayloadFormatVersion: "2.0" } }
  RelinkTransactionIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt RelinkTransactionFunction.Arn, PayloadFormatVersion: "2.0" } }
  GetCashbookDayIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt GetCashbookDayFunction.Arn, PayloadFormatVersion: "2.0" } }
  GetCashbookMonthIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt GetCashbookMonthFunction.Arn, PayloadFormatVersion: "2.0" } }
  GetCashbookCategoriesIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt GetCashbookCategoriesFunction.Arn, PayloadFormatVersion: "2.0" } }
  LogJobCostIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt LogJobCostFunction.Arn, PayloadFormatVersion: "2.0" } }
  GetJobCostingIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt GetJobCostingFunction.Arn, PayloadFormatVersion: "2.0" } }

  DesignUploadUrlIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt DesignUploadUrlFunction.Arn, PayloadFormatVersion: "2.0" } }
  PublishDesignIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt PublishDesignFunction.Arn, PayloadFormatVersion: "2.0" } }
  ListDesignsIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt ListDesignsFunction.Arn, PayloadFormatVersion: "2.0" } }
  PatchDesignIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt PatchDesignFunction.Arn, PayloadFormatVersion: "2.0" } }

  GetMailboxesIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt GetMailboxesFunction.Arn, PayloadFormatVersion: "2.0" } }
  GetMailMessagesIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt GetMailMessagesFunction.Arn, PayloadFormatVersion: "2.0" } }
  GetMailMessageIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt GetMailMessageFunction.Arn, PayloadFormatVersion: "2.0" } }
  MarkMailReadIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt MarkMailReadFunction.Arn, PayloadFormatVersion: "2.0" } }
  SendMailReplyIntegration: { Type: AWS::ApiGatewayV2::Integration, Properties: { ApiId: !Ref HttpApi, IntegrationType: AWS_PROXY, IntegrationUri: !GetAtt SendMailReplyFunction.Arn, PayloadFormatVersion: "2.0" } }

  # -- Routes (13 matching prod's route table exactly, + 2 staging-only
  #    Design Asset Library routes not yet present in production) --
  RouteCreateOrder: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /orders", Target: !Sub "integrations/${CreateOrderIntegration}" } }
  RouteSubmitPaymentProof: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /orders/{orderId}/payment-proof", Target: !Sub "integrations/${SubmitPaymentProofIntegration}" } }
  RouteUploadDesignFile: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /design-uploads", Target: !Sub "integrations/${UploadDesignFileIntegration}" } }
  RouteLookupOrder: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /orders/lookup", Target: !Sub "integrations/${LookupOrderIntegration}" } }
  RouteCancelOrder: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /orders/{orderId}/cancel", Target: !Sub "integrations/${CancelOrderIntegration}" } }
  RouteGetOrders: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /orders", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${GetOrdersIntegration}" } }
  RouteAdvanceLineItem: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /line-items/{lineItemId}/advance", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${AdvanceLineItemIntegration}" } }
  RouteVerifyPayment: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /orders/{orderId}/verify-payment", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${VerifyPaymentIntegration}" } }
  RouteSetOnHold: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /orders/{orderId}/set-on-hold", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${VerifyPaymentIntegration}" } }
  RouteGetMessages: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /orders/{orderId}/messages", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${GetMessagesIntegration}" } }
  RouteSendMessage: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /orders/{orderId}/messages", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${SendMessageIntegration}" } }
  RouteGetUnreadMessages: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /messages/unread", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${GetUnreadMessagesIntegration}" } }
  RouteAddCorrespondence: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /orders/{orderId}/correspondence", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${AddCorrespondenceIntegration}" } }
  RouteSetOrderTags: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /orders/{orderId}/tags", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${SetOrderTagsIntegration}" } }
  RouteCreateManualOrder: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /orders/manual", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${CreateManualOrderIntegration}" } }
  RouteStaffPinStatus: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /staff/pin", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${StaffPinIntegration}" } }
  RouteStaffPinSet: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "PUT /staff/pin", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${StaffPinIntegration}" } }
  RouteStaffPinClear: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "DELETE /staff/pin", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${StaffPinIntegration}" } }
  RouteStaffPinVerify: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /staff/pin/verify", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${StaffPinIntegration}" } }
  RouteDashboardPrefsGet: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /staff/prefs", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${DashboardPrefsIntegration}" } }
  RouteDashboardPrefsPatch: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "PATCH /staff/prefs", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${DashboardPrefsIntegration}" } }
  RouteStationsGet: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /stations", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${StationsIntegration}" } }
  RouteStationsPut: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "PUT /stations", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${StationsIntegration}" } }

  # -- Cash Book + job costing. Every route carries the JWT authorizer;
  #    each Lambda then applies its OWN gate on top (isStaff() to log and
  #    to read a day, Admin to void or to read month totals / job margin).
  #    The authorizer never filters by group — same division of labour as
  #    every other staff route in this API.
  #    Note the ORDER of the two /cashbook/transactions routes does not
  #    matter to API Gateway: "POST /cashbook/transactions" and
  #    "POST /cashbook/transactions/{txnId}/void" have different path
  #    segment counts and cannot collide.
  RouteLogTransaction: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /cashbook/transactions", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${LogTransactionIntegration}" } }
  RouteVoidTransaction: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /cashbook/transactions/{txnId}/void", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${VoidTransactionIntegration}" } }
  RouteRelinkTransaction: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "PATCH /cashbook/transactions/{txnId}/link", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${RelinkTransactionIntegration}" } }
  RouteGetCashbookDay: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /cashbook/day/{day}", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${GetCashbookDayIntegration}" } }
  RouteGetCashbookMonth: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /cashbook/month/{month}", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${GetCashbookMonthIntegration}" } }
  RouteGetCashbookCategories: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /cashbook/categories", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${GetCashbookCategoriesIntegration}" } }
  RouteLogJobCost: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "POST /orders/{orderId}/costs", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${LogJobCostIntegration}" } }
  RouteGetJobCosting: { Type: AWS::ApiGatewayV2::Route, Properties: { ApiId: !Ref HttpApi, RouteKey: "GET /orders/{orderId}/costing", AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer, Target: !Sub "integrations/${GetJobCostingIntegration}" } }

