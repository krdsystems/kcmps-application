  PublishDesignFunction:
    Type: AWS::Lambda::Function
    DependsOn: PublishDesignLogGroup
    Properties:
      FunctionName: !Sub kcmps-${EnvName}-publish-design
      Runtime: !Ref Runtime
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt DesignLibraryLambdaRole.Arn
      MemorySize: 256
      # Longer than the 10s house default: a publish does a scan-verdict read, a
      # transactional write, a server-side S3 copy of a multi-MB image, and a full
      # manifest regeneration (a paginated Scan) in one request.
      Timeout: 30
      Code: { S3Bucket: !Ref ArtifactsBucket, S3Key: !Sub "${ArtifactsPrefix}/kcmps-publish-design.zip" }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName
          DESIGN_ORIGINALS_BUCKET: !Ref DesignOriginalsBucket
          PUBLIC_ASSETS_BUCKET: !Ref PublicAssetsBucket
          PUBLIC_ASSETS_KEY_PREFIX: !Ref PublicAssetsKeyPrefix
          PUBLIC_ASSETS_PATH: !Ref PublicAssetsPath

  ListDesignsFunction:
