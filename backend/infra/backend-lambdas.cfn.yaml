  # ---------------------------------------------------------------------------
  # Cash Book + job costing — Phase 1 of
  # docs/cashbook-job-costing-plan-2026-08-18.md.
  #
  # DynamoDB only. No SES env var of any kind is set on any of these, and
  # none of them import a mail client: this feature never emails anyone, so
  # there is nothing here for staging's SES-dark rule to keep dark.
  #
  # All seven reuse StaffApiLambdaRole, which already carries exactly what
  # they need on this table — Get/Put/Update/Query plus TransactWriteItems.
  # (Note the README's warning that PutItem must be present ALONGSIDE
  # TransactWriteItems: DynamoDB checks the constituent action for each
  # operation inside a transaction, not just the transact-level one. It is,
  # which is why no role change was needed.)
  #
  # Runtime is !Ref Runtime on every one, never a literal — that parameter
  # is the single point of truth a future Node EOL bump changes once.
  # ---------------------------------------------------------------------------

  # POST /cashbook/transactions — isStaff(). The manual writer in the
  # plan's "one ledger, two writers" table.
  LogTransactionFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogTransactionLogGroup
    Properties:
      FunctionName: !Sub kcmps-${EnvName}-log-transaction
      Runtime: !Ref Runtime
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt StaffApiLambdaRole.Arn
      MemorySize: 256
      Timeout: 10
      Code: { S3Bucket: !Ref ArtifactsBucket, S3Key: !Sub "${ArtifactsPrefix}/kcmps-log-transaction.zip" }
      Environment:
        Variables:
          TABLE_NAME: !Ref TableName

  # POST /cashbook/transactions/{txnId}/void — Admin-only (owner decision
  # on plan O1). Append-only correction: flags the original, writes a
  # reversing row, negates both rollups, all in one transaction.
  RelinkTransactionFunction:
    Type: AWS::Lambda::Function
    DependsOn: RelinkTransactionLogGroup
    Properties:
      FunctionName: !Sub kcmps-${EnvName}-relink-transaction
      Runtime: !Ref Runtime
      Architectures: [arm64]
