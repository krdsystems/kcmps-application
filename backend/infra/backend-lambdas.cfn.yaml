      Role: !GetAtt StaffApiLambdaRole.Arn
      MemorySize: 256
      Timeout: 10
      Code: { S3Bucket: !Ref ArtifactsBucket, S3Key: !Sub "${ArtifactsPrefix}/kcmps-relink-transaction.zip" }
      Environment:
        Variables:
