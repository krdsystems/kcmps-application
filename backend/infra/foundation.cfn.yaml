AWSTemplateFormatVersion: "2010-09-09"
Description: >
  KCMPS Milestone 1.0 foundation — single-table DynamoDB (with GSI1, Streams,
  PITR, deletion protection) plus the 5 Cognito staff/customer groups in the
  EXISTING User Pool. Does not create a User Pool. Safe to run against the
  existing account: it only adds resources, it does not modify or replace
  anything that already exists. See backend/infra/README.md for apply and
  rollback instructions, and ../../ops-dashboard/infra/backend-infra-to-deploy.md
  §2.1/§2.3 for the schema this template must stay in sync with.

  STALE as of the 2026-08-05 pool v2 cutover (backend/infra/README.md "User
  pool v2"): the deployed stack's UserPoolId parameter points at
  ap-southeast-1_iDvAEumNp, which has been deleted. Its 5 UserPoolGroup
  resources are now dangling — do NOT `aws cloudformation deploy` this
  template pointed at the new pool (ap-southeast-1_LHJsFdCgo) to "fix" it.
  user-pool-v2.cfn.yaml already created identically-named groups
  (Customer/Staff/Admin/Production/Sales/Finance) on that pool directly, and
  CloudFormation would try to create them again under this stack's
  ownership — a same-name conflict that fails the deploy. Group management
  for the live pool belongs to user-pool-v2.cfn.yaml now; this template's
  KcmpsTable resource (the actual DynamoDB table, unaffected by any of the
  above) is still the real, current source of truth for that table.

Parameters:
  TableName:
    Type: String
    Default: kcmps
    Description: >
      Name of the single DynamoDB table to create. Must not collide with an
      existing table of the same name in this account/region.

  UserPoolId:
    Type: String
    Default: ap-southeast-1_iDvAEumNp
    Description: >
      STALE — see the template Description above. This ID no longer exists;
      left as the historical default rather than repointed at the live pool
      specifically so a routine `deploy` (e.g. to change TableName) doesn't
      silently attempt to recreate the 5 groups on the new pool and fail.
      ID of the EXISTING Cognito User Pool the storefront/dashboard
      authenticated against at the time this template was first applied.
      This template adds groups to this pool — it does NOT create a new
      pool.

Resources:
  KcmpsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      DeletionProtectionEnabled: true

  CustomerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPoolId
      GroupName: Customer
      Description: Default group for storefront customers.
      Precedence: 50

  ProductionGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPoolId
      GroupName: Production
      Description: Staff — production floor (line-item status, spoilage).
      Precedence: 40

  SalesGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPoolId
      GroupName: Sales
      Description: Staff — sales/CRM (clients, quotes).
      Precedence: 30

  FinanceGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPoolId
      GroupName: Finance
      Description: Staff — payment verification, financial metrics.
      Precedence: 20

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPoolId
      GroupName: Admin
      Description: Staff — full access, founders.
      Precedence: 10

Outputs:
  TableName:
    Description: Name of the created DynamoDB table.
    Value: !Ref KcmpsTable

  TableStreamArn:
    Description: >
      Stream ARN of the created table — pass this to the 1.3 streams-handler
      Lambda's DynamoDB Streams event source mapping.
    Value: !GetAtt KcmpsTable.StreamArn

  GSI1Name:
    Description: Name of the sparse status GSI used by the /today action queues.
    Value: GSI1
