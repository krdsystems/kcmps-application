AWSTemplateFormatVersion: "2010-09-09"
Description: >
  KCMPS single-table DynamoDB (GSI1, Streams, PITR, deletion protection) plus
  5 Cognito staff/customer groups in an EXISTING User Pool. Does not create a
  User Pool. See backend/infra/README.md for apply/rollback and
  ../../ops-dashboard/infra/backend-infra-to-deploy.md §2.1/§2.3 for schema.

  The DEPLOYED `kcmps-foundation` stack is STALE as of 2026-08-05: its
  UserPoolId points at a now-deleted pool, its UserPoolGroup resources are
  dangling. Do NOT redeploy it against the new pool — see UserPoolId below
  and README.md's "User pool v2" section first.

  Also reused, as a SEPARATE stack, for staging (`kcmps-foundation-staging`)
  — see README.md's "Staging" section. Not a redeploy of the stale one above.

Parameters:
  TableName:
    Type: String
    Default: kcmps
    Description: >
      Name of the single DynamoDB table to create. Must not collide with an
      existing table of the same name in this account/region.

  UserPoolId:
    Type: String
    Default: ap-southeast-1_iDvAEumNp
    Description: >
      STALE default as far as the `kcmps-foundation` stack goes — see the
      template Description above. This ID no longer exists; left as the
      historical default rather than repointed at the live pool specifically
      so a routine `deploy` of THAT stack (e.g. to change TableName) doesn't
      silently attempt to recreate the 5 groups on the new pool and fail.
      Callers that pass a real pool ID (e.g. `kcmps-foundation-staging`
      passing kcmps-user-pool-v2's ID) must also pass
      CreateCognitoGroups=false, since this template adds groups to
      whatever pool it's given — it does NOT create a new pool, and doesn't
      know whether the pool it's pointed at already has them.

  CreateCognitoGroups:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Whether to create the 5 Cognito groups on UserPoolId. Set false when
      reusing a pool that already has them (e.g. the staging stack reusing
      kcmps-user-pool-v2's existing groups).

  EnablePitr:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      Point-in-time recovery on the table. Off for staging — PITR exists to
      protect real customer/order data, and staging holds neither.

Conditions:
  ShouldCreateCognitoGroups: !Equals [!Ref CreateCognitoGroups, "true"]
  ShouldEnablePitr: !Equals [!Ref EnablePitr, "true"]

Resources:
  KcmpsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Ref TableName
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [ShouldEnablePitr, true, false]
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      DeletionProtectionEnabled: true

  CustomerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: ShouldCreateCognitoGroups
    Properties:
      UserPoolId: !Ref UserPoolId
      GroupName: Customer
      Description: Default group for storefront customers.
      Precedence: 50

  ProductionGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: ShouldCreateCognitoGroups
    Properties:
      UserPoolId: !Ref UserPoolId
      GroupName: Production
      Description: Staff — production floor (line-item status, spoilage).
      Precedence: 40

  SalesGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: ShouldCreateCognitoGroups
    Properties:
      UserPoolId: !Ref UserPoolId
      GroupName: Sales
      Description: Staff — sales/CRM (clients, quotes).
      Precedence: 30

  FinanceGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: ShouldCreateCognitoGroups
    Properties:
      UserPoolId: !Ref UserPoolId
      GroupName: Finance
      Description: Staff — payment verification, financial metrics.
      Precedence: 20

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Condition: ShouldCreateCognitoGroups
    Properties:
      UserPoolId: !Ref UserPoolId
      GroupName: Admin
      Description: Staff — full access, founders.
      Precedence: 10

Outputs:
  TableName:
    Description: Name of the created DynamoDB table.
    Value: !Ref KcmpsTable

  TableStreamArn:
    Description: >
      Stream ARN of the created table — pass this to the 1.3 streams-handler
      Lambda's DynamoDB Streams event source mapping.
    Value: !GetAtt KcmpsTable.StreamArn

  GSI1Name:
    Description: Name of the sparse status GSI used by the /today action queues.
    Value: GSI1
