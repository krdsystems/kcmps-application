  # ---- 2026-08-13 gap-fill: 15 production Lambdas had NO alarm at all (production grew from
  # 17 to 32 Lambdas after this stack was written and the alarm set never kept pace — see
  # docs/disaster-recovery-and-cicd-plan.md G11 and backend/CLAUDE.md's infra/ table row).
  # Tiered by whether a silent failure is customer-visible, not a blind Errors+Throttles pair
  # on all 15 (that would be 30 more alarms; this is 12):
  #   - Severe (full Errors+Throttles pair): the mail-ingest/mail-reply/manual-order Lambdas —
  #     each is a live customer-facing path (inbound mail, staff replies, walk-in orders) with
  #     no other alarm covering it.
  #   - Moderate (Errors-only, no Throttles — these are low-volume, staff-triggered writes
  #     where a throttle is extremely unlikely and halving the alarm count halves the cost):
  #     the Asset Library write path and staff-pin.
  #   - Cosmetic (aggregated via a metric-math expression — ONE alarm covers several
  #     functions' Errors summed together, at a higher threshold, instead of a pair each):
  #     mail read-only endpoints, and the tags/prefs/list-designs/purge grab-bag. These don't
  #     block a sale or a reply; they degrade a dashboard convenience. A combined alarm still
  #     catches "several of these are broken," it just doesn't say which one — check logs
  #     across the group's functions when it fires.

  CreateManualOrderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kcmps-create-manual-order-errors
      AlarmDescription: >
        kcmps-create-manual-order threw an unhandled error — a staffer's walk-in/phone order
        entry (jobs.html's "+ New manual order") failed. Same order-creation contract as
        kcmps-create-order, just a different entry point.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: kcmps-create-manual-order
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  CreateManualOrderThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
