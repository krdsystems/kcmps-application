                  "arn:aws:cloudwatch:ap-southeast-1:${AWS::AccountId}:alarm:kcmps-send-message-throttles",
                  "arn:aws:cloudwatch:ap-southeast-1:${AWS::AccountId}:alarm:kcmps-get-messages-errors",
                  "arn:aws:cloudwatch:ap-southeast-1:${AWS::AccountId}:alarm:kcmps-get-messages-throttles",
                  "arn:aws:cloudwatch:ap-southeast-1:${AWS::AccountId}:alarm:kcmps-get-unread-messages-errors",
                  "arn:aws:cloudwatch:ap-southeast-1:${AWS::AccountId}:alarm:kcmps-get-unread-messages-throttles",
                  "arn:aws:cloudwatch:ap-southeast-1:${AWS::AccountId}:alarm:kcmps-notify-unread-messages-errors",
                  "arn:aws:cloudwatch:ap-southeast-1:${AWS::AccountId}:alarm:kcmps-notify-unread-messages-throttles",
                  "arn:aws:cloudwatch:ap-southeast-1:${AWS::AccountId}:alarm:kcmps-staff-pin-errors",
                  "arn:aws:cloudwatch:ap-southeast-1:${AWS::AccountId}:alarm:kcmps-dashboard-misc-errors"
                ]
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 20, "width": 12, "height": 6,
              "properties": {
                "title": "Cron heartbeats (Invocations) — a flat zero line is the failure, not a spike",
                "region": "ap-southeast-1",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  ["AWS/Lambda", "Invocations", "FunctionName", "kcmps-expire-pending-orders", {"stat": "Sum", "period": 900, "label": "expire-pending-orders (15min)"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "kcmps-notify-unread-messages", {"stat": "Sum", "period": 1800, "label": "notify-unread-messages (30min, SES-dark)"}],
                  ["AWS/Lambda", "Invocations", "FunctionName", "kcmps-purge-archived-designs", {"stat": "Sum", "period": 900, "label": "purge-archived-designs (15min)"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12, "y": 20, "width": 12, "height": 6,
              "properties": {
                "title": "Streams handler lag & DLQ depth",
                "region": "ap-southeast-1",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  ["AWS/Lambda", "IteratorAge", "FunctionName", "kcmps-streams-handler", {"stat": "Maximum", "period": 300, "label": "streams-handler IteratorAge (ms)"}],
                  ["AWS/SQS", "ApproximateNumberOfMessagesVisible", "QueueName", "kcmps-lambda-dlq", {"stat": "Maximum", "period": 300, "yAxis": "right", "label": "kcmps-lambda-dlq depth"}]
                ],
                "yAxis": { "right": { "min": 0 } }
              }
            },
            {
              "type": "metric",
              "x": 0, "y": 26, "width": 24, "height": 6,
              "properties": {
                "title": "kcmps-checkout-api traffic, 4xx/5xx, latency",
                "region": "ap-southeast-1",
                "view": "timeSeries",
                "stacked": false,
                "metrics": [
                  ["AWS/ApiGateway", "Count", "ApiId", "6msg2uho6c", {"stat": "Sum", "period": 300, "label": "Requests"}],
                  ["AWS/ApiGateway", "4XXError", "ApiId", "6msg2uho6c", {"stat": "Sum", "period": 300, "label": "4XX"}],
                  ["AWS/ApiGateway", "5XXError", "ApiId", "6msg2uho6c", {"stat": "Sum", "period": 300, "label": "5XX"}],
                  ["AWS/ApiGateway", "Latency", "ApiId", "6msg2uho6c", {"stat": "Average", "period": 300, "yAxis": "right", "label": "Avg latency (ms)"}]
                ],
                "yAxis": { "right": { "min": 0 } }
              }
            }
          ]
        }

Outputs:
  AlertsTopicArn:
    Description: SNS topic ARN — subscribe more destinations here later if needed.
    Value: !Ref AlertsTopic

  LambdaDlqArn:
    Description: >
      DLQ ARN — pass this to the Streams event source mapping's DestinationConfig and
      kcmps-expire-pending-orders' async invoke config (see README's CLI steps).
    Value: !GetAtt LambdaDlq.Arn

  LambdaDlqUrl:
    Description: DLQ URL, for manually inspecting/purging failed records.
    Value: !Ref LambdaDlq
