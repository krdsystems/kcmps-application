  # Aggregated (cosmetic tier) — one metric-math alarm covers several low-severity Lambdas'
  # Errors summed together, at a threshold above 1 so a single blip on one function doesn't
  # page anyone. Fires on "several of these broke," doesn't say which — check each function's
  # logs. This is 1 alarm resource (billed once) instead of 4 pairs (8 alarms) — the explicit
  # cheaper-alternative the root CLAUDE.md's cost-governance rule asks for.

  MailReadPathErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kcmps-mail-read-path-errors
      AlarmDescription: >
        Combined Errors across the mail-read Lambdas backing the staff Email page
        (kcmps-get-mailboxes, kcmps-get-mail-message, kcmps-get-mail-messages,
        kcmps-mark-mail-read) — these read/mark-read the mailboxes ingest-inbound already
        wrote; a failure here means the Email page itself is broken even though mail is
        still arriving. Aggregated, threshold raised to 3 in one 5-minute window to avoid
        paging on a single blip; check CloudWatch Logs for the specific function.
      Metrics:
        - Id: m1
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: kcmps-get-mailboxes
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: m2
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: kcmps-get-mail-message
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: m3
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: kcmps-get-mail-messages
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: m4
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: kcmps-mark-mail-read
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: e1
          Expression: "m1+m2+m3+m4"
          Label: "Combined mail read-path Errors"
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  DashboardMiscErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kcmps-dashboard-misc-errors
      AlarmDescription: >
        Combined Errors across four low-severity, low-volume dashboard convenience Lambdas:
        kcmps-list-designs (Asset Library grid read), kcmps-set-order-tags (job-detail Tags
        card), kcmps-dashboard-prefs (per-staffer column order), kcmps-purge-archived-designs
        (15-min cron, hard-deletes 90-day-archived assets). None of these being briefly broken
        stops a sale or a reply — worst case a column order doesn't save, or an archived asset
        isn't purged this cycle (retried next run). Aggregated, threshold raised to 3 in one
        5-minute window; check CloudWatch Logs for the specific function.
      Metrics:
        - Id: m1
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: kcmps-list-designs
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: m2
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: kcmps-set-order-tags
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: m3
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: kcmps-dashboard-prefs
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: m4
          MetricStat:
            Metric:
              Namespace: AWS/Lambda
              MetricName: Errors
              Dimensions:
                - Name: FunctionName
                  Value: kcmps-purge-archived-designs
            Period: 300
            Stat: Sum
          ReturnData: false
        - Id: e1
          Expression: "m1+m2+m3+m4"
          Label: "Combined dashboard-misc Errors"
          ReturnData: true
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

