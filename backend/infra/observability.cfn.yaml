  # ---- DLQ depth ----

  LambdaDlqDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kcmps-lambda-dlq-depth
      AlarmDescription: >
        A message landed in the shared Lambda dead-letter queue — a Streams batch or an async
        cron invoke exhausted its retries. Check kcmps-lambda-dlq.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt LambdaDlq.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  # ---- API Gateway 5xx ----

  CheckoutApi5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kcmps-checkout-api-5xx
      AlarmDescription: >
        kcmps-checkout-api returned a 5xx — catches integration-level failures (timeouts,
        cold-start errors) that don't always surface as a Lambda Errors count.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiId
          Value: 6msg2uho6c
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

Outputs:
  AlertsTopicArn:
    Description: SNS topic ARN — subscribe more destinations here later if needed.
    Value: !Ref AlertsTopic

  LambdaDlqArn:
    Description: >
      DLQ ARN — pass this to the Streams event source mapping's DestinationConfig and
      kcmps-expire-pending-orders' async invoke config (see README's CLI steps).
    Value: !GetAtt LambdaDlq.Arn

  LambdaDlqUrl:
    Description: DLQ URL, for manually inspecting/purging failed records.
    Value: !Ref LambdaDlq
