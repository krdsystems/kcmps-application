        kcmps-streams-handler is falling behind the DynamoDB stream — orderStatus rollups and
        GSI1 sparse-index hygiene are going stale (this Lambda is the ONLY place orderStatus
        gets recomputed).
      Namespace: AWS/Lambda
      MetricName: IteratorAge
      Dimensions:
        - Name: FunctionName
          Value: kcmps-streams-handler
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 300000 # 5 minutes, in milliseconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
