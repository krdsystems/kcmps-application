  # ---- Dashboard — one console page for "is the whole system healthy right now" ----
  #
  # CloudWatch dashboards are free for the first 3 per account (this is the only one this repo
  # has ever created — see backend/infra/README.md's Observability section for a `list-
  # dashboards` check before adding a second). Grouped by BUSINESS CAPABILITY, not by AWS
  # service or a graph-per-Lambda wall — each row is one of the shop's critical paths, using
  # `alarm`-type widgets so red/green status reads at a glance without interpreting a graph.
  # Region is hardcoded to ap-southeast-1 in every metric-widget's `region` property (alarm
  # widgets carry region in the ARN itself, no separate property needed).
