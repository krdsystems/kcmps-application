AWSTemplateFormatVersion: "2010-09-09"
Description: >
  KCMPS Milestone 1.5 observability — SNS alert topic, a shared Lambda dead-letter queue, and
  CloudWatch alarms on every deployed backend Lambda, the Streams handler's IteratorAge, DLQ
  depth, and the checkout API's 5xx rate. All resources here are new — nothing pre-existing is
  imported or modified. See backend/infra/README.md's "Observability — Milestone 1.5" section
  for the CLI steps that wire this stack's outputs into the existing Streams event source
  mapping, expire-pending-orders' async invoke config, and the checkout API's stage throttle
  settings (those touch resources this stack doesn't own, so they stay CLI, not CFN — same
  split the rest of backend/infra/ already uses).

Parameters:
  AlertEmail:
    Type: String
    Default: admin@kcmps.com
    Description: >
      Destination for the SNS topic's email subscription. AWS sends a confirmation email here
      after this stack is created — alarms are silent until that link is clicked.

Resources:
  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: kcmps-ops-alerts
      DisplayName: KCMPS Ops Alerts

  AlertsEmailSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlertsTopic
      Protocol: email
      Endpoint: !Ref AlertEmail

  LambdaDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: kcmps-lambda-dlq
      MessageRetentionPeriod: 345600 # 4 days (SQS default) — a failure inbox nobody should
      # be leaving unread that long anyway.

  # ---- Errors / Throttles — one pair of alarms per deployed Lambda ----

  CreateOrderErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kcmps-create-order-errors
      AlarmDescription: kcmps-create-order threw an unhandled error.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: kcmps-create-order
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlertsTopic]

  CreateOrderThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: kcmps-create-order-throttles
      AlarmDescription: kcmps-create-order is being throttled.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
