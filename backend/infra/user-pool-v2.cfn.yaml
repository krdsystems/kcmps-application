AWSTemplateFormatVersion: "2010-09-09"
Description: >
  KCMPS user pool v2 — a REPLACEMENT Cognito User Pool whose schema requires
  only the attributes the app actually collects (email, given_name,
  family_name). Exists because a pool's `Required` schema flags are immutable
  after creation, so the original pool (ap-southeast-1_iDvAEumNp) can never
  drop its middle_name/preferred_username/name requirements.

  This template only CREATES resources — it does not touch, modify, or delete
  the existing pool. Both pools can coexist indefinitely; cutover is a
  frontend + API-authorizer change, documented in README.md ("User pool v2").

  See README.md for apply/rollback, the Google client-secret handling, the
  account-recreation list, and the cutover checklist.

Parameters:
  PoolName:
    Type: String
    Default: kcmps-user-pool-v2
    Description: Name of the new user pool.

  DomainPrefix:
    Type: String
    Default: kcmps-auth
    Description: >
      Managed-login domain prefix. Must be globally unique across ALL AWS
      accounts in this region — if `kcmps-auth` is taken, CREATE_FAILED will
      say so and you can re-run with another value.

  PostConfirmationLambdaArn:
    Type: String
    Default: arn:aws:lambda:ap-southeast-1:600929977538:function:kcmps-post-confirmation
    Description: >
      Existing PostConfirmation trigger that adds every self-signup to the
      Customer group. Reused as-is — see README "auth/ — Cognito
      PostConfirmation trigger". Its resource policy must also be extended to
      allow invocation from THIS pool's ARN (a manual `lambda:add-permission`
      step, see README) — CloudFormation cannot edit another stack's
      function policy.

  GoogleClientId:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Google OAuth client ID. Leave empty to skip creating the Google IdP
      (the pool still works for email/password). Get it from the Google Cloud
      console — it is NOT readable back out of the existing Cognito pool.

  GoogleClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      Google OAuth client secret. NEVER commit this value or pass it on a
      shell command line that lands in history — see README for the
      recommended `--parameter-overrides file://` approach.

  DeletionProtection:
    Type: String
    Default: INACTIVE
    AllowedValues: [ACTIVE, INACTIVE]
    Description: >
      Left INACTIVE while the pool is still a migration candidate so the
      stack can be torn down cleanly. Flip to ACTIVE at cutover, once real
      users exist in this pool.

Conditions:
  HasGoogle: !Not [!Equals [!Ref GoogleClientId, ""]]

Resources:
  # ---------------------------------------------------------------------------
  # The pool. Differences from the original (ap-southeast-1_iDvAEumNp) are
  # deliberate and listed in README — everything else is a faithful copy.
  # ---------------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Ref PoolName
      DeletionProtection: !Ref DeletionProtection
      UserPoolTier: ESSENTIALS  # required for managed login (branding v2)

      # SAME as the original pool, deliberately: a real Username, with email
      # as an ADDITIONAL sign-in alias. Users can log in with EITHER their
      # username (e.g. admin.kcmps.cognito) or their email address.
      #
      # Do NOT "simplify" this to `UsernameAttributes: [email]`. That makes the
      # email *be* the username and removes username sign-in entirely — and
      # since this is a create-only property, fixing that mistake costs a whole
      # new pool. It was built that way once and had to be rebuilt.
      #
      # Consequence to keep in mind: with aliases, Cognito rejects an
      # email-SHAPED Username outright, which is why index.html's sign-up form
      # validates the customer's chosen username against USERNAME_RE and
      # rejects "@" client-side rather than surfacing a raw
      # InvalidParameterException.
      AliasAttributes: [email]
      UsernameConfiguration:
        CaseSensitive: false

      AutoVerifiedAttributes: [email]
      MfaConfiguration: "OFF"

      # THE POINT OF THIS TEMPLATE. Only these three are Required, and every
      # one of them is something the sign-up form actually asks a human for.
      # No middle_name. No preferred_username. No separate `name`.
      # These flags are immutable once the pool exists — changing this list
      # later means another new pool, so get it right here.
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: given_name
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: family_name
          AttributeDataType: String
          Required: true
          Mutable: true

      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7

      AdminCreateUserConfig:
        # MUST stay false: the custom sign-up form calls the public, secretless
        # SignUp API, which Cognito rejects outright when this is true.
        AllowAdminCreateUserOnly: false

      VerificationMessageTemplate:
        DefaultEmailOption: CONFIRM_WITH_CODE

      EmailConfiguration:
        EmailSendingAccount: COGNITO_DEFAULT

      AccountRecoverySetting:
        RecoveryMechanisms:
          # Original also listed verified_phone_number at priority 2; dropped
          # because this pool has no phone attribute to recover against.
          - Name: verified_email
            Priority: 1

      LambdaConfig:
        PostConfirmation: !Ref PostConfirmationLambdaArn

  # ---------------------------------------------------------------------------
  # App client — mirrors kcmps-web-client. Public SPA client, no secret.
  # ---------------------------------------------------------------------------
  WebClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: kcmps-web-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      # !Ref on the IdP resolves to its provider name ("Google") AND creates an
      # implicit dependency, so the IdP is guaranteed to exist before the client
      # lists it. Don't flatten this to a literal "Google" plus a DependsOn —
      # DependsOn on a false-Condition resource is a trap.
      SupportedIdentityProviders:
        !If
          - HasGoogle
          - [COGNITO, !Ref GoogleIdp]
          - [COGNITO]
      CallbackURLs:
        - http://localhost:5500/
        - http://localhost:5500/login-test.html
        - http://localhost:5501/
        - http://localhost:5501/login-test.html
        - https://dev.kcmps.com/
        - https://kcmps.com/
        - https://site.kcmps.com/
        - https://www.kcmps.com/
      LogoutURLs:
        - http://localhost:5500/
        - http://localhost:5500/login-test.html
        - http://localhost:5501/
        - http://localhost:5501/login-test.html
        - https://dev.kcmps.com/
        - https://kcmps.com/
        - https://site.kcmps.com/
        - https://www.kcmps.com/
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      # CHANGE vs. original: dropped the `phone` scope — this pool has no
      # phone attribute, so requesting it only bloats the consent screen.
      AllowedOAuthScopes: [email, openid, profile]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 3
      RefreshTokenValidity: 5
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # ---------------------------------------------------------------------------
  # App client — the staff Android app's client (android-app/, detected by the
  # site via the KCMPSApp/ User-Agent token). Identical to WebClient EXCEPT the
  # 30-day refresh token validity, which backs the app's Messenger-style
  # persistent sign-in. Deliberately a SEPARATE client so the web keeps its
  # 5-day tokens — do not "simplify" by bumping WebClient's validity instead;
  # sessionStorage + 5 days is a documented XSS-exposure stance for browsers.
  # ---------------------------------------------------------------------------
  AppClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: kcmps-app-client
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      SupportedIdentityProviders:
        !If
          - HasGoogle
          - [COGNITO, !Ref GoogleIdp]
          - [COGNITO]
      CallbackURLs:
        - http://localhost:5500/
        - http://localhost:5500/login-test.html
        - http://localhost:5501/
        - http://localhost:5501/login-test.html
        - https://dev.kcmps.com/
        - https://kcmps.com/
        - https://site.kcmps.com/
        - https://www.kcmps.com/
      LogoutURLs:
        - http://localhost:5500/
        - http://localhost:5500/login-test.html
        - http://localhost:5501/
        - http://localhost:5501/login-test.html
        - https://dev.kcmps.com/
        - https://kcmps.com/
        - https://site.kcmps.com/
        - https://www.kcmps.com/
      AllowedOAuthFlows: [code]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthScopes: [email, openid, profile]
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AuthSessionValidity: 3
      RefreshTokenValidity: 30
      AccessTokenValidity: 60
      IdTokenValidity: 60
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days

  # Same trap as Branding below: a managed-login (v2) domain renders "Login
  # pages unavailable" for any client with no branding style assigned — the
  # app client needs its OWN branding resource or its Hosted UI is dead.
  AppBranding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref AppClient
      UseCognitoProvidedValues: true

  # ---------------------------------------------------------------------------
  # Google federation. Attribute mapping is trimmed to the 3 real attributes —
  # the original mapped Google's `name` onto middle_name AND preferred_username
  # purely to satisfy the required-attribute set, which is exactly the hack
  # this pool exists to delete.
  # ---------------------------------------------------------------------------
  GoogleIdp:
    Type: AWS::Cognito::UserPoolIdentityProvider
    Condition: HasGoogle
    Properties:
      UserPoolId: !Ref UserPool
      ProviderName: Google
      ProviderType: Google
      ProviderDetails:
        client_id: !Ref GoogleClientId
        client_secret: !Ref GoogleClientSecret
        authorize_scopes: profile email openid
      AttributeMapping:
        email: email
        given_name: given_name
        family_name: family_name

  # ---------------------------------------------------------------------------
  # Managed login (branding v2) domain. Note the sign-up link on this domain's
  # sign-in page CANNOT be hidden — managed login branding is a fixed style-token
  # schema with no such control. That is fine here and was not on the original
  # pool: with a 3-attribute schema, Cognito's own sign-up page is a perfectly
  # good second front door. See README "Why the sign-up link is no longer a
  # problem".
  # ---------------------------------------------------------------------------
  Domain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      Domain: !Ref DomainPrefix
      UserPoolId: !Ref UserPool
      ManagedLoginVersion: 2

  # REQUIRED, not cosmetic. A managed-login (v2) domain renders "Login pages
  # unavailable — please contact an administrator" for any app client with no
  # branding style assigned. Creating the pool, client and domain without this
  # produces a completely dead Hosted UI, which is exactly what happened on the
  # first deploy of this stack. UseCognitoProvidedValues gives the stock
  # look; swap to a Settings/Assets document to brand it later.
  Branding:
    Type: AWS::Cognito::ManagedLoginBranding
    Properties:
      UserPoolId: !Ref UserPool
      ClientId: !Ref WebClient
      UseCognitoProvidedValues: true

  # ---------------------------------------------------------------------------
  # Groups — same 6 as the original pool. Customer is what the PostConfirmation
  # trigger writes to; Staff/Admin gate the dashboard (dashboard-shell.js);
  # Production/Sales/Finance are role buckets read by backend/lib/auth.js.
  # The original pool also had an auto-created `<poolId>_Google` group, which
  # Cognito manages itself — not declared here.
  # ---------------------------------------------------------------------------
  CustomerGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Customer
      UserPoolId: !Ref UserPool
      Description: Self-signup storefront customers.

  StaffGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Staff
      UserPoolId: !Ref UserPool
      Description: Ops dashboard access.

  AdminGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admin
      UserPoolId: !Ref UserPool
      Description: Founders — dashboard plus admin-only surfaces.

  ProductionGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Production
      UserPoolId: !Ref UserPool
      Description: Production floor role.

  SalesGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Sales
      UserPoolId: !Ref UserPool
      Description: Sales role.

  FinanceGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Finance
      UserPoolId: !Ref UserPool
      Description: Finance role.

Outputs:
  UserPoolId:
    Description: Paste into COGNITO_CONFIG.userPoolId (index.html, login-test.html).
    Value: !Ref UserPool

  UserPoolArn:
    Description: Needed for the PostConfirmation lambda:add-permission source-arn.
    Value: !GetAtt UserPool.Arn

  ClientId:
    Description: Paste into COGNITO_CONFIG.clientId and the API JWT authorizer audience.
    Value: !Ref WebClient

  AppClientId:
    Description: The Android app's client (30-day refresh) — index.html selects it via the KCMPSApp/ UA token; must also be added to the API JWT authorizer's audience list.
    Value: !Ref AppClient

  HostedUiDomain:
    Description: Paste into COGNITO_CONFIG.domain and every page's CSP connect-src.
    Value: !Sub https://${DomainPrefix}.auth.${AWS::Region}.amazoncognito.com

  JwtIssuer:
    Description: New issuer for the kcmps-cognito-jwt authorizer on API 6msg2uho6c.
    Value: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
