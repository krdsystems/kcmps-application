AWSTemplateFormatVersion: "2010-09-09"
Description: >
  KCMPS DR — EDGE stack (prod only). Deploy in us-east-1 (CloudFront/ACM/
  WAFv2 are only creatable from us-east-1). Creates the shared Origin
  Access Control, the prod redirect Function, a WAFv2 WebACL on the prod
  distribution, the prod distribution itself, and the prod statement of
  the S3 bucket policy. Deploy AFTER kcmps-dr-core.yaml. Does NOT cover
  dev.kcmps.com — that's storefront-infra/dev-domain.cfn.yaml, the single
  source of truth for dev; see ../README.md "Recovering dev.kcmps.com".

Parameters:
  BucketName:
    Type: String
    Description: Output of kcmps-dr-core.yaml.

  BucketRegionalDomainName:
    Type: String
    Description: Output of kcmps-dr-core.yaml, e.g. kcmps-online-bucket-est-2026.s3.ap-southeast-1.amazonaws.com

  AcmCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:600929977538:certificate/c2758183-3a3a-43b2-bdd6-f6c0848edfb6
    Description: >
      Existing ACM cert (us-east-1) covering kcmps.com + *.kcmps.com, expires
      2027-01-30. ACM certs are NOT deleted when CloudFront/S3 are — reuse
      this ARN. Only reissue (DNS-validated against the zone in the
      260866268499 account) if the certificate itself was deleted, then
      override this parameter with the new ARN.

Resources:
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: site-kcmps-redirect
      FunctionConfig:
        Comment: 301-redirects site.kcmps.com to https://kcmps.com, passes every other host through.
        Runtime: cloudfront-js-2.0
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var host = request.headers.host.value;

            if (host === 'site.kcmps.com') {
                var qs = '';
                var keys = Object.keys(request.querystring);
                if (keys.length > 0) {
                    var parts = [];
                    for (var i = 0; i < keys.length; i++) {
                        var k = keys[i];
                        var v = request.querystring[k].value;
                        parts.push(v ? k + '=' + v : k);
                    }
                    qs = '?' + parts.join('&');
                }
                return {
                    statusCode: 301,
                    statusDescription: 'Moved Permanently',
                    headers: {
                        'location': { value: 'https://kcmps.com' + request.uri + qs }
                    }
                };
            }

            return request;
        }

  ProdWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: kcmps-prod-managed-protections
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: kcmps-prod-managed-protections
      Rules:
        - Name: AWS-AWSManagedRulesAmazonIpReputationList
          Priority: 0
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWS-AWSManagedRulesAmazonIpReputationList
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWS-AWSManagedRulesCommonRuleSet
        - Name: AWS-AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWS-AWSManagedRulesKnownBadInputsRuleSet

  ProdDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: kcmps web online
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_All
        WebACLId: !GetAtt ProdWebAcl.Arn
        Aliases: [kcmps.com, www.kcmps.com, site.kcmps.com]
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: prod-origin
            DomainName: !Ref BucketRegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: prod-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # AWS managed "CachingDisabled" — matches live config
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SiteRedirectFunction.FunctionMetadata.FunctionARN

  # Prod's statement only. The dev distribution's read-access statement is
  # added as a separate manual `aws s3api put-bucket-policy` step (full
  # replace, both statements present) AFTER deploying
  # storefront-infra/dev-domain.cfn.yaml — see storefront-infra/CLAUDE.md
  # "Bucket policy is NOT CloudFormation-managed" for why that stack can't
  # own it either (AWS::S3::BucketPolicy's Create handler refuses to touch
  # a bucket that already has an externally-applied policy), and
  # ../README.md "Recovering dev.kcmps.com" for the exact command.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketName
      PolicyDocument:
        Version: "2008-10-17"
        Id: PolicyForCloudFrontPrivateContent
        Statement:
          - Sid: AllowCloudFrontServicePrincipalProd
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${BucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ProdDistribution}"

Outputs:
  ProdDistributionId:
    Value: !Ref ProdDistribution
  ProdDistributionDomainName:
    Description: Feed into kcmps-dns-records.yaml's CloudFrontDomainName parameter.
    Value: !GetAtt ProdDistribution.DomainName
  OriginAccessControlId:
    Description: >
      Feed into storefront-infra/dev-domain.cfn.yaml's OriginAccessControlId
      parameter when recreating dev.kcmps.com after a full recovery — that
      template defaults to today's OAC id (E233V4Y9BPPX6H), which won't
      exist anymore if this stack had to recreate the OAC from scratch.
    Value: !GetAtt SiteOriginAccessControl.Id
