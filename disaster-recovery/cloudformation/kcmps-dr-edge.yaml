AWSTemplateFormatVersion: "2010-09-09"
Description: >
  KCMPS DR — EDGE stack. Deploy in us-east-1 (CloudFront/ACM/WAFv2 are only
  creatable from us-east-1 regardless of where the distribution actually
  serves traffic). Creates: the shared Origin Access Control, the two
  CloudFront Functions (prod's site.kcmps.com redirect, dev's basic-auth
  gate), the dev response-headers policy, a WAFv2 WebACL (3 AWS managed
  rule groups, matching what's live on prod today) attached only to the
  prod distribution, both CloudFront distributions, and the S3 bucket
  policy (lives here, not in the core stack, because it needs both
  distributions' ARNs). Deploy AFTER kcmps-dr-core.yaml, passing its
  BucketName + BucketRegionalDomainName outputs in.

Parameters:
  BucketName:
    Type: String
    Description: Output of kcmps-dr-core.yaml.

  BucketRegionalDomainName:
    Type: String
    Description: Output of kcmps-dr-core.yaml, e.g. kcmps-online-bucket-est-2026.s3.ap-southeast-1.amazonaws.com

  AcmCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:600929977538:certificate/c2758183-3a3a-43b2-bdd6-f6c0848edfb6
    Description: >
      Existing ACM cert (us-east-1) covering kcmps.com + *.kcmps.com, expires
      2027-01-30. ACM certs are NOT deleted when CloudFront/S3 are — reuse
      this ARN. Only reissue (DNS-validated against the zone in the
      260866268499 account) if the certificate itself was deleted, then
      override this parameter with the new ARN.

  DevBasicAuthCredential:
    Type: String
    NoEcho: true
    Description: >
      Base64 of "username:password" for the dev.kcmps.com basic-auth gate,
      e.g. output of `echo -n 'user:pass' | base64`. Not defaulted here on
      purpose — the real current value is a live credential; retrieve/rotate
      it out of band (e.g. a password manager or SSM SecureString) and pass
      it at deploy time. Leave blank to deploy the dev site with no gate
      (not recommended — see root CLAUDE.md, dev is meant to stay unindexed
      and ungated pages would be publicly browsable WIP).

Conditions:
  HasDevBasicAuth: !Not [!Equals [!Ref DevBasicAuthCredential, ""]]

Resources:
  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteRedirectFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: site-kcmps-redirect
      FunctionConfig:
        Comment: 301-redirects site.kcmps.com to https://kcmps.com, passes every other host through.
        Runtime: cloudfront-js-2.0
      AutoPublish: true
      FunctionCode: |
        function handler(event) {
            var request = event.request;
            var host = request.headers.host.value;

            if (host === 'site.kcmps.com') {
                var qs = '';
                var keys = Object.keys(request.querystring);
                if (keys.length > 0) {
                    var parts = [];
                    for (var i = 0; i < keys.length; i++) {
                        var k = keys[i];
                        var v = request.querystring[k].value;
                        parts.push(v ? k + '=' + v : k);
                    }
                    qs = '?' + parts.join('&');
                }
                return {
                    statusCode: 301,
                    statusDescription: 'Moved Permanently',
                    headers: {
                        'location': { value: 'https://kcmps.com' + request.uri + qs }
                    }
                };
            }

            return request;
        }

  DevBasicAuthFunction:
    Type: AWS::CloudFront::Function
    Condition: HasDevBasicAuth
    Properties:
      Name: kcmps-dev-basic-auth
      FunctionConfig:
        Comment: Basic-auth gate for dev.kcmps.com so WIP isn't publicly browsable.
        Runtime: cloudfront-js-2.0
      AutoPublish: true
      FunctionCode: !Sub |
        function handler(event) {
            var request = event.request;
            var headers = request.headers;
            var expected = "Basic ${DevBasicAuthCredential}";

            if (
                typeof headers.authorization === "undefined" ||
                headers.authorization.value !== expected
            ) {
                return {
                    statusCode: 401,
                    statusDescription: "Unauthorized",
                    headers: {
                        "www-authenticate": { value: 'Basic realm="KCMPS dev"' }
                    }
                };
            }

            return request;
        }

  DevNoIndexResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: kcmps-dev-noindex
        Comment: Belt-and-suspenders — keeps dev out of search indexes even though it's auth-gated.
        CustomHeadersConfig:
          Items:
            - Header: X-Robots-Tag
              Value: "noindex, nofollow, noarchive"
              Override: true

  ProdWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: kcmps-prod-managed-protections
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: kcmps-prod-managed-protections
      Rules:
        - Name: AWS-AWSManagedRulesAmazonIpReputationList
          Priority: 0
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWS-AWSManagedRulesAmazonIpReputationList
        - Name: AWS-AWSManagedRulesCommonRuleSet
          Priority: 1
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWS-AWSManagedRulesCommonRuleSet
        - Name: AWS-AWSManagedRulesKnownBadInputsRuleSet
          Priority: 2
          OverrideAction: { None: {} }
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWS-AWSManagedRulesKnownBadInputsRuleSet

  ProdDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: kcmps web online
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_All
        WebACLId: !GetAtt ProdWebAcl.Arn
        Aliases: [kcmps.com, www.kcmps.com, site.kcmps.com]
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: prod-origin
            DomainName: !Ref BucketRegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: prod-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # AWS managed "CachingDisabled" — matches live config
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt SiteRedirectFunction.FunctionMetadata.FunctionARN

  DevDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: kcmps dev/staging site
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Aliases: [dev.kcmps.com]
        ViewerCertificate:
          AcmCertificateArn: !Ref AcmCertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: dev-origin
            DomainName: !Ref BucketRegionalDomainName
            OriginPath: /dev-site
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: dev-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # AWS managed "CachingDisabled"
          ResponseHeadersPolicyId: !Ref DevNoIndexResponseHeadersPolicy
          FunctionAssociations: !If
            - HasDevBasicAuth
            - - EventType: viewer-request
                FunctionARN: !GetAtt DevBasicAuthFunction.FunctionMetadata.FunctionARN
            - []

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref BucketName
      PolicyDocument:
        Version: "2008-10-17"
        Id: PolicyForCloudFrontPrivateContent
        Statement:
          - Sid: AllowCloudFrontServicePrincipalProd
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${BucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${ProdDistribution}"
          - Sid: AllowCloudFrontServicePrincipalDev
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${BucketName}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${DevDistribution}"

Outputs:
  ProdDistributionId:
    Value: !Ref ProdDistribution
  ProdDistributionDomainName:
    Description: Feed into kcmps-dns-records.yaml's CloudFrontDomainName parameter.
    Value: !GetAtt ProdDistribution.DomainName
  DevDistributionId:
    Value: !Ref DevDistribution
  DevDistributionDomainName:
    Description: Feed into kcmps-dns-records.yaml's DevCloudFrontDomainName parameter.
    Value: !GetAtt DevDistribution.DomainName
