<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" />
<title>Design Library — KCMPS Ops</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dash-gate-hide">

<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"><div id="dash-nav"></div></aside>
  <div class="dash-main">
    <header class="dash-topbar">
      <button type="button" id="dash-nav-toggle" class="dash-nav-toggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16Zm176,112H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
      </button>
      <div id="dash-topbar-content" style="display:flex;justify-content:space-between;align-items:center;flex:1;gap:var(--space-3)"></div>
    </header>

    <main class="dash-content">
      <section class="dsec">
        <div class="dsec-head">
          <h2>Design asset library <span class="badge-soon">Skeleton</span></h2>
          <span class="hint">UI structure only — no backend yet. See docs/roadmap.md "Parallel track — Design Asset Library"</span>
        </div>

        <!-- Upload form is a structural placeholder: fields match the planned
             DESIGN# item shape (name/description/category/tags + original +
             web-ready file) but submit has no backend to call yet — a future
             session wires this to POST /designs/upload-url once
             backend/design-library/ exists. Category options are sourced from
             the same catalog leaves the storefront uses so they can't drift. -->
        <div class="card" style="padding: var(--space-5); margin-bottom: var(--space-4)">
          <h3 style="margin-top:0">Upload a design</h3>
          <form id="design-upload-form">
            <div class="field"><label for="d-name">Name</label><input class="input" id="d-name" required /></div>
            <div class="field"><label for="d-desc">Description</label><input class="input" id="d-desc" /></div>
            <div class="field"><label for="d-category">Category</label><select class="input" id="d-category" required></select></div>
            <div class="field"><label for="d-tags">Tags (comma separated)</label><input class="input" id="d-tags" /></div>
            <div class="field"><label for="d-original">Original file (private)</label><input class="input" id="d-original" type="file" required /></div>
            <div class="field"><label for="d-web">Web-ready image (published)</label><input class="input" id="d-web" type="file" /></div>
            <button type="submit" class="btn btn-primary" disabled title="Backend not built yet">Upload (not wired yet)</button>
          </form>
        </div>

        <div class="card" style="padding: var(--space-5)">
          <h3 style="margin-top:0">Library</h3>
          <div class="design-grid" id="design-grid"><!-- design cards render here --></div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="../products.js"></script>
<script src="dashboard-data.js"></script>
<script src="dashboard-shell.js"></script>
<script>
(() => {
  const claims = KCMPS_DASH_SHELL.mount("design");
  if (!claims) return;

  const categorySel = document.getElementById("d-category");
  const leaves = (window.KCMPS_STORE_DATA && window.KCMPS_STORE_DATA.leaves) || {};
  categorySel.innerHTML = Object.keys(leaves).map((key) => (
    `<option value="${key}">${leaves[key].label || key}</option>`
  )).join("");

  async function renderGrid() {
    const designs = await KCMPS_DASH.getDesigns();
    const grid = document.getElementById("design-grid");
    grid.innerHTML = designs.length
      ? designs.map((d) => `<div class="card">${d.name}</div>`).join("")
      : '<p class="q-empty">No designs uploaded yet.</p>';
  }

  // Structural only — actual upload needs backend/design-library/'s
  // get-upload-url.js Lambda, which doesn't exist yet.
  document.getElementById("design-upload-form").addEventListener("submit", (e) => {
    e.preventDefault();
  });

  renderGrid();
})();
</script>
</body>
</html>
