<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://6msg2uho6c.execute-api.ap-southeast-1.amazonaws.com https://162ufc121j.execute-api.ap-southeast-1.amazonaws.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" />
<title>Email — KCMPS Ops</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dash-gate-hide">

<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"><div id="dash-nav"></div></aside>
  <div class="dash-main">
    <header class="dash-topbar">
      <button type="button" id="dash-nav-toggle" class="dash-nav-toggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16Zm176,112H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
      </button>
      <div id="dash-topbar-content" style="display:flex;justify-content:space-between;align-items:center;flex:1;gap:var(--space-3)"></div>
    </header>

    <main class="dash-content mail-wide">
      <div class="mail-toolbar">
        <label for="mb-select" class="hint" style="font-size:12.5px">Mailbox</label>
        <select class="input" id="mb-select"></select>
        <span class="queue-count" id="mb-unread">0</span>
        <input type="search" class="input mail-search" id="mail-search" placeholder="Search subject or sender" />
        <!-- Mail arrives by relay (Spacemail -> SES -> ingest), so there is no push
             signal to the page and no polling here. A visible manual reload is the
             honest answer: staff decide when to check, and the timestamp next to it
             says how stale what they are looking at actually is. -->
        <span class="hint mail-updated" id="mail-updated" aria-live="polite"></span>
        <button type="button" class="btn btn-secondary mail-refresh" id="mail-refresh">
          <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M240,56v48a8,8,0,0,1-8,8H184a8,8,0,0,1,0-16H211.4L184.81,71.64l-.25-.24a80,80,0,1,0-1.67,114.78,8,8,0,0,1,11,11.63A96,96,0,1,1,195.88,60.19L224,84.4V56a8,8,0,1,1,16,0Z"/></svg>
          Reload
        </button>
      </div>

      <div class="mail-3pane" id="mail-3pane">
        <aside class="card mail-list"><div class="q-list" id="mail-list"></div></aside>
        <section class="card mail-read" id="mail-read"></section>
      </div>
    </main>
  </div>
</div>

<script src="dashboard-data.js"></script>
<script src="dashboard-shell.js"></script>
<script>
(() => {
  const claims = KCMPS_DASH_SHELL.mount("email");
  if (!claims) return;
  const { escapeHtml, fmtDateTime, withBusy, showInlineError } = KCMPS_DASH_SHELL;

  let currentMailboxId = null;
  // Set by renderMailboxSelector() when the API returns zero mailboxes, so the
  // list/read panes can distinguish "no access" from "no mail" (see there).
  let noMailboxAccess = false;
  let currentMessageId = null;
  let search = "";
  let replyDraft = "";

  const pane = document.getElementById("mail-3pane");
  const listEl = document.getElementById("mail-list");
  const readEl = document.getElementById("mail-read");
  const selectEl = document.getElementById("mb-select");
  const unreadEl = document.getElementById("mb-unread");
  const searchEl = document.getElementById("mail-search");
  const refreshEl = document.getElementById("mail-refresh");
  const updatedEl = document.getElementById("mail-updated");

  function relAge(iso) {
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 60) return mins + "m";
    if (mins < 60 * 24) return Math.round(mins / 60) + "h";
    return Math.round(mins / 1440) + "d";
  }
  function senderOf(m) { return m.from.name || m.from.address; }
  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
    return (Math.round(bytes / 104857.6) / 10) + " MB";
  }

  /* ---- mailbox selector ---- */
  async function renderMailboxSelector() {
    const boxes = await KCMPS_DASH.getMailboxes();
    if (!boxes.length) {
      // An empty list is NOT the same as "no mail has arrived" — mailbox
      // capability is group-based (backend/lib/mail.js's canAccessMailbox:
      // Sales/Finance/Admin, deliberately NOT Staff), so a legitimately
      // signed-in Staff-only account gets `{"mailboxes":[]}` here. Rendering
      // that identically to an empty inbox is how a permissions problem
      // masquerades as "quiet day". Say which it is.
      noMailboxAccess = true;
      selectEl.innerHTML = "";
      selectEl.disabled = true;
      unreadEl.textContent = "";
      unreadEl.classList.remove("has-red");
      return boxes;
    }
    noMailboxAccess = false;
    selectEl.disabled = false;
    if (!currentMailboxId) currentMailboxId = boxes[0].id;
    selectEl.innerHTML = boxes.map((mb) => {
      const label = mb.label + " — " + mb.address;
      const badge = mb.unreadCount ? " (" + mb.unreadCount + ")" : "";
      return `<option value="${escapeHtml(mb.id)}"${mb.id === currentMailboxId ? " selected" : ""}>${escapeHtml(label)}${badge}</option>`;
    }).join("");
    const active = boxes.find((mb) => mb.id === currentMailboxId);
    unreadEl.textContent = active ? active.unreadCount + " unread" : "0 unread";
    unreadEl.classList.toggle("has-red", !!(active && active.unreadCount));
    return boxes;
  }

  /* ---- message list ---- */
  async function renderList() {
    if (!currentMailboxId) {
      listEl.innerHTML = noMailboxAccess
        ? '<p class="q-empty">No mailboxes are assigned to your account.</p>'
        : '<p class="q-empty">No mailboxes available.</p>';
      return;
    }
    const res = await KCMPS_DASH.getMessages(currentMailboxId, { search });
    if (!res.messages.length) {
      listEl.innerHTML = '<p class="q-empty">' + (search ? "No messages match that search." : "Inbox is empty.") + "</p>";
      return;
    }
    listEl.innerHTML = res.messages.map((m) => {
      const cls = "q-item" + (m.flags.seen ? "" : " sla-warn") + (m.messageId === currentMessageId ? " is-open" : "");
      const marks = m.flags.answered ? "replied" : "";
      return (
        `<div class="${cls}" data-msg="${escapeHtml(m.messageId)}" role="button" tabindex="0">` +
        `<div class="q-line1"><span>${escapeHtml(senderOf(m))}</span><span class="q-age">${relAge(m.date)}</span></div>` +
        `<div class="q-line2"><span>${escapeHtml(m.subject)} — ${escapeHtml(m.snippet)}</span><span>${marks}</span></div>` +
        "</div>"
      );
    }).join("");

    listEl.querySelectorAll("[data-msg]").forEach((row) => {
      const open = () => openMessage(row.dataset.msg);
      row.addEventListener("click", open);
      row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });
  }

  async function openMessage(messageId) {
    currentMessageId = messageId;
    replyDraft = "";
    await KCMPS_DASH.markMessageRead(currentMailboxId, messageId, true);
    pane.classList.add("show-read");
    await renderMailboxSelector();
    await renderList();
    await renderRead();
  }

  /* ---- read pane ----
     SAFETY: every field below is attacker-controlled (a display name, a
     subject, an attachment filename), so all of it goes through escapeHtml.
     v1 deliberately renders NOTHING but plain text:
       - HTML parts are never rendered (an iframe is ruled out in
         docs/roadmap.md, and a hand-maintained sanitizer is not worth the
         risk for a triage panel) — a notice is shown instead
       - remote images are never loaded; the page CSP (img-src 'self' data:)
         fails closed anyway, and remote images are tracking pixels
       - attachments are metadata-only; there is no download path yet
       - URLs are not auto-linkified; auto-<a> on arbitrary mail is a
         phishing amplifier                                               ---- */
  /* ---- provenance strip ----
     Mail reaches this panel by being FORWARDED — Spacemail relays the one
     real admin@kcmps.com mailbox to an SES receiving address, and
     backend/mail/ingest-inbound.js splits it back into order@/info@/admin@.
     A forwarded message is a message that has been through a third party,
     so staff need to see how much of it is actually vouched for.

     What the four verdicts mean here (backend/lib/mail.js's assessVerdicts
     has the authoritative version):
       virus / spam — SES's scanners. A non-pass never reaches this page at
         all; ingest hard-rejects it into the Admin-only quarantine mailbox
         with the body stripped. Shown because "scanned, clean" is itself
         the useful signal.
       dkim — THE positive signal. DKIM survives forwarding intact, so a
         pass genuinely means the message is from who it claims.
       spf — recorded, NEVER enforced. Forwarding breaks SPF by design (the
         forwarder relays from its own IPs), so an SPF fail on this page is
         expected and means nothing on its own. Labelled as such so nobody
         reads it as an alarm.
     Plus whether the expected forwarder appears in the `Received:` chain —
     a message that did not come via the forwarder got here some other way,
     which is worth a look even though nothing blocks it.

     SAFETY: same rules as the rest of this page. Every value is
     server-derived rather than attacker-supplied, but it still goes
     through escapeHtml — the whole point of the plain-text-only design is
     that no field gets a pass. No links, no HTML, no images.

     C4 NOTE: reads m.provenance, which the real backend attaches to every
     message item. Absent on the current mock data, in which case this
     renders a single "not recorded" line rather than breaking. ---- */
  const CHECK_LABELS = [
    ["virus", "Virus", "SES scanned the message and found no malware."],
    ["spam", "Spam", "SES's spam scoring did not flag this message."],
    ["dkim", "DKIM", "The sending domain's cryptographic signature verified — this is the strongest proof the sender is who they claim."],
    ["spf", "SPF", "Recorded but never enforced: forwarding breaks SPF by design, so a failure here is expected and is not treated as suspicious."],
  ];

  /* Four inline check marks in the message header, details on hover/tap.
     The verdicts are REAL — SES computes them at receipt time and
     ingest-inbound.js persists all four verbatim; nothing here is decorative.

     Collapsed by default because the healthy case (four passes) is the boring
     case and does not deserve a whole block above the message body. BUT a
     non-pass must never be hidden behind a hover: anything a staff member needs
     in order to distrust a message stays visible as a banner via
     renderProvenanceAlert() below. Hover is an affordance for detail, never the
     only route to a warning — hover does not exist on touch, and this page's
     whole job is to be un-phishable. */
  function renderChecks(m) {
    const p = m && m.provenance;
    if (!p) return '<div class="m-block"><h4>Checks</h4><p class="q-empty">Not recorded</p></div>';
    const v = p.verdicts || {};

    const mark = (val) => (val === "PASS" ? "✓" : (!val || val === "UNKNOWN" ? "?" : "✕"));
    const cls = (val) => (val === "PASS" ? "ck-good" : (!val || val === "UNKNOWN" ? "ck-unknown" : "ck-bad"));

    const icons = CHECK_LABELS.map(([key, label]) => {
      const val = String(v[key] || "UNKNOWN").toUpperCase();
      return '<span class="ck ' + cls(val) + '" aria-hidden="true">' + mark(val) + "</span>";
    }).join("");

    const rows = CHECK_LABELS.map(([key, label, why]) => {
      const val = String(v[key] || "UNKNOWN").toUpperCase();
      return '<li class="' + cls(val) + '"><b>' + escapeHtml(label) + ": " + escapeHtml(val) + "</b>" +
        '<span>' + escapeHtml(why) + "</span></li>";
    }).join("");

    // Screen readers and keyboard users get the full result without hovering.
    const summary = CHECK_LABELS
      .map(([key, label]) => label + " " + String(v[key] || "unknown").toLowerCase())
      .join(", ");

    // Routing context lives in the popover too — useful, but not a warning.
    const foot = [];
    if (p.viaExpectedForwarder === true) {
      foot.push("Arrived via the expected forwarder" + (p.expectedForwarder ? " (" + p.expectedForwarder + ")" : "") + ".");
    }
    if (p.routedBy === "infra-notice") foot.push("Automated AWS notification, kept out of the customer mailboxes.");
    if (p.deliveredTo && p.deliveredTo.length) foot.push("Originally addressed to: " + p.deliveredTo.join(", "));

    return '<div class="m-block mail-checks"><h4>Checks</h4>' +
      '<button type="button" class="ck-trigger" aria-expanded="false" aria-label="Delivery checks: ' + escapeHtml(summary) + '">' +
      icons + "</button>" +
      '<div class="ck-pop" role="tooltip"><ul>' + rows + "</ul>" +
      foot.map((f) => '<p class="ck-foot">' + escapeHtml(f) + "</p>").join("") + "</div></div>";
  }

  /* Anything that should make a staff member suspicious stays on screen. */
  function renderProvenanceAlert(m) {
    const p = m && m.provenance;
    if (!p) return "";
    const v = p.verdicts || {};
    const bad = [];

    if (v.virus && v.virus !== "PASS") bad.push("SES did not clear this message for malware (virus: " + v.virus + ").");
    if (v.spam && v.spam !== "PASS") bad.push("SES flagged this message as spam (spam: " + v.spam + ").");
    if (p.viaExpectedForwarder === false) {
      bad.push("This message does NOT show the expected forwarder in its Received chain — it reached the relay by some other path. Treat it with suspicion.");
    }
    if (p.routedBy === "to-cc") {
      bad.push("Filed using the To/Cc header — no forwarder envelope header was present, so the mailbox is a best guess.");
    } else if (p.routedBy === "unrouted") {
      bad.push("No known KCMPS address was found on this message.");
    }
    if (!bad.length) return "";
    return bad.map((n) => '<p class="mail-notice mail-notice-warn">' + escapeHtml(n) + "</p>").join("");
  }

  async function renderRead(flash) {
    if (!currentMailboxId) {
      readEl.innerHTML = noMailboxAccess
        ? '<div class="empty-state"><p><b>No mailboxes are assigned to your account.</b></p>' +
          '<p class="hint">Shared mailbox access comes from the <b>Sales</b>, <b>Finance</b> or ' +
          '<b>Admin</b> group — a <b>Staff</b>-only account has dashboard access but no mailbox ' +
          'of its own. Ask an Admin to add you to the group that matches your work.</p></div>'
        : '<div class="empty-state">Select a message to read it.</div>';
      return;
    }
    const [boxes, m] = await Promise.all([
      KCMPS_DASH.getMailboxes(),
      currentMessageId ? KCMPS_DASH.getMessage(currentMailboxId, currentMessageId) : Promise.resolve(null),
    ]);
    const mb = boxes.find((x) => x.id === currentMailboxId);
    if (!m) {
      readEl.innerHTML = '<div class="empty-state">Select a message to read it.</div>';
      return;
    }

    const thread = (await KCMPS_DASH.getThread(currentMailboxId, m.threadId)).filter((t) => t.messageId !== m.messageId);
    const parts = [];

    parts.push('<button type="button" class="btn btn-ghost mail-back" id="mail-back">&larr; Back to list</button>');

    parts.push(
      '<div class="ticket-head"><h2 style="margin:0;font-size:19px">' + escapeHtml(m.subject) + "</h2>" +
      '<span class="status-pill ' + (m.flags.answered ? "st-good" : "st-neutral") + (flash ? " dash-flash" : "") + '">' +
      (m.flags.answered ? "Replied" : "Read") + "</span></div>"
    );

    const meta =
      '<div class="m-block"><h4>From</h4><p>' + escapeHtml(senderOf(m)) + "</p></div>" +
      '<div class="m-block"><h4>Address</h4><p>' + escapeHtml(m.from.address) + "</p></div>" +
      '<div class="m-block"><h4>Received</h4><p>' + fmtDateTime(m.date) + "</p></div>" +
      renderChecks(m) +
      (m.relatedOrderId
        ? '<div class="m-block"><h4>Related order</h4><p><a href="job-detail.html?order=' +
          encodeURIComponent(m.relatedOrderId) + '">' + escapeHtml(m.relatedOrderId) + "</a></p></div>"
        : "");
    parts.push('<div class="ticket-meta">' + meta + "</div>");

    parts.push(renderProvenanceAlert(m));

    if (m.hasHtmlPart) {
      parts.push('<p class="mail-notice">This message has an HTML version. KCMPS Ops shows the plain-text version only, and never loads remote images.</p>');
    }

    parts.push('<pre class="mail-body">' + escapeHtml(m.bodyText) + "</pre>");

    if (m.attachments && m.attachments.length) {
      parts.push(
        '<div style="margin-top:var(--space-3)">' +
        m.attachments.map((a) =>
          '<span class="tag tag-outline">' + escapeHtml(a.filename) + " · " + fmtSize(a.sizeBytes) + "</span> "
        ).join("") +
        '<p class="q-empty">Attachments are listed for reference only — open them in your mail client for now.</p></div>'
      );
    }

    if (thread.length) {
      parts.push(
        '<h3 style="margin:var(--space-5) 0 var(--space-2);font-size:14px">Earlier in this thread</h3><div class="timeline">' +
        thread.map((t) =>
          '<div class="timeline-row"><span class="tl-time">' + fmtDateTime(t.date) + "</span>" +
          '<span class="tl-transition">' + escapeHtml(senderOf(t)) + "</span>" +
          "<span>" + escapeHtml(t.snippet) + "</span></div>"
        ).join("") + "</div>"
      );
    }

    if (mb && mb.canSend) {
      parts.push(
        '<div class="mail-reply"><label class="hint" for="reply-body" style="font-size:12.5px">Reply to ' +
        escapeHtml(senderOf(m)) + "</label>" +
        '<textarea class="input" id="reply-body" rows="5" placeholder="Type your reply…">' + escapeHtml(replyDraft) + "</textarea>" +
        '<div id="reply-error"></div>' +
        '<div class="action-bar"><button type="button" class="btn btn-primary" id="reply-send">Send reply</button>' +
        '<button type="button" class="btn btn-ghost" id="reply-discard">Discard</button></div></div>'
      );
    } else {
      parts.push('<p class="mail-notice">This mailbox is read-only — replies are disabled.</p>');
    }

    readEl.innerHTML = parts.join("");
    readEl.scrollTop = 0;

    document.getElementById("mail-back").addEventListener("click", () => {
      pane.classList.remove("show-read");
    });

    const bodyInput = document.getElementById("reply-body");
    if (bodyInput) {
      bodyInput.addEventListener("input", () => { replyDraft = bodyInput.value; });
      const replyErrorHost = document.getElementById("reply-error");
      document.getElementById("reply-send").addEventListener("click", async (e) => {
        replyErrorHost.innerHTML = "";
        await withBusy(e.currentTarget, async () => {
          let result;
          try {
            result = await KCMPS_DASH.sendReply(currentMailboxId, currentMessageId, { bodyText: bodyInput.value });
          } catch (err) {
            showInlineError(replyErrorHost, err.message);
            return;
          }
          replyDraft = "";
          await renderAll(true);
          // "Sent but local record couldn't be updated" is not a failure —
          // the email already went out and there is no un-send — so this
          // is shown after the repaint, not treated as an error.
          if (result && result.warning) showInlineError(replyErrorHost, result.warning);
        });
      });
      document.getElementById("reply-discard").addEventListener("click", () => {
        replyDraft = "";
        bodyInput.value = "";
      });
    }
  }

  async function renderAll(flash) {
    await renderMailboxSelector();
    await renderList();
    await renderRead(flash);
    stampUpdated();
  }

  /* Every getMailboxes/getMessages/getMessage call goes straight to the API via
     apiFetch — there is no client-side cache to bust — so re-running renderAll()
     IS a hard reload. Selected mailbox, open message and search term are held in
     module state and deliberately survive it: a reload should refresh what you
     are looking at, not throw you back to an empty list. */
  function stampUpdated() {
    if (!updatedEl) return;
    const t = new Date();
    updatedEl.textContent = "Updated " +
      String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
  }

  selectEl.addEventListener("change", () => {
    currentMailboxId = selectEl.value;
    currentMessageId = null;
    replyDraft = "";
    pane.classList.remove("show-read");
    renderAll();
  });
  searchEl.addEventListener("input", () => { search = searchEl.value; renderList(); });

  /* Tap-to-toggle for the checks popover. Delegated on the read pane because
     the message body is re-rendered on every open/reload, so a listener bound
     to the button itself would be lost. Hover is handled in CSS for mouse
     users; this is what makes it reachable on touch, where :hover never fires
     (and where a hover-only affordance would silently hide the detail). */
  readEl.addEventListener("click", (e) => {
    const trigger = e.target.closest && e.target.closest(".ck-trigger");
    const openOne = readEl.querySelector(".mail-checks.is-open");
    if (openOne && openOne !== (trigger && trigger.parentElement)) {
      openOne.classList.remove("is-open");
      const b = openOne.querySelector(".ck-trigger");
      if (b) b.setAttribute("aria-expanded", "false");
    }
    if (!trigger) return;
    const host = trigger.parentElement;
    const nowOpen = !host.classList.contains("is-open");
    host.classList.toggle("is-open", nowOpen);
    trigger.setAttribute("aria-expanded", nowOpen ? "true" : "false");
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const openOne = readEl.querySelector(".mail-checks.is-open");
    if (!openOne) return;
    openOne.classList.remove("is-open");
    const b = openOne.querySelector(".ck-trigger");
    if (b) { b.setAttribute("aria-expanded", "false"); b.focus(); }
  });

  if (refreshEl) {
    refreshEl.addEventListener("click", () => {
      // withBusy disables the button and swaps in a spinner for the duration,
      // so a staff member cannot stack a queue of reloads on a slow connection.
      withBusy(refreshEl, async () => {
        try {
          await renderAll();
        } catch (err) {
          showInlineError(listEl, "Could not reload messages. " + (err && err.message ? err.message : ""));
        }
      });
    });
  }

  renderAll();
})();
</script>
</body>
</html>
