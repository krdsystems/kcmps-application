<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://kcmps-payment-uploads-est-2026.s3.ap-southeast-1.amazonaws.com https://kcmps-payment-uploads-staging.s3.ap-southeast-1.amazonaws.com; connect-src 'self' https://6msg2uho6c.execute-api.ap-southeast-1.amazonaws.com https://162ufc121j.execute-api.ap-southeast-1.amazonaws.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" />
<title>Email — KCMPS Ops</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dash-gate-hide">

<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"><div id="dash-nav"></div></aside>
  <div class="dash-main">
    <header class="dash-topbar">
      <button type="button" id="dash-nav-toggle" class="dash-nav-toggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16Zm176,112H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
      </button>
      <div id="dash-topbar-content" style="display:flex;justify-content:space-between;align-items:center;flex:1;gap:var(--space-3)"></div>
    </header>

    <main class="dash-content mail-wide">
      <div class="mail-toolbar">
        <label for="mb-select" class="hint" style="font-size:12.5px">Mailbox</label>
        <select class="input" id="mb-select"></select>
        <span class="queue-count" id="mb-unread">0</span>
        <div class="mail-folder-toggle" id="mail-folder-toggle" role="group" aria-label="Folder">
          <button type="button" class="is-active" data-folder="INBOX">Inbox</button>
          <button type="button" data-folder="SENT">Sent</button>
        </div>
        <button type="button" class="mail-chip-toggle" id="mail-unread-filter" aria-pressed="false">Unread only</button>
        <div class="mail-search-wrap">
          <input type="search" class="input mail-search" id="mail-search" placeholder="Search" />
          <span class="mail-search-scope" id="mail-search-scope"></span>
        </div>
        <!-- Mail arrives by relay (Spacemail -> SES -> ingest), so there is no push
             signal to the page and no polling here. A visible manual reload is the
             honest answer: staff decide when to check, and the timestamp next to it
             says how stale what they are looking at actually is. -->
        <span class="hint mail-updated" id="mail-updated" aria-live="polite"></span>
        <button type="button" class="btn btn-secondary mail-refresh" id="mail-refresh">
          <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true" focusable="false"><path d="M240,56v48a8,8,0,0,1-8,8H184a8,8,0,0,1,0-16H211.4L184.81,71.64l-.25-.24a80,80,0,1,0-1.67,114.78,8,8,0,0,1,11,11.63A96,96,0,1,1,195.88,60.19L224,84.4V56a8,8,0,1,1,16,0Z"/></svg>
          Reload
        </button>
      </div>

      <p class="hint mail-kbd-hint">Shortcuts: <kbd>j</kbd>/<kbd>k</kbd> move, <kbd>Enter</kbd> open, <kbd>/</kbd> search, <kbd>r</kbd> reply</p>

      <div class="mail-3pane" id="mail-3pane">
        <aside class="card mail-list"><div class="q-list" id="mail-list"></div></aside>
        <section class="card mail-read" id="mail-read"></section>
      </div>
    </main>
  </div>
</div>

<script src="dashboard-data.js"></script>
<script src="dashboard-shell.js"></script>
<script>
(() => {
  const claims = KCMPS_DASH_SHELL.mount("email");
  if (!claims) return;
  const { escapeHtml, fmtDateTime, withBusy, showInlineError } = KCMPS_DASH_SHELL;

  let currentMailboxId = null;
  // Set by renderMailboxSelector() when the API returns zero mailboxes, so the
  // list/read panes can distinguish "no access" from "no mail" (see there).
  let noMailboxAccess = false;
  let currentMessageId = null;
  let currentFolder = "INBOX";
  let search = "";
  let replyDraft = "";
  let replyCc = "";
  let showCcField = false;
  // Client-side "unread only" filter — applied on top of whatever page of
  // messages is already fetched (same scope as search: current mailbox +
  // folder), no new API param needed. Persists across mailbox/folder
  // switches, same as search does, since #mb-unread is already per-mailbox
  // and this just narrows the same list to match it.
  let unreadOnly = false;

  // List state — accumulated across "Load more" clicks, reset whenever the
  // mailbox, folder, or search term changes (resetListState()). Grouped into
  // threads for display (groupThreads()) so a back-and-forth with several
  // messages shows as one row, Gmail-style, rather than N separate ones.
  let listMessages = [];
  let listCursor = null;
  let mailboxesCache = [];

  // messageId -> full message (bodyText/attachments/provenance/etc), used so
  // expanding a collapsed thread card twice in the same read-pane render
  // doesn't refetch. Cleared on every renderRead() — see there for why that's
  // fine (a rare click, not a hot path).
  let expandedCache = new Map();
  let currentThreadMb = null;

  // j/k list navigation — index into the currently-rendered grouped rows.
  let activeListIndex = -1;

  const pane = document.getElementById("mail-3pane");
  const listEl = document.getElementById("mail-list");
  const readEl = document.getElementById("mail-read");
  const selectEl = document.getElementById("mb-select");
  const unreadEl = document.getElementById("mb-unread");
  const searchEl = document.getElementById("mail-search");
  const scopeEl = document.getElementById("mail-search-scope");
  const folderToggleEl = document.getElementById("mail-folder-toggle");
  const unreadFilterEl = document.getElementById("mail-unread-filter");
  const refreshEl = document.getElementById("mail-refresh");
  const updatedEl = document.getElementById("mail-updated");

  function relAge(iso) {
    const mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 60) return mins + "m";
    if (mins < 60 * 24) return Math.round(mins / 60) + "h";
    return Math.round(mins / 1440) + "d";
  }
  function senderOf(m) { return m.from.name || m.from.address; }
  function fmtSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + " KB";
    return (Math.round(bytes / 104857.6) / 10) + " MB";
  }
  function currentMailbox() { return mailboxesCache.find((x) => x.id === currentMailboxId); }

  function resetListState() {
    listMessages = [];
    listCursor = null;
    activeListIndex = -1;
  }

  function mailSkeleton(rows) {
    let out = "";
    for (let i = 0; i < rows; i++) out += '<div class="mail-skel-row" aria-hidden="true"><span></span><span></span></div>';
    return out;
  }

  function updateSearchScope() {
    const mb = currentMailbox();
    const label = mb ? mb.address : "mailbox";
    const folderLabel = currentFolder === "SENT" ? "Sent" : "Inbox";
    searchEl.placeholder = "Search " + label + " · " + folderLabel;
    scopeEl.textContent = search ? ("Searching " + label + " · " + folderLabel) : "";
  }

  /* ---- mailbox selector ---- */
  async function renderMailboxSelector() {
    const boxes = await KCMPS_DASH.getMailboxes();
    mailboxesCache = boxes;
    if (!boxes.length) {
      // An empty list is NOT the same as "no mail has arrived" — mailbox
      // capability is group-based (backend/lib/mail.js's canAccessMailbox:
      // Sales/Finance/Admin, deliberately NOT Staff), so a legitimately
      // signed-in Staff-only account gets `{"mailboxes":[]}` here. Rendering
      // that identically to an empty inbox is how a permissions problem
      // masquerades as "quiet day". Say which it is.
      noMailboxAccess = true;
      selectEl.innerHTML = "";
      selectEl.disabled = true;
      unreadEl.textContent = "";
      unreadEl.classList.remove("has-red");
      return boxes;
    }
    noMailboxAccess = false;
    selectEl.disabled = false;
    if (!currentMailboxId) currentMailboxId = boxes[0].id;
    selectEl.innerHTML = boxes.map((mb) => {
      const label = mb.label + " — " + mb.address;
      const badge = mb.unreadCount ? " (" + mb.unreadCount + ")" : "";
      return `<option value="${escapeHtml(mb.id)}"${mb.id === currentMailboxId ? " selected" : ""}>${escapeHtml(label)}${badge}</option>`;
    }).join("");
    const active = boxes.find((mb) => mb.id === currentMailboxId);
    unreadEl.textContent = active ? active.unreadCount + " unread" : "0 unread";
    unreadEl.classList.toggle("has-red", !!(active && active.unreadCount));
    updateSearchScope();
    return boxes;
  }

  /* ---- message list ----
     Thread-collapse grouping: multiple envelopes sharing a threadId (a
     back-and-forth on one order) collapse into a single row showing the
     latest message plus a "(N)" count — pure client-side grouping over
     data already fetched, no backend change (docs/email-tab-redesign-
     2026-08-06.md §3.2). The count reflects only what's been paged in so
     far, not the mailbox's true total for that thread — honest about what
     the client actually knows without an extra fetch. */
  function groupThreads(messages) {
    const byThread = new Map();
    for (const m of messages) {
      const key = m.threadId || m.messageId;
      const g = byThread.get(key);
      if (!g) {
        byThread.set(key, { threadId: key, latest: m, count: 1 });
      } else {
        g.count += 1;
        if (new Date(m.date) > new Date(g.latest.date)) g.latest = m;
      }
    }
    return Array.from(byThread.values()).sort((a, b) => new Date(b.latest.date) - new Date(a.latest.date));
  }

  function renderListRow(g, idx) {
    const m = g.latest;
    const unread = !m.flags.seen;
    const cls = "q-item" +
      (unread ? " sla-warn is-unread" : "") +
      (m.messageId === currentMessageId ? " is-open" : "") +
      (idx === activeListIndex ? " is-keyfocus" : "");
    const marks = m.flags.answered ? "replied" : "";
    const countBadge = g.count > 1 ? ' <span class="thread-count">(' + g.count + ")</span>" : "";
    // Per-row read/unread toggle — a click here mirrors the read-pane's
    // "Mark as unread"/"Mark as read" button but skips opening the message,
    // so a staffer can triage a whole list without clicking into each one.
    // Nested inside the row's own click-to-open target, so its handler
    // (wired in wireListRows()) must stopPropagation or the row would also
    // open underneath it.
    const toggleTitle = unread ? "Mark as read" : "Mark as unread";
    const markBtn = `<button type="button" class="q-mark-toggle" data-mark-msg="${escapeHtml(m.messageId)}" data-seen="${m.flags.seen ? "1" : "0"}" title="${toggleTitle}" aria-label="${toggleTitle}"><span class="q-mark-dot" aria-hidden="true"></span></button>`;
    return (
      `<div class="${cls}" data-msg="${escapeHtml(m.messageId)}" data-idx="${idx}" role="button" tabindex="0">` +
      `<div class="q-line1"><span>${unread ? '<span class="unread-dot" aria-hidden="true"></span>' : ""}${escapeHtml(senderOf(m))}</span><span class="q-age">${relAge(m.date)}</span></div>` +
      `<div class="q-line2"><span>${escapeHtml(m.subject)}${countBadge} — ${escapeHtml(m.snippet)}</span><span>${marks}${markBtn}</span></div>` +
      "</div>"
    );
  }

  // Re-renders from the already-fetched listMessages cache — used both after
  // a real fetch (renderList() below) and whenever the "Unread only" chip is
  // toggled, which needs no new network round-trip since it's just narrowing
  // what's already loaded (same idea as the search-scope hint: honest about
  // only filtering what the client actually has paged in so far).
  function renderListFromCache() {
    if (!listMessages.length) {
      listEl.innerHTML = '<p class="q-empty">' +
        (search ? "No messages match that search." : (currentFolder === "SENT" ? "Nothing sent yet." : "Inbox is empty.")) +
        "</p>";
      return;
    }

    let groups = groupThreads(listMessages);
    if (unreadOnly) groups = groups.filter((g) => !g.latest.flags.seen);

    if (!groups.length) {
      listEl.innerHTML = '<p class="q-empty">No unread messages' + (search ? " match that search." : ".") + "</p>";
      return;
    }

    listEl.innerHTML = groups.map(renderListRow).join("") +
      (listCursor ? '<button type="button" class="btn btn-secondary list-load-more" id="list-load-more">Load 50 more</button>' : "");

    listEl.querySelectorAll("[data-msg]").forEach((row) => {
      const open = () => openMessage(row.dataset.msg);
      row.addEventListener("click", open);
      row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });
    listEl.querySelectorAll("[data-mark-msg]").forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.stopPropagation();
        const id = btn.dataset.markMsg;
        const nowSeen = btn.dataset.seen === "1";
        withBusy(btn, async () => {
          await KCMPS_DASH.markMessageRead(currentMailboxId, id, !nowSeen);
          await renderMailboxSelector();
          await renderList();
        });
      });
      btn.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") e.stopPropagation(); });
    });
    const loadMoreBtn = document.getElementById("list-load-more");
    if (loadMoreBtn) {
      loadMoreBtn.addEventListener("click", () => {
        withBusy(loadMoreBtn, () => renderList({ append: true }));
      });
    }
  }

  async function renderList(opts) {
    const append = !!(opts && opts.append);
    if (!currentMailboxId) {
      listEl.innerHTML = noMailboxAccess
        ? '<p class="q-empty">No mailboxes are assigned to your account.</p>'
        : '<p class="q-empty">No mailboxes available.</p>';
      return;
    }
    if (!append) listEl.innerHTML = mailSkeleton(4);

    let res;
    try {
      const fetchOpts = { search, folder: currentFolder };
      if (append && listCursor) fetchOpts.cursor = listCursor;
      res = await KCMPS_DASH.getMessages(currentMailboxId, fetchOpts);
    } catch (err) {
      listEl.innerHTML = '<p class="q-empty">Could not load messages. ' + escapeHtml(err && err.message ? err.message : "") + "</p>";
      return;
    }

    if (append) {
      const seen = new Set(listMessages.map((m) => m.messageId));
      listMessages = listMessages.concat((res.messages || []).filter((m) => !seen.has(m.messageId)));
    } else {
      listMessages = res.messages || [];
    }
    listCursor = res.nextCursor || null;

    renderListFromCache();
  }

  async function openMessage(messageId) {
    currentMessageId = messageId;
    replyDraft = "";
    replyCc = "";
    showCcField = false;
    readEl.innerHTML = mailReadSkeleton();
    pane.classList.add("show-read");
    await KCMPS_DASH.markMessageRead(currentMailboxId, messageId, true);
    await renderMailboxSelector();
    await renderList();
    await renderRead();
  }

  function mailReadSkeleton() {
    return '<div class="mail-skel-read" aria-hidden="true">' +
      '<div class="mail-skel-line" style="width:60%"></div>' +
      '<div class="mail-skel-line" style="width:35%"></div>' +
      '<div class="mail-skel-block"></div>' +
      "</div>";
  }

  /* ---- read pane ----
     SAFETY: every field below is attacker-controlled (a display name, a
     subject, an attachment filename), so all of it goes through escapeHtml.
     The BODY deliberately renders NOTHING but plain text:
       - HTML parts are never rendered (an iframe is ruled out in
         docs/roadmap.md, and a hand-maintained sanitizer is not worth the
         risk for a triage panel) — a notice is shown instead
       - remote images referenced by the body are never loaded (tracking
         pixels / phishing); the CSP img-src allowlists ONLY our own two
         scanned-uploads S3 hosts for the attachment previews below, never
         arbitrary hosts
       - URLs are not auto-linkified; auto-<a> on arbitrary mail is a
         phishing amplifier
     ATTACHMENTS (2026-08-07) are no longer metadata-only: the backend
     extracts each part to the GuardDuty-scanned uploads bucket and
     get-mail-message.js presigns a URL ONLY for a NO_THREATS_FOUND verdict
     (fail closed — no verdict yet renders "Scanning…", an infected file
     renders its threat explanation and no link, and the object is already
     destroyed). Images/PDF open inline in a new tab from the S3 presigned
     host (cross-origin, so even a hostile file can't touch this page's
     session/DOM); everything else — SVG very much included — is forced to
     download by the server's Content-Disposition. renderAttachment() below
     only labels what the server already decided; it must never widen it. ---- */
  /* ---- provenance strip ----
     Mail reaches this panel by being FORWARDED — Spacemail relays the one
     real admin@kcmps.com mailbox to an SES receiving address, and
     backend/mail/ingest-inbound.js splits it back into order@/info@/admin@.
     A forwarded message is a message that has been through a third party,
     so staff need to see how much of it is actually vouched for.

     What the four verdicts mean here (backend/lib/mail.js's assessVerdicts
     has the authoritative version):
       virus / spam — SES's scanners. A non-pass never reaches this page at
         all; ingest hard-rejects it into the Admin-only quarantine mailbox
         with the body stripped. Shown because "scanned, clean" is itself
         the useful signal.
       dkim — THE positive signal. DKIM survives forwarding intact, so a
         pass genuinely means the message is from who it claims.
       spf — recorded, NEVER enforced. Forwarding breaks SPF by design (the
         forwarder relays from its own IPs), so an SPF fail on this page is
         expected and means nothing on its own. Labelled as such so nobody
         reads it as an alarm.
     Plus whether the expected forwarder appears in the `Received:` chain —
     a message that did not come via the forwarder got here some other way,
     which is worth a look even though nothing blocks it.

     SAFETY: same rules as the rest of this page. Every value is
     server-derived rather than attacker-supplied, but it still goes
     through escapeHtml — the whole point of the plain-text-only design is
     that no field gets a pass. No links, no HTML, no images.

     C4 NOTE: reads m.provenance, which the real backend attaches to every
     message item. Absent on the current mock data, in which case this
     renders a single "not recorded" line rather than breaking. ---- */
  const CHECK_LABELS = [
    ["virus", "Virus", "SES scanned the message and found no malware."],
    ["spam", "Spam", "SES's spam scoring did not flag this message."],
    ["dkim", "DKIM", "The sending domain's cryptographic signature verified — this is the strongest proof the sender is who they claim."],
    ["spf", "SPF", "Recorded but never enforced: forwarding breaks SPF by design, so a failure here is expected and is not treated as suspicious."],
  ];

  /* Four inline check marks in the message header, details on hover/tap.
     The verdicts are REAL — SES computes them at receipt time and
     ingest-inbound.js persists all four verbatim; nothing here is decorative.

     Collapsed by default because the healthy case (four passes) is the boring
     case and does not deserve a whole block above the message body. BUT a
     non-pass must never be hidden behind a hover: anything a staff member needs
     in order to distrust a message stays visible as a banner via
     renderProvenanceAlert() below. Hover is an affordance for detail, never the
     only route to a warning — hover does not exist on touch, and this page's
     whole job is to be un-phishable. */
  function renderChecks(m) {
    const p = m && m.provenance;
    if (!p) return '<div class="m-block"><h4>Checks</h4><p class="q-empty">Not recorded</p></div>';
    const v = p.verdicts || {};

    const mark = (val) => (val === "PASS" ? "✓" : (!val || val === "UNKNOWN" ? "?" : "✕"));
    const cls = (val) => (val === "PASS" ? "ck-good" : (!val || val === "UNKNOWN" ? "ck-unknown" : "ck-bad"));

    const icons = CHECK_LABELS.map(([key, label]) => {
      const val = String(v[key] || "UNKNOWN").toUpperCase();
      return '<span class="ck ' + cls(val) + '" aria-hidden="true">' + mark(val) + "</span>";
    }).join("");

    const rows = CHECK_LABELS.map(([key, label, why]) => {
      const val = String(v[key] || "UNKNOWN").toUpperCase();
      return '<li class="' + cls(val) + '"><b>' + escapeHtml(label) + ": " + escapeHtml(val) + "</b>" +
        '<span>' + escapeHtml(why) + "</span></li>";
    }).join("");

    // Screen readers and keyboard users get the full result without hovering.
    const summary = CHECK_LABELS
      .map(([key, label]) => label + " " + String(v[key] || "unknown").toLowerCase())
      .join(", ");

    // Routing context lives in the popover too — useful, but not a warning.
    const foot = [];
    if (p.viaExpectedForwarder === true) {
      foot.push("Arrived via the expected forwarder" + (p.expectedForwarder ? " (" + p.expectedForwarder + ")" : "") + ".");
    }
    if (p.routedBy === "infra-notice") foot.push("Automated AWS notification, kept out of the customer mailboxes.");
    if (p.deliveredTo && p.deliveredTo.length) foot.push("Originally addressed to: " + p.deliveredTo.join(", "));

    return '<div class="m-block mail-checks"><h4>Checks</h4>' +
      '<button type="button" class="ck-trigger" aria-expanded="false" aria-label="Delivery checks: ' + escapeHtml(summary) + '">' +
      icons + "</button>" +
      '<div class="ck-pop" role="tooltip"><ul>' + rows + "</ul>" +
      foot.map((f) => '<p class="ck-foot">' + escapeHtml(f) + "</p>").join("") + "</div></div>";
  }

  /* Anything that should make a staff member suspicious stays on screen. */
  function renderProvenanceAlert(m) {
    const p = m && m.provenance;
    if (!p) return "";
    const v = p.verdicts || {};
    const bad = [];

    if (v.virus && v.virus !== "PASS") bad.push("SES did not clear this message for malware (virus: " + v.virus + ").");
    if (v.spam && v.spam !== "PASS") bad.push("SES flagged this message as spam (spam: " + v.spam + ").");
    if (p.viaExpectedForwarder === false) {
      bad.push("This message does NOT show the expected forwarder in its Received chain — it reached the relay by some other path. Treat it with suspicion.");
    }
    if (p.routedBy === "to-cc") {
      bad.push("Filed using the To/Cc header — no forwarder envelope header was present, so the mailbox is a best guess.");
    } else if (p.routedBy === "unrouted") {
      bad.push("No known KCMPS address was found on this message.");
    }
    if (!bad.length) return "";
    return bad.map((n) => '<p class="mail-notice mail-notice-warn">' + escapeHtml(n) + "</p>").join("");
  }

  /* Folds quoted reply chains ("> ..." / "On ... wrote:") behind a
     "Show quoted text" toggle, Gmail-style — the quoted block is still
     rendered (escaped, same as the rest of the body), just hidden by
     default so the actual new content of a reply isn't buried under a
     re-quoted history the staffer has usually already read. Heuristic
     only: first line that looks like the start of a quote wins: everything
     from there to the end of the message is treated as "quoted". */
  function splitQuoted(bodyText) {
    const text = bodyText || "";
    const lines = text.split("\n");
    let idx = -1;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i].trim();
      if (!line) continue;
      if (line.startsWith(">")) { idx = i; break; }
      if (/^on .{3,140} wrote:$/i.test(line)) { idx = i; break; }
      if (/^-{2,}\s*original message\s*-{2,}$/i.test(line)) { idx = i; break; }
    }
    if (idx === -1) return { main: text, quoted: "" };
    return { main: lines.slice(0, idx).join("\n").replace(/\s+$/, ""), quoted: lines.slice(idx).join("\n") };
  }

  /* ---- conversation view (thread-stack) ----
     Replaces the old flat ".timeline" snippet table with stacked message
     cards: the target message (the one the pane was opened to) expanded,
     every other thread member collapsed to sender/date/snippet with a
     click-to-expand. This is the direct fix for "hard to see the
     conversation" (docs/email-tab-redesign-2026-08-06.md §3.3). Collapsed
     cards only carry envelope fields (from getThread()); expanding one
     lazily fetches the full message via getMessage() and caches it in
     expandedCache for the rest of this read-pane's lifetime. */
  function renderThreadCard(t, mb, isTarget) {
    const mine = !!(mb && t.from && t.from.address && t.from.address.toLowerCase() === mb.address.toLowerCase());
    const whoBadge = mine ? '<span class="you-badge">You</span>' : "";
    const initial = escapeHtml((senderOf(t) || "?").trim().slice(0, 1).toUpperCase() || "?");
    const head =
      '<div class="thread-card-head" data-thread-toggle="' + escapeHtml(t.messageId) + '" role="button" tabindex="0" aria-expanded="' + (isTarget ? "true" : "false") + '">' +
      '<span class="thread-avatar" aria-hidden="true">' + initial + "</span>" +
      '<span class="thread-who">' + escapeHtml(senderOf(t)) + whoBadge + "</span>" +
      '<span class="thread-date">' + fmtDateTime(t.date) + "</span>" +
      (!isTarget ? '<span class="thread-snippet">' + escapeHtml(t.snippet || "") + "</span>" : "") +
      '<span class="thread-chevron" aria-hidden="true">' + (isTarget ? "▾" : "▸") + "</span>" +
      "</div>";
    const body = isTarget ? renderThreadCardBody(t, mb) : '<div class="thread-card-body-slot"></div>';
    return '<article class="thread-card' + (isTarget ? " is-target is-expanded" : "") + (mine ? " is-mine" : "") +
      '" data-thread-msg="' + escapeHtml(t.messageId) + '">' + head + body + "</article>";
  }

  /* One attachment chip. The server (get-mail-message.js) has already made
     every security decision: `url` exists ONLY for a scan-clean file, and
     the presigned response's Content-Disposition — not anything here —
     decides inline vs forced download (`a.inline` just labels it). No url +
     a scanStatus = blocked or still scanning; no url and no scanStatus =
     legacy metadata-only chip. Filenames are attacker-controlled →
     escapeHtml, like everything else on this page. */
  function renderAttachment(a) {
    if (!a) return "";
    const name = escapeHtml(a.filename || "attachment");
    const size = fmtSize(a.size != null ? a.size : (a.sizeBytes || 0));
    if (a.url) {
      const href = escapeHtml(a.url);
      if (a.inline && /^image\//i.test(a.contentType || "")) {
        return '<a class="mail-att-imglink" href="' + href + '" target="_blank" rel="noopener noreferrer" title="Open full size">' +
          '<img class="mail-att-img" src="' + href + '" alt="' + name + '" loading="lazy" />' +
          '<span class="tag tag-outline">' + name + " · " + size + "</span></a>";
      }
      const label = a.inline ? "Open" : "Download";
      return '<a class="tag tag-outline mail-att-link" href="' + href + '" target="_blank" rel="noopener noreferrer">' +
        name + " · " + size + " · " + label + "</a>";
    }
    if (a.scanStatus === "PENDING") {
      return '<span class="tag tag-outline">' + name + " · " + size + " · Scanning for malware…</span>";
    }
    if (a.scanStatus) {
      const why = a.threatInfo && a.threatInfo.label ? a.threatInfo.label : "did not pass the malware scan";
      return '<span class="tag tag-outline mail-att-blocked">' + name + " · blocked — " + escapeHtml(why) + " (file destroyed)</span>";
    }
    return '<span class="tag tag-outline">' + name + " · " + size + "</span>";
  }

  function renderThreadCardBody(full, mb) {
    const { main, quoted } = splitQuoted(full.bodyText || "");
    const meta =
      '<div class="m-block"><h4>From</h4><p>' + escapeHtml(senderOf(full)) + "</p></div>" +
      '<div class="m-block"><h4>Address</h4><p>' + escapeHtml(full.from.address) + "</p></div>" +
      '<div class="m-block"><h4>Received</h4><p>' + fmtDateTime(full.date) + "</p></div>" +
      renderChecks(full) +
      (full.relatedOrderId
        ? '<div class="m-block"><h4>Related order</h4><p><a href="job-detail.html?order=' +
          encodeURIComponent(full.relatedOrderId) + '">' + escapeHtml(full.relatedOrderId) + "</a></p></div>"
        : "");

    const htmlNotice = full.hasHtmlPart
      ? '<p class="mail-notice">This message has an HTML version. KCMPS Ops shows the plain-text version only, and never loads remote images.</p>'
      : "";

    const quotedHtml = quoted
      ? '<button type="button" class="quoted-toggle" data-quoted-toggle>Show quoted text</button>' +
        '<pre class="mail-body quoted-block" hidden>' + escapeHtml(quoted) + "</pre>"
      : "";

    const atts = full.attachments || [];
    const anyRef = atts.some((a) => a && (a.url || a.ref || a.scanStatus));
    const attach = atts.length
      ? '<div class="thread-attachments">' +
        atts.map(renderAttachment).join(" ") +
        (!anyRef ? '<p class="q-empty">Attachments on this older message are listed for reference only — open them in your mail client.</p>' : "") +
        "</div>"
      : "";

    return '<div class="thread-card-body">' +
      '<div class="ticket-meta">' + meta + "</div>" +
      renderProvenanceAlert(full) +
      htmlNotice +
      '<pre class="mail-body">' + escapeHtml(main) + "</pre>" +
      quotedHtml +
      attach +
      "</div>";
  }

  async function toggleThreadCard(messageId) {
    const card = Array.from(readEl.querySelectorAll(".thread-card")).find((c) => c.dataset.threadMsg === messageId);
    if (!card) return;
    const head = card.querySelector(".thread-card-head");
    const chevron = head.querySelector(".thread-chevron");
    if (card.classList.contains("is-expanded")) {
      card.classList.remove("is-expanded");
      const bodySlot = card.querySelector(".thread-card-body");
      if (bodySlot) bodySlot.outerHTML = '<div class="thread-card-body-slot"></div>';
      head.setAttribute("aria-expanded", "false");
      if (chevron) chevron.textContent = "▸";
      return;
    }
    if (chevron) chevron.textContent = "⋯";
    let full = expandedCache.get(messageId);
    if (!full) {
      try {
        full = await KCMPS_DASH.getMessage(currentMailboxId, messageId);
        expandedCache.set(messageId, full);
      } catch (err) {
        if (chevron) chevron.textContent = "▸";
        return;
      }
    }
    const slot = card.querySelector(".thread-card-body-slot");
    if (slot) slot.outerHTML = renderThreadCardBody(full, currentThreadMb);
    card.classList.add("is-expanded");
    head.setAttribute("aria-expanded", "true");
    if (chevron) chevron.textContent = "▾";
  }

  async function renderRead(flash) {
    if (!currentMailboxId) {
      readEl.innerHTML = noMailboxAccess
        ? '<div class="empty-state"><p><b>No mailboxes are assigned to your account.</b></p>' +
          '<p class="hint">Shared mailbox access comes from the <b>Sales</b>, <b>Finance</b> or ' +
          '<b>Admin</b> group — a <b>Staff</b>-only account has dashboard access but no mailbox ' +
          'of its own. Ask an Admin to add you to the group that matches your work.</p></div>'
        : '<div class="empty-state">Select a message to read it.</div>';
      return;
    }
    const [boxes, m] = await Promise.all([
      KCMPS_DASH.getMailboxes(),
      currentMessageId ? KCMPS_DASH.getMessage(currentMailboxId, currentMessageId) : Promise.resolve(null),
    ]);
    mailboxesCache = boxes;
    const mb = boxes.find((x) => x.id === currentMailboxId);
    currentThreadMb = mb;
    if (!m) {
      readEl.innerHTML = '<div class="empty-state">Select a message to read it.</div>';
      return;
    }

    expandedCache = new Map([[m.messageId, m]]);

    let thread = [];
    try {
      thread = await KCMPS_DASH.getThread(currentMailboxId, m.threadId);
    } catch (err) {
      thread = [];
    }
    const others = thread.filter((t) => t.messageId !== m.messageId);
    const allThread = others.concat([m]).sort((a, b) => new Date(a.date) - new Date(b.date));

    const parts = [];

    parts.push('<button type="button" class="btn btn-ghost mail-back" id="mail-back">&larr; Back to list</button>');

    const isSeen = !!(m.flags && m.flags.seen);
    parts.push(
      '<div class="ticket-head"><h2 style="margin:0;font-size:19px">' + escapeHtml(m.subject) + "</h2>" +
      '<div class="ticket-head-actions">' +
      '<span class="status-pill ' + (m.flags.answered ? "st-good" : "st-neutral") + (flash ? " dash-flash" : "") + '">' +
      (m.flags.answered ? "Replied" : "Read") + "</span>" +
      '<button type="button" class="btn btn-ghost mail-mark-toggle-btn" id="mail-mark-toggle" data-seen="' + (isSeen ? "1" : "0") + '">' +
      (isSeen ? "Mark as unread" : "Mark as read") + "</button>" +
      "</div></div>"
    );

    parts.push('<div class="thread-stack">' +
      allThread.map((t) => renderThreadCard(t, mb, t.messageId === m.messageId)).join("") +
      "</div>");

    if (mb && mb.canSend) {
      parts.push(
        '<div class="mail-reply">' +
        '<div class="reply-head"><label class="hint" for="reply-body" style="font-size:12.5px">Reply to ' +
        escapeHtml(senderOf(m)) + '</label>' +
        '<button type="button" class="reply-cc-toggle" id="reply-cc-toggle">' + (showCcField ? "Hide Cc" : "+ Cc") + '</button></div>' +
        (showCcField ? '<input type="text" class="input" id="reply-cc" placeholder="Cc — comma-separated addresses" value="' + escapeHtml(replyCc) + '" />' : "") +
        '<textarea class="input" id="reply-body" rows="5" placeholder="Type your reply…">' + escapeHtml(replyDraft) + "</textarea>" +
        '<div id="reply-error"></div>' +
        '<div class="action-bar"><button type="button" class="btn btn-primary" id="reply-send">Send reply</button>' +
        '<button type="button" class="btn btn-ghost" id="reply-discard">Discard</button></div></div>'
      );
    } else {
      parts.push('<p class="mail-notice">This mailbox is read-only — replies are disabled.</p>');
    }

    readEl.innerHTML = parts.join("");
    readEl.scrollTop = 0;

    document.getElementById("mail-back").addEventListener("click", () => {
      pane.classList.remove("show-read");
    });

    // Mirrors openMessage()'s implicit mark-as-read call — same
    // markMessageRead() seam, just with the boolean the other direction
    // (or back to true, for a message a staffer wants to re-flag as read
    // without reopening it). Refreshes the mailbox selector (so #mb-unread
    // and the <option> badge update) and the list (so the row's bold/dot
    // state and any active "Unread only" filter re-settle), then the read
    // pane itself so the button's own label flips to match.
    const markToggleBtn = document.getElementById("mail-mark-toggle");
    if (markToggleBtn) {
      markToggleBtn.addEventListener("click", (e) => {
        withBusy(e.currentTarget, async () => {
          const nowSeen = markToggleBtn.dataset.seen === "1";
          await KCMPS_DASH.markMessageRead(currentMailboxId, currentMessageId, !nowSeen);
          await renderMailboxSelector();
          await renderList();
          await renderRead();
        });
      });
    }

    const ccToggle = document.getElementById("reply-cc-toggle");
    if (ccToggle) ccToggle.addEventListener("click", () => { showCcField = !showCcField; renderRead(); });
    const ccInput = document.getElementById("reply-cc");
    if (ccInput) ccInput.addEventListener("input", () => { replyCc = ccInput.value; });

    const bodyInput = document.getElementById("reply-body");
    if (bodyInput) {
      bodyInput.addEventListener("input", () => { replyDraft = bodyInput.value; });
      const replyErrorHost = document.getElementById("reply-error");
      document.getElementById("reply-send").addEventListener("click", async (e) => {
        replyErrorHost.innerHTML = "";
        await withBusy(e.currentTarget, async () => {
          let result;
          try {
            const cc = replyCc.split(",").map((s) => s.trim()).filter(Boolean);
            result = await KCMPS_DASH.sendReply(currentMailboxId, currentMessageId, { bodyText: bodyInput.value, cc });
          } catch (err) {
            showInlineError(replyErrorHost, err.message);
            return;
          }
          replyDraft = "";
          replyCc = "";
          showCcField = false;
          await renderAll(true);
          // "Sent but local record couldn't be updated" is not a failure —
          // the email already went out and there is no un-send — so this
          // is shown after the repaint, not treated as an error.
          if (result && result.warning) showInlineError(replyErrorHost, result.warning);
        });
      });
      document.getElementById("reply-discard").addEventListener("click", () => {
        replyDraft = "";
        bodyInput.value = "";
      });
    }
  }

  async function renderAll(flash) {
    await renderMailboxSelector();
    await renderList();
    await renderRead(flash);
    stampUpdated();
  }

  /* Every getMailboxes/getMessages/getMessage call goes straight to the API via
     apiFetch — there is no client-side cache to bust — so re-running renderAll()
     IS a hard reload. Selected mailbox, open message and search term are held in
     module state and deliberately survive it: a reload should refresh what you
     are looking at, not throw you back to an empty list. */
  function stampUpdated() {
    if (!updatedEl) return;
    const t = new Date();
    updatedEl.textContent = "Updated " +
      String(t.getHours()).padStart(2, "0") + ":" + String(t.getMinutes()).padStart(2, "0");
  }

  selectEl.addEventListener("change", () => {
    currentMailboxId = selectEl.value;
    currentMessageId = null;
    replyDraft = ""; replyCc = ""; showCcField = false;
    currentFolder = "INBOX";
    folderToggleEl.querySelectorAll("button").forEach((b) => b.classList.toggle("is-active", b.dataset.folder === "INBOX"));
    pane.classList.remove("show-read");
    resetListState();
    renderAll();
  });

  unreadFilterEl.addEventListener("click", () => {
    unreadOnly = !unreadOnly;
    unreadFilterEl.classList.toggle("is-active", unreadOnly);
    unreadFilterEl.setAttribute("aria-pressed", String(unreadOnly));
    renderListFromCache();
  });

  folderToggleEl.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-folder]");
    if (!btn || btn.classList.contains("is-active")) return;
    currentFolder = btn.dataset.folder;
    folderToggleEl.querySelectorAll("button").forEach((b) => b.classList.toggle("is-active", b === btn));
    currentMessageId = null;
    pane.classList.remove("show-read");
    resetListState();
    updateSearchScope();
    renderList();
    renderRead();
  });

  let searchDebounce = null;
  searchEl.addEventListener("input", () => {
    search = searchEl.value;
    updateSearchScope();
    resetListState();
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => renderList(), 220);
  });

  /* Single delegated click handler on the read pane for everything that
     lives inside re-rendered markup: the delivery-checks popover trigger,
     the "show quoted text" toggle, and a thread card's expand/collapse
     header — all three are re-created on every renderRead()/toggle, so
     listeners must be delegated rather than bound per-element. */
  readEl.addEventListener("click", (e) => {
    const trigger = e.target.closest && e.target.closest(".ck-trigger");
    if (trigger) {
      const openOne = readEl.querySelector(".mail-checks.is-open");
      if (openOne && openOne !== trigger.parentElement) {
        openOne.classList.remove("is-open");
        const b = openOne.querySelector(".ck-trigger");
        if (b) b.setAttribute("aria-expanded", "false");
      }
      const host = trigger.parentElement;
      const nowOpen = !host.classList.contains("is-open");
      host.classList.toggle("is-open", nowOpen);
      trigger.setAttribute("aria-expanded", nowOpen ? "true" : "false");
      return;
    }

    const quotedBtn = e.target.closest && e.target.closest("[data-quoted-toggle]");
    if (quotedBtn) {
      const block = quotedBtn.nextElementSibling;
      if (!block) return;
      const showing = !block.hidden;
      block.hidden = showing;
      quotedBtn.textContent = showing ? "Show quoted text" : "Hide quoted text";
      return;
    }

    const threadHead = e.target.closest && e.target.closest("[data-thread-toggle]");
    if (threadHead) {
      toggleThreadCard(threadHead.dataset.threadToggle);
    }
  });

  readEl.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const threadHead = e.target.closest && e.target.closest("[data-thread-toggle]");
    if (!threadHead) return;
    e.preventDefault();
    toggleThreadCard(threadHead.dataset.threadToggle);
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const openOne = readEl.querySelector(".mail-checks.is-open");
    if (!openOne) return;
    openOne.classList.remove("is-open");
    const b = openOne.querySelector(".ck-trigger");
    if (b) { b.setAttribute("aria-expanded", "false"); b.focus(); }
  });

  /* ---- keyboard shortcuts ----
     j/k move the list "cursor" without opening a message (Enter opens the
     highlighted row); / focuses search; r focuses the reply box if one is
     open. All skipped while focus is inside any input/textarea/select so
     typing "reply" doesn't get eaten by the r shortcut. */
  function isTypingTarget(el) {
    return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT" || el.isContentEditable);
  }
  document.addEventListener("keydown", (e) => {
    if (isTypingTarget(e.target)) return;
    if (e.key === "/") {
      e.preventDefault();
      searchEl.focus();
      return;
    }
    if (e.key === "j" || e.key === "k") {
      const rows = Array.from(listEl.querySelectorAll("[data-msg]"));
      if (!rows.length) return;
      e.preventDefault();
      if (activeListIndex < 0) activeListIndex = 0;
      else activeListIndex = e.key === "j"
        ? Math.min(rows.length - 1, activeListIndex + 1)
        : Math.max(0, activeListIndex - 1);
      rows.forEach((r) => r.classList.remove("is-keyfocus"));
      const row = rows[activeListIndex];
      if (row) { row.classList.add("is-keyfocus"); row.scrollIntoView({ block: "nearest" }); row.focus(); }
      return;
    }
    if (e.key === "Enter") {
      const row = listEl.querySelector("[data-msg].is-keyfocus");
      if (row) { row.click(); }
      return;
    }
    if (e.key === "r") {
      const bodyInput = document.getElementById("reply-body");
      if (bodyInput) { e.preventDefault(); bodyInput.focus(); }
    }
  });

  if (refreshEl) {
    refreshEl.addEventListener("click", () => {
      // withBusy disables the button and swaps in a spinner for the duration,
      // so a staff member cannot stack a queue of reloads on a slow connection.
      withBusy(refreshEl, async () => {
        try {
          resetListState();
          // Explicit reload = fetch fresh, not the cached thread snapshot —
          // the whole point of clicking Reload is "show me what actually
          // changed since I last looked."
          if (currentMessageId) {
            const m = await KCMPS_DASH.getMessage(currentMailboxId, currentMessageId).catch(() => null);
            if (m) await KCMPS_DASH.getThread(currentMailboxId, m.threadId, { forceRefresh: true }).catch(() => {});
          }
          await renderAll();
        } catch (err) {
          showInlineError(listEl, "Could not reload messages. " + (err && err.message ? err.message : ""));
        }
      });
    });
  }

  renderAll();
})();
</script>
</body>
</html>
