<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" />
<title>Inventory — KCMPS Ops</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dash-gate-hide">

<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"><div id="dash-nav"></div></aside>
  <div class="dash-main">
    <header class="dash-topbar">
      <button type="button" id="dash-nav-toggle" class="dash-nav-toggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16Zm176,112H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
      </button>
      <div id="dash-topbar-content" style="display:flex;justify-content:space-between;align-items:center;flex:1;gap:var(--space-3)"></div>
    </header>

    <main class="dash-content">
      <section class="dsec">
        <div class="dsec-head">
          <h2>Consumables &amp; stock</h2>
          <span class="hint">Wired to the estimator (per Part 1) — wrong material cost here means quotes that lose money</span>
        </div>
        <div class="card" style="overflow-x:auto">
          <table class="table">
            <thead><tr><th>Item</th><th class="num">On hand</th><th class="num">Reorder point</th><th class="num">Days of cover</th><th></th><th></th></tr></thead>
            <tbody id="inv-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="dashboard-data.js"></script>
<script src="dashboard-shell.js"></script>
<script>
(() => {
  const claims = KCMPS_DASH_SHELL.mount("inventory");
  if (!claims) return;
  const { escapeHtml } = KCMPS_DASH_SHELL;

  // Which row (by sku) is mid-edit, if any — swaps that row's "on hand" cell
  // into an inline input instead of using window.prompt(), which is an
  // unstyled native dialog inconsistent with every other editing pattern
  // in the dashboard.
  let editingSku = null;

  function render() {
    const items = KCMPS_DASH.getInventoryAll();
    document.getElementById("inv-body").innerHTML = items.map((i) => {
      const low = i.qty <= i.reorderPoint;
      const cover = i.avgDailyUse > 0 ? Math.floor(i.qty / i.avgDailyUse) : null;
      const isEditing = i.sku === editingSku;
      const qtyCell = isEditing
        ? `<input class="input" type="number" min="0" step="any" id="adj-qty" value="${i.qty}" style="width:100px;display:inline-block" /> ${i.unit}`
        : `${i.qty} ${i.unit}`;
      const actionCell = isEditing
        ? `<button type="button" class="btn btn-primary btn-adjust-save" data-sku="${i.sku}">Save</button> ` +
          `<button type="button" class="btn btn-ghost btn-adjust-cancel">Cancel</button>`
        : `<button type="button" class="btn btn-secondary btn-adjust" data-sku="${i.sku}">Adjust</button>`;
      return (
        `<tr><td>${escapeHtml(i.name)}</td>` +
        `<td class="num">${qtyCell}</td>` +
        `<td class="num">${i.reorderPoint} ${i.unit}</td>` +
        `<td class="num">${cover != null ? cover + "d" : "—"}</td>` +
        `<td>${low ? '<span class="client-flag">low stock</span>' : ""}</td>` +
        `<td>${actionCell}</td></tr>`
      );
    }).join("");

    document.querySelectorAll(".btn-adjust").forEach((btn) => btn.addEventListener("click", () => {
      editingSku = btn.dataset.sku;
      render();
      const input = document.getElementById("adj-qty");
      if (input) { input.focus(); input.select(); }
    }));
    const saveBtn = document.querySelector(".btn-adjust-save");
    if (saveBtn) {
      const commit = () => {
        const input = document.getElementById("adj-qty");
        const n = parseFloat(input.value);
        editingSku = null;
        if (!Number.isNaN(n) && n >= 0) KCMPS_DASH.adjustInventory(saveBtn.dataset.sku, n);
        render();
      };
      saveBtn.addEventListener("click", commit);
      document.getElementById("adj-qty").addEventListener("keydown", (e) => {
        if (e.key === "Enter") commit();
        if (e.key === "Escape") { editingSku = null; render(); }
      });
    }
    const cancelBtn = document.querySelector(".btn-adjust-cancel");
    if (cancelBtn) cancelBtn.addEventListener("click", () => { editingSku = null; render(); });
  }
  render();
})();
</script>
</body>
</html>
