<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://kcmps-payment-uploads-est-2026.s3.ap-southeast-1.amazonaws.com https://kcmps-payment-uploads-staging.s3.ap-southeast-1.amazonaws.com; connect-src 'self' https://6msg2uho6c.execute-api.ap-southeast-1.amazonaws.com https://162ufc121j.execute-api.ap-southeast-1.amazonaws.com https://kcmps-payment-uploads-est-2026.s3.ap-southeast-1.amazonaws.com https://kcmps-payment-uploads-staging.s3.ap-southeast-1.amazonaws.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" />
<title>Job ticket — KCMPS Ops</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dash-gate-hide">

<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"><div id="dash-nav"></div></aside>
  <div class="dash-main">
    <header class="dash-topbar">
      <button type="button" id="dash-nav-toggle" class="dash-nav-toggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16Zm176,112H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
      </button>
      <div id="dash-topbar-content" style="display:flex;justify-content:space-between;align-items:center;flex:1;gap:var(--space-3)"></div>
    </header>

    <main class="dash-content" id="detail-root">
      <a href="jobs.html" class="checkout-back" style="display:inline-block">&larr; All jobs</a>
      <div id="detail-body"></div>
    </main>
  </div>
</div>

<script src="dashboard-data.js"></script>
<script src="dashboard-shell.js"></script>
<script>
(() => {
  const claims = KCMPS_DASH_SHELL.mount("jobs");
  if (!claims) return;
  const { fmtPeso, fmtDateTime, fmtDate, escapeHtml, withBusy, showInlineError } = KCMPS_DASH_SHELL;

  const params = new URLSearchParams(location.search);
  const orderId = params.get("order");
  const lineId = params.get("line");

  // Order↔email linking (no IMAP/SES integration — see docs/roadmap.md
  // "Order↔email linking"): admin@kcmps.com receives every staff mailbox's
  // forwarded mail, so a plain webmail search by order ID finds the thread.
  // {q} is the only stable part of the URL confirmed against a live search —
  // Spacemail's other query params (e.g. a folder/message-list id) were
  // observed to change between searches and were dropped.
  const SPACEMAIL_SEARCH_URL = "https://spacemail.com/mail/?f=INBOX&search={q}";

  function statusTone(status) {
    if (["Delivered", "Picked Up", "Ready for Dispatch", "Ready for Pickup", "Dispatched"].includes(status)) return "st-good";
    if (["Rework", "On Hold", "Cancelled", "Auto-Cancelled", "Quote Expired"].includes(status)) return "st-bad";
    if (["Order Placed", "Pending Payment Verification", "Quoted", "Priced"].includes(status)) return "st-warn";
    if (status === "In Production" || status === "QC") return "st-info";
    return "st-neutral";
  }

  // QC's pass branch depends on the order's fulfillment method (§6): a
  // Delivery order goes to dispatch, a Pickup order skips straight to
  // "ready for the customer to collect" — Ready for Dispatch/Dispatched
  // don't apply to a pickup order at all.
  function actionsFor(status, order) {
    const isDelivery = order && order.fulfillment === "Delivery";
    switch (status) {
      case "Order Placed": return []; // waiting on the customer to submit GCash proof — nothing for staff to do yet
      case "Pending Payment Verification": return [
        { label: "Verify payment", to: "__verifypayment__", tone: "btn-primary" },
        { label: "Set to On-Hold", to: "__setonhold__", tone: "btn-secondary" },
      ];
      // A hold is parked, not dead: once whatever was unclear is settled
      // over email/chat, Verify payment fires straight from here to
      // Confirmed (verify-payment.js accepts On Hold line items directly).
      case "On Hold": return [
        { label: "Verify payment", to: "__verifypayment__", tone: "btn-primary" },
      ];
      // needsPrice is not cosmetic: advance-line-item.js REQUIRES a valid
      // positive priceEach on this one transition and 400s without it. A
      // quote with no price was the UAT bug — staff could "send" one and
      // the customer got a priced-status order with nothing to pay.
      case "Quoted": return [{ label: "Send price to customer", to: "Priced", tone: "btn-primary", needsPrice: true }];
      case "Priced": return [{ label: "Mark payment received", to: "Confirmed", tone: "btn-primary" }];
      case "Confirmed": return [{ label: "Schedule", to: "Scheduled", tone: "btn-primary", needsStation: true }];
      case "Scheduled": return [{ label: "Start production", to: "In Production", tone: "btn-primary", needsStation: true, needsSetup: true }];
      case "In Production": return [{ label: "Send to QC", to: "QC", tone: "btn-primary" }];
      case "QC": return isDelivery ? [
        { label: "Pass QC → Ready for Dispatch", to: "Ready for Dispatch", tone: "btn-primary" },
        { label: "Fail QC → Rework", to: "__rework__", tone: "btn-secondary" },
      ] : [
        { label: "Pass QC → Ready for Pickup", to: "Ready for Pickup", tone: "btn-primary" },
        { label: "Fail QC → Rework", to: "__rework__", tone: "btn-secondary" },
      ];
      case "Rework": return [{ label: "Back to Production", to: "In Production", tone: "btn-primary" }];
      case "Ready for Dispatch": return [{ label: "Dispatch", to: "Dispatched", tone: "btn-primary" }];
      case "Dispatched": return [{ label: "Mark Delivered", to: "Delivered", tone: "btn-primary" }];
      case "Ready for Pickup": return [{ label: "Mark Picked Up", to: "Picked Up", tone: "btn-primary" }];
      default: return [];
    }
  }

  // ---- attachment rendering + the malware-scan gate ----
  // An attachment only ever carries a `url` when GuardDuty returned
  // NO_THREATS_FOUND (the Lambdas withhold it otherwise — see
  // backend/staff-api/get-orders.js). Anything else renders as a
  // non-clickable record instead of disappearing: staff need to know a file
  // arrived, what it was called, and why they can't open it. For an
  // infected file the bytes are already deleted from S3 by
  // backend/jobs/handle-scan-result.js — this row IS the only remaining
  // trace, which is exactly why it must keep the filename and threat name.
  const SCAN_LABEL = {
    THREATS_FOUND: "Malware detected — file deleted from storage.",
    PENDING: "Scanning… reload in a moment.",
    UNSUPPORTED: "Couldn't be scanned (unsupported or too large) — download blocked.",
    ACCESS_DENIED: "Scan unavailable (access denied) — download blocked.",
    FAILED: "Scan failed — download blocked.",
    UNKNOWN: "Scan status unknown — download blocked.",
  };
  function scanNote(att) {
    const status = att.scanStatus || "PENDING";
    let msg = SCAN_LABEL[status] || SCAN_LABEL.UNKNOWN;
    if (att.quarantinedAt) msg += " Removed " + fmtDateTime(att.quarantinedAt) + ".";
    return msg;
  }

  // Plain-English explanation, resolved at scan time by
  // backend/lib/threat-descriptions.js and stored on the record. Renders as
  // a labelled block rather than a raw signature name, because the person
  // reading this is deciding what to tell a customer, not doing forensics.
  // The raw signature is kept behind a <details> for whoever does need it.
  function threatBlock(att) {
    const t = att.threatInfo;
    if (!t) return "";
    return (
      `<div style="margin-top:6px;padding:6px 8px;border-radius:5px;background:rgba(255,255,255,.55)">` +
      `<div style="font-weight:600;font-size:11.5px">${escapeHtml(t.label)}</div>` +
      `<div style="font-size:11.5px;margin-top:1px">${escapeHtml(t.plain)}</div>` +
      (t.advice ? `<div style="font-size:11.5px;margin-top:3px"><strong>What to do:</strong> ${escapeHtml(t.advice)}</div>` : "") +
      (t.technical ? `<details style="margin-top:3px"><summary style="font-size:10.5px;cursor:pointer;color:var(--text-muted,#888)">Technical name</summary>` +
        `<code style="font-size:10.5px;word-break:break-all">${escapeHtml(t.technical)}</code></details>` : "") +
      `</div>`
    );
  }
  function isBlocked(att) { return !att.url; }

  function renderAttachments(attachments) {
    if (!attachments || !attachments.length) return "";
    return (
      `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">` +
      attachments.map((a) => {
        if (isBlocked(a)) {
          const bad = a.scanStatus === "THREATS_FOUND";
          return `<div style="font-size:12px;padding:5px 9px;border-radius:6px;max-width:100%;` +
            `border:1px solid ${bad ? "#c0392b" : "var(--border,#ddd)"};` +
            `background:color-mix(in srgb, ${bad ? "#c0392b" : "#888"} 9%, transparent)">` +
            `${bad ? "🚫" : "⏳"} <s>${escapeHtml(a.filename)}</s>` +
            `<div style="font-size:11px;margin-top:2px">${escapeHtml(scanNote(a))}</div>` +
            threatBlock(a) + `</div>`;
        }
        const isImage = /^image\//.test(a.contentType || "");
        return isImage
          ? `<a href="${escapeHtml(a.url)}" target="_blank" rel="noopener"><img src="${escapeHtml(a.url)}" alt="${escapeHtml(a.filename)}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--border,#ddd);display:block" /></a>`
          : `<a href="${escapeHtml(a.url)}" target="_blank" rel="noopener" style="font-size:12px;padding:4px 8px;background:var(--surface-2,#fafbfd);border:1px solid var(--border,#ddd);border-radius:6px;text-decoration:none">📎 ${escapeHtml(a.filename)}</a>`;
      }).join("") +
      `</div>`
    );
  }

  // AWS-style order tags — small staff-set key/value pairs
  // (backend/staff-api/set-order-tags.js) for filtering/reporting, e.g.
  // Type=Reprint or Environment=Test. Every value here reaches the DOM,
  // so both the key and the value go through escapeHtml() same as
  // correspondence notes; the server (backend/lib/tags.js) is the real
  // validation boundary, this is display + a fail-fast client check.
  function renderTags(order) {
    const tags = Array.isArray(order.tags) ? order.tags : [];
    const suggestions = KCMPS_DASH.getDefaultOrderTags()
      .filter((d) => !tags.some((t) => t.key.toLowerCase() === d.key.toLowerCase()));
    return (
      `<div class="card" style="margin-bottom:var(--space-4)">` +
      `<h3 style="margin-top:0">Tags</h3>` +
      `<div id="tags-list" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--space-2)">` +
      (tags.length
        ? tags.map((t) =>
            `<span class="tag tag-outline" style="display:inline-flex;align-items:center;gap:6px;padding-right:4px">` +
            `${escapeHtml(t.key)}${t.value ? ": " + escapeHtml(t.value) : ""}` +
            `<button type="button" class="tag-remove-btn" data-key="${escapeHtml(t.key)}" aria-label="Remove tag ${escapeHtml(t.key)}" style="border:none;background:none;cursor:pointer;font-size:13px;line-height:1;padding:0 2px;color:inherit">&times;</button>` +
            `</span>`
          ).join("")
        : `<p class="q-empty" style="margin:0">No tags yet.</p>`) +
      `</div>` +
      (suggestions.length
        ? `<div style="margin-bottom:var(--space-2)">` +
          `<p class="text-muted" style="font-size:12px;margin:0 0 4px">Suggested:</p>` +
          `<div style="display:flex;flex-wrap:wrap;gap:6px">` +
          suggestions.map((d) =>
            `<button type="button" class="tag tag-neutral tag-suggest-btn" data-key="${escapeHtml(d.key)}" data-value="${escapeHtml(d.value)}" title="${escapeHtml(d.hint || "")}" style="cursor:pointer;border:none">+ ${escapeHtml(d.key)}${d.value ? ": " + escapeHtml(d.value) : ""}</button>`
          ).join("") +
          `</div></div>`
        : "") +
      `<div style="display:flex;gap:8px;flex-wrap:wrap">` +
      `<input class="input" id="tag-key-input" style="flex:1;min-width:110px" placeholder="Key" maxlength="40" />` +
      `<input class="input" id="tag-value-input" style="flex:1;min-width:110px" placeholder="Value (optional)" maxlength="120" />` +
      `<button type="button" class="btn btn-secondary" id="tag-add-btn">Add tag</button>` +
      `</div>` +
      `<p id="tags-error" style="display:none;color:#c0392b;font-size:13px;margin:4px 0 0"></p>` +
      `</div>`
    );
  }

  function wireTags(order) {
    const errorHost = document.getElementById("tags-error");
    async function commitTags(newTags, btn) {
      errorHost.style.display = "none";
      await withBusy(btn, async () => {
        try {
          await KCMPS_DASH.setOrderTags(order.orderId, newTags, claims.name || claims.email);
          await render();
        } catch (err) {
          errorHost.textContent = err.message;
          errorHost.style.display = "";
        }
      });
    }
    document.querySelectorAll(".tag-remove-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.key;
        commitTags((order.tags || []).filter((t) => t.key !== key), btn);
      });
    });
    document.querySelectorAll(".tag-suggest-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        commitTags((order.tags || []).concat([{ key: btn.dataset.key, value: btn.dataset.value }]), btn);
      });
    });
    const addBtn = document.getElementById("tag-add-btn");
    const keyInput = document.getElementById("tag-key-input");
    const valueInput = document.getElementById("tag-value-input");
    function addFromInputs() {
      const key = keyInput.value.trim();
      const value = valueInput.value.trim();
      errorHost.style.display = "none";
      if (!key) { errorHost.textContent = "A tag key is required."; errorHost.style.display = ""; return; }
      if ((order.tags || []).some((t) => t.key.toLowerCase() === key.toLowerCase())) {
        errorHost.textContent = `A tag with key "${key}" already exists.`;
        errorHost.style.display = "";
        return;
      }
      commitTags((order.tags || []).concat([{ key, value }]), addBtn);
    }
    addBtn.addEventListener("click", addFromInputs);
    valueInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addFromInputs(); });
    keyInput.addEventListener("keydown", (e) => { if (e.key === "Enter") addFromInputs(); });
  }

  // Customer-uploaded design/print files (checkout/upload-design-file.js) —
  // same gate as every other attachment, just laid out as full-width rows
  // since print filenames are long and staff scan this list deliberately.
  function renderDesignFiles(files) {
    if (!files || !files.length) return "";
    return (
      `<div class="m-block" style="flex-basis:100%"><h4>Customer design files</h4>` +
      `<div style="display:flex;flex-direction:column;gap:6px;margin-top:4px">` +
      files.map((f) => {
        const size = f.size ? ` · ${(f.size / (1024 * 1024)).toFixed(1)} MB` : "";
        if (!isBlocked(f)) {
          return `<a href="${escapeHtml(f.url)}" download style="font-size:13px;font-weight:400;text-decoration:none;padding:6px 10px;border:1px solid var(--border,#ddd);border-radius:6px;background:var(--surface-2,#fafbfd)">` +
            `⬇ ${escapeHtml(f.filename)}<span class="text-muted" style="font-size:11.5px">${escapeHtml(size)}</span></a>`;
        }
        const bad = f.scanStatus === "THREATS_FOUND";
        return `<div style="font-size:13px;font-weight:400;padding:6px 10px;border-radius:6px;` +
          `border:1px solid ${bad ? "#c0392b" : "var(--border,#ddd)"};` +
          `background:color-mix(in srgb, ${bad ? "#c0392b" : "#888"} 8%, transparent)">` +
          `${bad ? "🚫" : "⏳"} <s>${escapeHtml(f.filename)}</s><span class="text-muted" style="font-size:11.5px">${escapeHtml(size)}</span>` +
          `<div style="font-size:11.5px;margin-top:2px">${escapeHtml(scanNote(f))}</div>` +
          threatBlock(f) + `</div>`;
      }).join("") +
      `</div></div>`
    );
  }

  // Customer chat via order threads (staff side) — sender-role styling
  // distinguishes a customer's own message from a staff reply, mirroring
  // order-detail.html's customer-facing panel but reading claims here
  // instead of a "mine" comparison, since staff never IS the order's
  // customerSub.
  function renderMessage(m) {
    const staffMsg = m.senderRole === "staff";
    const align = staffMsg ? "flex-end" : "flex-start";
    const bg = staffMsg ? "var(--accent-soft, #fff1e6)" : "var(--surface-2, #fafbfd)";
    return (
      `<div style="align-self:${align};max-width:80%;background:${bg};border-radius:10px;padding:8px 12px">` +
      `<div style="font-size:11px;color:var(--text-muted,#888);margin-bottom:2px">${staffMsg ? "Staff" : "Customer"} · ${fmtDateTime(m.at)}</div>` +
      (m.body ? `<div style="font-size:13.5px;white-space:pre-wrap;word-break:break-word">${escapeHtml(m.body)}</div>` : "") +
      renderAttachments(m.attachments) +
      `</div>`
    );
  }

  let messagePollTimer = null;
  function renderMessages(messages) {
    const list = document.getElementById("message-list");
    if (!list) return;
    list.innerHTML = messages.length
      ? messages.map(renderMessage).join("")
      : `<p class="q-empty" style="margin:0;font-size:13px">No messages yet.</p>`;
    list.scrollTop = list.scrollHeight;
  }

  function loadMessages(orderId) {
    // View-only — does NOT mark the customer's messages read (see
    // dashboard-data.js's getOrderMessages() header). Opening the ticket
    // or the 8s background poll should show the thread without silently
    // clearing its own unread badge before staff ever see it; only
    // markRead() below (wired to the reply box's focus) does that.
    KCMPS_DASH.getOrderMessages(orderId).then(renderMessages)
      .catch(() => { /* silent — don't disrupt the ticket over a poll failure */ });
  }

  // Fired once the reply box gains focus — a real "staff is engaging with
  // this thread" signal, unlike just having the ticket open. Refreshes the
  // sidebar badge right after so it drops immediately instead of waiting
  // up to 45s for the shell's own poll.
  let markedReadFor = null;
  function markRead(orderId) {
    if (markedReadFor === orderId) return;
    markedReadFor = orderId;
    KCMPS_DASH.markMessagesRead(orderId).then((messages) => {
      renderMessages(messages);
      KCMPS_DASH_SHELL.refreshUnreadBadge();
    }).catch(() => { /* silent — don't disrupt the ticket over a mark-read failure */ });
  }

  function wireMessages(order) {
    loadMessages(order.orderId);
    if (messagePollTimer) clearInterval(messagePollTimer);
    messagePollTimer = setInterval(() => {
      if (document.visibilityState === "visible") loadMessages(order.orderId);
    }, 8000);

    const input = document.getElementById("message-input");
    const filesInput = document.getElementById("message-files");
    const sendBtn = document.getElementById("message-send-btn");
    const errorEl = document.getElementById("message-error");
    input.addEventListener("focus", () => markRead(order.orderId));
    function send() {
      const text = input.value.trim();
      const files = Array.from(filesInput.files || []);
      if (!text && !files.length) return;
      errorEl.style.display = "none";
      sendBtn.disabled = true;
      KCMPS_DASH.sendOrderMessage(order.orderId, text, files).then(() => {
        input.value = "";
        filesInput.value = "";
        sendBtn.disabled = false;
        loadMessages(order.orderId);
      }).catch((err) => {
        errorEl.textContent = err.message; errorEl.style.display = "";
        sendBtn.disabled = false;
      });
    }
    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
  }

  async function render(flash) {
    const body = document.getElementById("detail-body");
    let order;
    try {
      order = await KCMPS_DASH.getOrder(orderId);
    } catch (err) {
      body.innerHTML = '<div class="empty-state">Couldn’t load this ticket — ' + escapeHtml(err.message) + '</div>';
      return;
    }
    if (!order) { body.innerHTML = '<div class="empty-state">Ticket not found. It may have been reset — try re-seeding from Settings.</div>'; return; }
    const li = order.lineItems.find((x) => x.lineItemId === lineId) || order.lineItems[0];
    const events = KCMPS_DASH.getEventsFor(orderId).filter((e) => e.lineItemId === li.lineItemId);
    const stations = KCMPS_DASH.getStations();
    const reasons = KCMPS_DASH.getSpoilageReasons();
    const actions = actionsFor(li.status, order);

    body.innerHTML =
      // Order ID first and large — it's the primary identifier staff
      // cross-reference against GCash payments and email (Spacemail search,
      // GCash transaction history), so it has to be the easiest thing on
      // the page to spot and copy, not a small muted aside. Line ID stays
      // secondary/small since it only matters once staff already have the
      // right ticket open.
      `<div class="ticket-head"><div>` +
      `<div class="ticket-orderid" title="Order ID — cross-reference against GCash payments and Spacemail">${escapeHtml(order.orderId)}</div>` +
      `<h1 style="margin:0 0 4px">${escapeHtml(li.description)}</h1>` +
      `<span class="status-pill ${statusTone(li.status)}${flash ? " dash-flash" : ""}">${li.status}</span>` +
      (order.source === "manual" ? ' <span class="tag tag-neutral">Manual entry</span>' : "") +
      `</div>` +
      `<div class="text-muted" style="text-align:right;font-size:12px">Line ${li.lineItemId}</div></div>` +

      renderTags(order) +

      `<div class="card ticket-meta">` +
      `<div class="m-block"><h4>Client</h4><p>${escapeHtml(order.client ? order.client.name : "—")}</p></div>` +
      // Split contact channels (backend/checkout/create-order.js) so staff
      // can see exactly which method(s) the customer actually gave, rather
      // than one ambiguous freeform string — only render the channels that
      // are actually present.
      (order.email ? `<div class="m-block"><h4>Email</h4><p>${escapeHtml(order.email)}</p></div>` : "") +
      (order.phone ? `<div class="m-block"><h4>Phone</h4><p>${escapeHtml(order.phone)}</p></div>` : "") +
      (order.messenger ? `<div class="m-block"><h4>Messenger</h4><p>${escapeHtml(order.messenger)}</p></div>` : "") +
      (order.otherContact ? `<div class="m-block"><h4>Other contact</h4><p>${escapeHtml(order.otherContact)}</p></div>` : "") +
      `<div class="m-block"><h4>Type</h4><p>${li.type === "custom" ? "Custom request" : "Quick-buy SKU"}</p></div>` +
      `<div class="m-block"><h4>Qty</h4><p>${li.qty || "—"}</p></div>` +
      `<div class="m-block"><h4>Amount</h4><p>${li.amount ? fmtPeso(li.amount) : "—"}</p></div>` +
      `<div class="m-block"><h4>Original promise date</h4><p>${fmtDate(order.originalPromisedDate)}</p></div>` +
      `<div class="m-block"><h4>Station</h4><p>${li.station ? escapeHtml(li.station) : "Unassigned"}</p></div>` +
      `<div class="m-block"><h4>Setup minutes</h4><p>${li.setupMinutes != null ? li.setupMinutes + " min" : "Not logged"}</p></div>` +
      (li.notes ? `<div class="m-block" style="flex-basis:100%"><h4>Notes</h4><p style="font-weight:400">${escapeHtml(li.notes)}</p></div>` : "") +
      `<div class="m-block"><h4>Fulfillment</h4><p>${escapeHtml(order.fulfillment || "—")}</p></div>` +
      (order.fulfillment === "Delivery" && order.shipping
        ? `<div class="m-block" style="flex-basis:100%"><h4>Address</h4><p style="font-weight:400">${escapeHtml(order.shipping.address)}${order.shipping.landmark ? ` (near ${escapeHtml(order.shipping.landmark)})` : ""}${order.shipping.courier ? `<br>Courier: ${escapeHtml(order.shipping.courier)}` : ""}</p></div>`
        : "") +
      (order.notes ? `<div class="m-block" style="flex-basis:100%"><h4>Additional notes</h4><p style="font-weight:400">${escapeHtml(order.notes)}</p></div>` : "") +
      renderDesignFiles(order.designFiles) +
      `</div>` +

      // GCash bridge proof — per the Payment System file's staff-dashboard
      // spec: "shows screenshot, reference number, claimed amount, order
      // ID, timestamp." Lives on order.payment, shown for the lifetime of
      // the order (not just while Pending) so a verify/hold decision stays
      // auditable from the ticket.
      (order.payment ? `<div class="card ticket-meta" style="margin-bottom:var(--space-4)">` +
        `<div class="m-block"><h4>GCash reference</h4><p>${escapeHtml(order.payment.gcashRefNumber)}</p></div>` +
        `<div class="m-block"><h4>Claimed amount</h4><p>${fmtPeso(order.payment.claimedAmount)}</p></div>` +
        `<div class="m-block" style="flex-basis:100%"><h4>Screenshot</h4>` +
        // The screenshot is the one upload staff must actually LOOK at, so
        // it keeps an inline <img> — but only once it clears the same scan
        // gate as every other attachment (get-orders.js's withScreenshotUrl).
        // A blocked proof means the payment can't be verified from a preview.
        (order.payment.screenshotUrl
          ? `<a href="${escapeHtml(order.payment.screenshotUrl)}" target="_blank" rel="noopener"><img src="${escapeHtml(order.payment.screenshotUrl)}" alt="GCash payment screenshot" style="max-width:min(280px, 100%);max-height:280px;border-radius:8px;border:1px solid var(--border,#ddd);display:block" /></a>`
          : (order.payment.scanStatus && order.payment.scanStatus !== "NO_THREATS_FOUND"
            ? `<div style="font-weight:400;font-size:12.5px;padding:6px 10px;border-radius:6px;border:1px solid ${order.payment.scanStatus === "THREATS_FOUND" ? "#c0392b" : "var(--border,#ddd)"};background:color-mix(in srgb, ${order.payment.scanStatus === "THREATS_FOUND" ? "#c0392b" : "#888"} 8%, transparent)">` +
              `${order.payment.scanStatus === "THREATS_FOUND" ? "🚫" : "⏳"} Preview blocked — ${escapeHtml(scanNote(order.payment))}` +
              threatBlock(order.payment) + `</div>`
            : `<p style="font-weight:400;font-size:12.5px">${escapeHtml(order.payment.screenshotRef)} (preview unavailable — mock/manual order)</p>`)) +
        `</div>` +
        `<div class="m-block"><h4>Submitted</h4><p>${fmtDateTime(order.payment.submittedAt)}</p></div>` +
        (order.payment.verifiedAt ? `<div class="m-block"><h4>Verified</h4><p>${fmtDateTime(order.payment.verifiedAt)} by ${escapeHtml(order.payment.verifiedBy || "—")}</p></div>` : "") +
        // `rejectionReason` is the pre-On-Hold field name — still read so
        // orders held/auto-cancelled before the rename keep showing why.
        ((order.payment.holdReason || order.payment.rejectionReason) ? `<div class="m-block" style="flex-basis:100%"><h4>On-hold reason</h4><p style="font-weight:400">${escapeHtml(order.payment.holdReason || order.payment.rejectionReason)}</p></div>` : "") +
        `</div>` : "") +

      `<div class="card" style="margin-bottom:var(--space-4)">` +
      `<div style="display:flex;justify-content:space-between;align-items:center;gap:var(--space-2);flex-wrap:wrap;margin-bottom:var(--space-2)">` +
      `<h3 style="margin:0">Customer correspondence</h3>` +
      `<button type="button" class="btn btn-secondary" id="search-spacemail-btn">Search Spacemail for this order</button>` +
      `</div>` +
      `<p class="text-muted" style="font-size:12px;margin:0 0 var(--space-2)">Log entries are notes only — no email content is stored here. Use the search button to open the actual thread in admin@kcmps.com.</p>` +
      `<div id="correspondence-list">` +
      (order.correspondenceLog && order.correspondenceLog.length
        ? order.correspondenceLog.slice().reverse().map((c) =>
            `<div style="border-left:3px solid var(--accent, #ff7a1a);padding:6px 10px;margin-bottom:6px;font-size:13px;background:var(--surface-2, #fafbfd);border-radius:0 6px 6px 0">` +
            `<div class="text-muted" style="font-size:11px;margin-bottom:2px">${fmtDateTime(c.at)} — ${escapeHtml(c.actorName)}</div>` +
            (c.note ? escapeHtml(c.note) : "") +
            renderAttachments(c.attachments) +
            `</div>`
          ).join("")
        : `<p class="q-empty" style="margin:0">No logged correspondence yet.</p>`) +
      `</div>` +
      `<div style="display:flex;gap:8px;margin-top:var(--space-2);flex-wrap:wrap">` +
      `<input class="input" id="correspondence-input" style="flex:1;min-width:200px" placeholder="e.g. Customer approved design via email, ref subject [${escapeHtml(order.orderId)}]" />` +
      `<input type="file" id="correspondence-files" multiple accept="image/jpeg,image/png,image/webp,image/gif,application/pdf" style="max-width:180px;font-size:12px" />` +
      `<button type="button" class="btn btn-primary" id="correspondence-add-btn">Log</button>` +
      `</div>` +
      `<p id="correspondence-error" style="display:none;color:#c0392b;font-size:13px;margin:4px 0 0"></p>` +
      `</div>` +

      `<div class="card" style="margin-bottom:var(--space-4)">` +
      `<h3 style="margin-top:0">Messages</h3>` +
      `<p class="text-muted" style="font-size:12px;margin:0 0 var(--space-2)">Direct thread with the customer on this order — separate from the correspondence log above, which is staff notes only.</p>` +
      `<div id="message-list" style="max-height:320px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:var(--space-2)"></div>` +
      `<div style="display:flex;gap:8px;flex-wrap:wrap">` +
      `<input class="input" id="message-input" style="flex:1;min-width:200px" placeholder="Reply to the customer…" maxlength="4000" />` +
      `<input type="file" id="message-files" multiple accept="image/jpeg,image/png,image/webp,image/gif,application/pdf" style="max-width:180px;font-size:12px" />` +
      `<button type="button" class="btn btn-primary" id="message-send-btn">Send</button>` +
      `</div>` +
      `<p id="message-error" style="display:none;color:#c0392b;font-size:13px;margin:4px 0 0"></p>` +
      `</div>` +

      (li.spoilage && li.spoilage.length ? `<div class="card" style="margin-bottom:var(--space-4)"><h3 style="margin-top:0">Spoilage on this line</h3>` +
        li.spoilage.map((s) => `<p style="margin:4px 0;font-size:13.5px">${s.units} unit(s) — ${escapeHtml(s.reasonCode)} — ${fmtPeso(s.valuePhp)} — ${fmtDateTime(s.at)}</p>`).join("") +
        `</div>` : "") +

      `<div class="card" style="margin-bottom:var(--space-4)"><h3 style="margin-top:0">Advance this job</h3>` +
      `<div id="action-error"></div>` +
      `<div id="action-form"></div>` +
      `<div class="action-bar" id="action-bar">` +
      actions.map((a, i) => `<button type="button" class="btn ${a.tone}" data-idx="${i}">${a.label}</button>`).join("") +
      (actions.length ? "" : `<span class="text-muted" style="font-size:13px">${li.status === "Order Placed" ? "Waiting on the customer to submit GCash payment proof — no staff action yet." : "This line is in a terminal state — no further action."}</span>`) +
      `</div></div>` +

      `<div class="card"><h3 style="margin-top:0">Event timeline</h3><div class="timeline">` +
      (events.length ? events.map((e) => (
        `<div class="timeline-row"><span class="tl-time">${fmtDateTime(e.at)}</span>` +
        `<span class="tl-transition">${e.from || "—"} → ${e.to}</span>` +
        `<span class="text-muted">${e.station ? "station " + escapeHtml(e.station) + " · " : ""}${escapeHtml(e.actorName || "")}</span></div>`
      )).join("") : '<p class="q-empty">No recorded transitions yet.</p>') +
      `</div></div>`;

    document.getElementById("search-spacemail-btn").addEventListener("click", () => {
      const url = SPACEMAIL_SEARCH_URL.replace("{q}", encodeURIComponent(order.orderId));
      window.open(url, "_blank", "noopener");
    });
    const correspondenceErrorHost = document.getElementById("correspondence-error");
    document.getElementById("correspondence-add-btn").addEventListener("click", async (e) => {
      const input = document.getElementById("correspondence-input");
      const filesInput = document.getElementById("correspondence-files");
      const note = input.value.trim();
      const files = Array.from(filesInput.files || []);
      if (!note && !files.length) return;
      correspondenceErrorHost.style.display = "none";
      await withBusy(e.currentTarget, async () => {
        try {
          await KCMPS_DASH.addCorrespondence(order.orderId, note, files, claims.name || claims.email);
          await render();
        } catch (err) {
          correspondenceErrorHost.textContent = err.message;
          correspondenceErrorHost.style.display = "";
        }
      });
    });
    document.getElementById("correspondence-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") document.getElementById("correspondence-add-btn").click();
    });
    wireMessages(order);
    wireTags(order);

    const formHost = document.getElementById("action-form");
    const errorHost = document.getElementById("action-error");
    document.querySelectorAll("#action-bar [data-idx]").forEach((btn) => {
      btn.addEventListener("click", () => {
        errorHost.innerHTML = "";
        const action = actions[Number(btn.dataset.idx)];
        if (action.to === "__verifypayment__") {
          formHost.innerHTML =
            `<p style="font-size:13px;margin:0 0 var(--space-2)">This confirms the GCash payment covering every sku item on order ${escapeHtml(order.orderId)} still awaiting verification or on hold — not just this line.</p>` +
            `<button type="button" class="btn btn-primary" id="verify-confirm">Confirm — verify payment</button>`;
          document.getElementById("verify-confirm").addEventListener("click", async (e) => {
            await withBusy(e.currentTarget, async () => {
              try {
                await KCMPS_DASH.verifyPayment(order.orderId, claims.name || claims.email);
                await render(true);
              } catch (err) { showInlineError(errorHost, err.message); }
            });
          });
          return;
        }
        if (action.to === "__setonhold__") {
          formHost.innerHTML =
            `<div class="field" style="margin-bottom:var(--space-3)"><label for="hold-reason">What needs checking? (sent to the customer)</label>` +
            `<textarea class="input" id="hold-reason" rows="2" placeholder="e.g. the screenshot attached is of a different transaction"></textarea></div>` +
            `<button type="button" class="btn btn-secondary" id="hold-confirm">Confirm — set to On-Hold</button>`;
          document.getElementById("hold-confirm").addEventListener("click", async (e) => {
            const reason = document.getElementById("hold-reason").value.trim();
            if (!reason) { showInlineError(errorHost, "A reason is required to put a payment on hold."); return; }
            await withBusy(e.currentTarget, async () => {
              try {
                await KCMPS_DASH.setOnHold(order.orderId, reason, claims.name || claims.email);
                await render(true);
              } catch (err) { showInlineError(errorHost, err.message); }
            });
          });
          return;
        }
        if (action.to === "__rework__") {
          formHost.innerHTML =
            `<div class="dash-form-grid" style="margin-bottom:var(--space-3)">` +
            `<div class="field"><label>Spoiled units</label><input class="input" id="rw-units" type="number" min="0" value="1" /></div>` +
            `<div class="field"><label>Reason</label><select class="input" id="rw-reason">${reasons.map((r) => `<option value="${r.code}">${r.label}</option>`).join("")}</select></div>` +
            `<div class="field"><label>Value (₱)</label><input class="input" id="rw-value" type="number" min="0" value="0" /></div>` +
            `</div><button type="button" class="btn btn-primary" id="rw-confirm">Confirm — send to Rework</button>`;
          document.getElementById("rw-confirm").addEventListener("click", async (e) => {
            const units = parseInt(document.getElementById("rw-units").value, 10) || 0;
            const reasonCode = document.getElementById("rw-reason").value;
            const valuePhp = parseFloat(document.getElementById("rw-value").value) || 0;
            await withBusy(e.currentTarget, async () => {
              try {
                await KCMPS_DASH.sendToRework(order.orderId, li.lineItemId, { units, reasonCode, valuePhp });
                await render(true);
              } catch (err) { showInlineError(errorHost, err.message); }
            });
          });
          return;
        }
        if (action.needsStation || action.needsSetup || action.needsPrice) {
          const qty = li.qty || 1;
          formHost.innerHTML =
            `<div class="dash-form-grid" style="margin-bottom:var(--space-3)">` +
            (action.needsPrice ? `<div class="field"><label for="adv-price">Price per unit (₱)</label><input class="input" id="adv-price" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="e.g. 250.00" /><p class="muted" style="margin:4px 0 0;font-size:12px">Quantity is ${qty} — the customer is billed price × ${qty}.</p></div>` : "") +
            (action.needsStation ? `<div class="field"><label>Station</label><select class="input" id="adv-station">${stations.map((s) => `<option value="${s.id}"${li.station === s.id ? " selected" : ""}>${s.label}</option>`).join("")}</select></div>` : "") +
            (action.needsSetup ? `<div class="field"><label>Setup minutes (start-setup → start-run tap)</label><input class="input" id="adv-setup" type="number" min="0" placeholder="e.g. 15" /></div>` : "") +
            `</div><button type="button" class="btn btn-primary" id="adv-confirm">Confirm — ${action.label}</button>`;
          document.getElementById("adv-confirm").addEventListener("click", async (e) => {
            const station = action.needsStation ? document.getElementById("adv-station").value : undefined;
            const setupMinutes = action.needsSetup ? parseInt(document.getElementById("adv-setup").value, 10) || 0 : undefined;
            let priceEach;
            if (action.needsPrice) {
              // Validate here as well as server-side: the backend's 400 is
              // correct but arrives as a generic API error, and a staffer
              // who mistyped a price deserves to be told which field.
              priceEach = parseFloat(document.getElementById("adv-price").value);
              if (!(priceEach > 0) || !isFinite(priceEach)) {
                showInlineError(errorHost, "Enter a price per unit greater than 0 before sending the quote.");
                return;
              }
            }
            await withBusy(e.currentTarget, async () => {
              try {
                await KCMPS_DASH.advanceLineItem(order.orderId, li.lineItemId, { to: action.to, station, setupMinutes, priceEach });
                await render(true);
              } catch (err) { showInlineError(errorHost, err.message); }
            });
          });
          return;
        }
        withBusy(btn, async () => {
          try {
            await KCMPS_DASH.advanceLineItem(order.orderId, li.lineItemId, { to: action.to });
            await render(true);
          } catch (err) { showInlineError(errorHost, err.message); }
        });
      });
    });
  }

  render();
})();
</script>
</body>
</html>
