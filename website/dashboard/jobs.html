<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://6msg2uho6c.execute-api.ap-southeast-1.amazonaws.com https://162ufc121j.execute-api.ap-southeast-1.amazonaws.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" />
<title>Jobs — KCMPS Ops</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dash-gate-hide">

<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"><div id="dash-nav"></div></aside>
  <div class="dash-main">
    <header class="dash-topbar">
      <button type="button" id="dash-nav-toggle" class="dash-nav-toggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16Zm176,112H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
      </button>
      <div id="dash-topbar-content" style="display:flex;justify-content:space-between;align-items:center;flex:1;gap:var(--space-3)"></div>
    </header>

    <main class="dash-content">
      <section class="dsec">
        <div class="dsec-head">
          <h2>All job tickets</h2>
          <span class="hint">A checkout submission is the usual ticket — for clients who order by chat/DM/in person, log one below instead of retyping it into a checkout</span>
        </div>

        <div class="card" style="margin-bottom:var(--space-3)">
          <div style="display:flex;justify-content:space-between;align-items:center;gap:var(--space-3);flex-wrap:wrap">
            <div>
              <h3 style="margin:0 0 2px">Log a manual order</h3>
              <p class="hint" style="margin:0">Talk-in, Messenger DM, phone — creates the same kind of ticket a checkout would</p>
            </div>
            <button type="button" class="btn btn-secondary" id="manual-order-toggle">+ New manual order</button>
          </div>
          <div class="dash-collapsible" id="manual-order-collapsible"><div>
          <form class="dash-form-grid" id="manual-order-form">
            <div class="field">
              <label for="mo-client">Client</label>
              <select class="input" id="mo-client"></select>
            </div>
            <div class="field" id="mo-newclient-name-field" style="display:none">
              <label for="mo-newclient-name">New client name</label>
              <input class="input" id="mo-newclient-name" placeholder="e.g. Mika Reyes" />
            </div>
            <div class="field" id="mo-newclient-type-field" style="display:none">
              <label for="mo-newclient-type">New client type</label>
              <select class="input" id="mo-newclient-type"><option value="B2C">B2C — individual</option><option value="B2B">B2B — organization</option></select>
            </div>
            <div class="field" style="grid-column:1/-1">
              <label for="mo-desc">Description</label>
              <input class="input" id="mo-desc" placeholder="e.g. 20 pcs DTF shirts, black, size run" required />
            </div>
            <div class="field">
              <label for="mo-type">Item type</label>
              <select class="input" id="mo-type"><option value="sku">Quick-buy (SKU)</option><option value="custom">Custom request</option></select>
            </div>
            <div class="field" id="mo-sku-field">
              <label for="mo-sku">SKU code (optional)</label>
              <input class="input" id="mo-sku" placeholder="e.g. PRINT-DTF-SHIRT" />
            </div>
            <div class="field">
              <label for="mo-qty">Qty</label>
              <input class="input" id="mo-qty" type="number" min="1" value="1" />
            </div>
            <div class="field">
              <label for="mo-price">Price each (₱, optional if not yet quoted)</label>
              <input class="input" id="mo-price" type="number" min="0" step="0.01" placeholder="e.g. 350" />
            </div>
            <div class="field">
              <label for="mo-due">Promised date</label>
              <input class="input" id="mo-due" type="date" required />
            </div>
            <div class="field">
              <label for="mo-status">Status</label>
              <select class="input" id="mo-status"></select>
            </div>
            <div class="field" id="mo-gcash-ref-field" style="display:none">
              <label for="mo-gcash-ref">GCash reference number</label>
              <input class="input" id="mo-gcash-ref" placeholder="e.g. 8017 442 99331" />
            </div>
            <div class="field" id="mo-gcash-amount-field" style="display:none">
              <label for="mo-gcash-amount">Claimed amount (₱)</label>
              <input class="input" id="mo-gcash-amount" type="number" min="0" step="0.01" />
            </div>
            <div class="field" id="mo-paidvia-field" style="display:none">
              <label for="mo-paidvia">Paid via (optional)</label>
              <select class="input" id="mo-paidvia">
                <option value="">— not logged —</option>
                <option value="cash">Cash</option>
                <option value="gcash">GCash</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div class="field" id="mo-paidref-field" style="display:none">
              <label for="mo-paidref">Reference / O.R. number (optional)</label>
              <input class="input" id="mo-paidref" placeholder="e.g. OR #0231 or GCash ref" />
            </div>
            <div class="field" style="grid-column:1/-1">
              <label for="mo-notes">Notes (optional)</label>
              <input class="input" id="mo-notes" placeholder="e.g. Ordered via FB Messenger DM" />
            </div>
            <div id="mo-error" style="grid-column:1/-1"></div>
            <button type="submit" class="btn btn-primary" style="grid-column:1/-1;justify-self:start">Create ticket</button>
          </form>
          </div></div>
        </div>

        <div class="card" style="margin-bottom:var(--space-3)">
          <div class="dash-form-grid">
            <div class="field"><label for="f-search">Search</label><input class="input" id="f-search" placeholder="Client, description, order ID…" /></div>
            <div class="field"><label for="f-status">Status</label><select class="input" id="f-status"><option value="">All statuses</option></select></div>
          </div>
        </div>
        <div class="card" id="job-list-card">
          <div class="job-row job-row-head" style="font-size:11px;letter-spacing:0.05em;text-transform:uppercase;color:color-mix(in srgb, var(--color-text) 55%, transparent);font-weight:700">
            <span>Job</span><span>Client</span><span>Status</span><span>Due</span><span></span>
          </div>
          <div id="job-list"></div>
        </div>
      </section>
    </main>
  </div>
</div>

<script src="dashboard-data.js"></script>
<script src="dashboard-shell.js"></script>
<script>
(() => {
  const claims = KCMPS_DASH_SHELL.mount("jobs");
  if (!claims) return;
  const { fmtDate, escapeHtml, withBusy, showInlineError } = KCMPS_DASH_SHELL;

  function statusTone(status) {
    if (["Delivered", "Ready for Dispatch", "Dispatched"].includes(status)) return "st-good";
    if (["Rework", "On Hold", "Cancelled", "Auto-Cancelled", "Quote Expired"].includes(status)) return "st-bad";
    if (["Pending Payment Verification", "Quoted", "Priced"].includes(status)) return "st-warn";
    if (status === "In Production" || status === "QC") return "st-info";
    return "st-neutral";
  }

  async function allRows() {
    const orders = await KCMPS_DASH.getAllOrders();
    const rows = [];
    orders.forEach((o) => o.lineItems.forEach((li) => rows.push({ order: o, li })));
    return rows.sort((a, b) => new Date(b.li.enteredStatusAt) - new Date(a.li.enteredStatusAt));
  }

  let rows = [];

  function refreshStatusFilterOptions() {
    const statuses = [...new Set(rows.map((r) => r.li.status))].sort();
    const sel = document.getElementById("f-status");
    const current = sel.value;
    sel.innerHTML = '<option value="">All statuses</option>' + statuses.map((s) => `<option value="${s}">${s}</option>`).join("");
    sel.value = statuses.includes(current) ? current : "";
  }

  // Set right before a render() that should call out its result — a job
  // just created via the manual-order form. Cleared after one render so the
  // 20s poll refresh below doesn't keep re-flashing it.
  let highlightOrderId = null;

  function render() {
    const q = document.getElementById("f-search").value.trim().toLowerCase();
    const statusFilter = document.getElementById("f-status").value;
    const filtered = rows.filter((r) => {
      if (statusFilter && r.li.status !== statusFilter) return false;
      if (!q) return true;
      const hay = [r.li.description, r.order.client?.name, r.order.orderId].join(" ").toLowerCase();
      return hay.includes(q);
    });
    const list = document.getElementById("job-list");
    if (!filtered.length) { list.innerHTML = '<div class="empty-state">No jobs match.</div>'; return; }
    list.innerHTML = filtered.map(({ order, li }) => (
      `<a class="job-row${order.orderId === highlightOrderId ? " is-new" : ""}" style="text-decoration:none;color:inherit" href="job-detail.html?order=${encodeURIComponent(order.orderId)}&line=${encodeURIComponent(li.lineItemId)}">` +
      `<span>${escapeHtml(li.description)}${order.source === "manual" ? ' <span class="tag tag-neutral" style="font-size:10px">Manual</span>' : ""}</span>` +
      `<span>${escapeHtml(order.client ? order.client.name : "—")}</span>` +
      `<span class="status-pill ${statusTone(li.status)}">${li.status}</span>` +
      `<span>${fmtDate(order.originalPromisedDate)}</span>` +
      `<span class="text-muted" style="font-size:12px">${order.orderId} / ${li.lineItemId}</span>` +
      `</a>`
    )).join("");
    highlightOrderId = null;
  }
  document.getElementById("f-search").addEventListener("input", render);
  document.getElementById("f-status").addEventListener("change", render);

  async function init() {
    const list = document.getElementById("job-list");
    list.innerHTML = '<div class="empty-state">Loading jobs&hellip;</div>';
    try {
      rows = await allRows();
    } catch (err) {
      list.innerHTML = '<div class="empty-state">Couldn’t load jobs — ' + escapeHtml(err.message) + '</div>';
      return;
    }
    refreshStatusFilterOptions();
    render();
  }
  init();

  // Live-ish refresh: staff shouldn't have to hit F5 to see a job another
  // teammate just advanced. Re-fetches and re-renders on an interval rather
  // than a real push channel (no WebSocket/SSE backend exists) — cheap and
  // good enough at this order volume. Filters/search stay put since render()
  // just re-reads the current input values.
  setInterval(init, 20000);

  /* ---- manual order form ---- */
  const moForm = document.getElementById("manual-order-form");
  const moCollapsible = document.getElementById("manual-order-collapsible");
  const moToggle = document.getElementById("manual-order-toggle");

  // max-height is measured/set here rather than left to a CSS 0fr/1fr grid
  // trick — that trick can't resolve a height inside this flex-column .card
  // (see dashboard.css). Once open, the cap is released to "none" so fields
  // that reveal more rows (e.g. picking "+ New client…") aren't clipped.
  function openMoForm() {
    moCollapsible.classList.add("is-open");
    // Force the browser to register max-height:0 as the transition's "from"
    // value before changing it — without this reflow, the class add and the
    // maxHeight set below land in the same style recalc and the transition
    // never registers a starting point (verified live: it silently stuck
    // the element at 0 height instead of animating open).
    void moCollapsible.offsetHeight;
    moCollapsible.style.maxHeight = moCollapsible.scrollHeight + "px";
    moCollapsible.addEventListener("transitionend", function onEnd(e) {
      if (e.propertyName !== "max-height") return;
      moCollapsible.removeEventListener("transitionend", onEnd);
      if (moCollapsible.classList.contains("is-open")) moCollapsible.style.maxHeight = "none";
    });
    moToggle.textContent = "Cancel";
  }
  function closeMoForm() {
    // Pin to a concrete pixel height first (it may currently be "none") so
    // the browser has a defined value to transition down from.
    moCollapsible.style.maxHeight = moCollapsible.scrollHeight + "px";
    void moCollapsible.offsetHeight; // force layout to register that value
    moCollapsible.classList.remove("is-open");
    moCollapsible.style.maxHeight = "0px";
    moToggle.textContent = "+ New manual order";
  }
  moToggle.addEventListener("click", () => {
    if (moCollapsible.classList.contains("is-open")) closeMoForm(); else openMoForm();
  });

  const moClient = document.getElementById("mo-client");
  const moNewNameField = document.getElementById("mo-newclient-name-field");
  const moNewTypeField = document.getElementById("mo-newclient-type-field");
  function refreshClientOptions() {
    const clients = KCMPS_DASH.getClients().sort((a, b) => a.name.localeCompare(b.name));
    moClient.innerHTML = clients.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("") +
      '<option value="__new__">+ New client…</option>';
  }
  refreshClientOptions();
  moClient.addEventListener("change", () => {
    const isNew = moClient.value === "__new__";
    moNewNameField.style.display = isNew ? "" : "none";
    moNewTypeField.style.display = isNew ? "" : "none";
  });

  const moType = document.getElementById("mo-type");
  const moSkuField = document.getElementById("mo-sku-field");
  const moStatus = document.getElementById("mo-status");
  const MANUAL_STATUS_OPTIONS = {
    sku: [
      { value: "Pending Payment Verification", label: "Awaiting GCash payment" },
      { value: "Confirmed", label: "Confirmed — already paid (cash or GCash)" },
    ],
    custom: [
      { value: "Quoted", label: "Awaiting quote" },
      { value: "Priced", label: "Priced, awaiting payment" },
      { value: "Confirmed", label: "Confirmed — already paid (cash or GCash)" },
    ],
  };
  const moGcashRefField = document.getElementById("mo-gcash-ref-field");
  const moGcashAmountField = document.getElementById("mo-gcash-amount-field");
  const moPaidViaField = document.getElementById("mo-paidvia-field");
  const moPaidRefField = document.getElementById("mo-paidref-field");
  function refreshStatusOptions() {
    const opts = MANUAL_STATUS_OPTIONS[moType.value];
    moStatus.innerHTML = opts.map((o) => `<option value="${o.value}">${o.label}</option>`).join("");
    moSkuField.style.display = moType.value === "sku" ? "" : "none";
    refreshPaymentFields();
  }
  function refreshPaymentFields() {
    const needsGcash = moStatus.value === "Pending Payment Verification";
    moGcashRefField.style.display = needsGcash ? "" : "none";
    moGcashAmountField.style.display = needsGcash ? "" : "none";
    const isConfirmed = moStatus.value === "Confirmed";
    moPaidViaField.style.display = isConfirmed ? "" : "none";
    moPaidRefField.style.display = isConfirmed ? "" : "none";
  }
  moType.addEventListener("change", refreshStatusOptions);
  moStatus.addEventListener("change", refreshPaymentFields);
  refreshStatusOptions();

  const moErrorHost = document.getElementById("mo-error");
  const moSubmitBtn = moForm.querySelector('button[type="submit"]');
  moForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    moErrorHost.innerHTML = "";
    const isNewClient = moClient.value === "__new__";
    await withBusy(moSubmitBtn, async () => {
      let newOrder;
      try {
        newOrder = KCMPS_DASH.createManualOrder({
          clientId: isNewClient ? null : moClient.value,
          newClientName: isNewClient ? document.getElementById("mo-newclient-name").value : "",
          newClientType: document.getElementById("mo-newclient-type").value,
          description: document.getElementById("mo-desc").value,
          type: moType.value,
          sku: document.getElementById("mo-sku").value,
          qty: document.getElementById("mo-qty").value,
          priceEach: document.getElementById("mo-price").value,
          promisedDate: document.getElementById("mo-due").value,
          status: moStatus.value,
          gcashRefNumber: document.getElementById("mo-gcash-ref").value,
          claimedAmount: document.getElementById("mo-gcash-amount").value,
          paidVia: document.getElementById("mo-paidvia").value,
          paidRef: document.getElementById("mo-paidref").value,
          notes: document.getElementById("mo-notes").value,
          actorName: claims.name || claims.email,
        });
      } catch (err) { showInlineError(moErrorHost, err.message); return; }

      moForm.reset();
      closeMoForm();
      moNewNameField.style.display = "none";
      moNewTypeField.style.display = "none";
      refreshClientOptions();
      refreshStatusOptions();
      highlightOrderId = newOrder.orderId;
      rows = await allRows();
      refreshStatusFilterOptions();
      render();
    });
  });
})();
</script>
</body>
</html>
