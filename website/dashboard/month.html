<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" />
<title>This Month — KCMPS Ops</title>
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dash-gate-hide">

<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"><div id="dash-nav"></div></aside>
  <div class="dash-main">
    <header class="dash-topbar">
      <button type="button" id="dash-nav-toggle" class="dash-nav-toggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16Zm176,112H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
      </button>
      <div id="dash-topbar-content" style="display:flex;justify-content:space-between;align-items:center;flex:1;gap:var(--space-3)"></div>
    </header>

    <main class="dash-content">

      <section class="dsec">
        <div class="dsec-head">
          <h2 id="month-heading">Headline KPIs</h2>
          <span class="hint">Capped at ~12 metrics on purpose — more metrics produce less action</span>
        </div>
        <div class="kpi-row" id="kpi-row"></div>
      </section>

      <section class="dsec">
        <div class="dsec-head">
          <h2>Gross margin by pillar</h2>
          <span class="hint">Estimated vs. actual cost is the number that catches wrong estimator formulas</span>
        </div>
        <div class="card">
          <div style="overflow-x:auto">
          <table class="table pillar-table">
            <thead><tr><th>Pillar</th><th class="num">Revenue</th><th class="num">Gross margin</th><th class="num">Margin %</th><th class="num">Est. vs actual cost</th></tr></thead>
            <tbody id="pillar-body"></tbody>
          </table>
          </div>
        </div>
      </section>

      <section class="dsec">
        <div class="dsec-head"><h2>Client concentration &amp; quiet accounts</h2></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)" id="client-cols"></div>
      </section>

    </main>
  </div>
</div>

<script src="dashboard-data.js"></script>
<script src="dashboard-shell.js"></script>
<script>
(() => {
  const claims = KCMPS_DASH_SHELL.mount("month");
  if (!claims) return;
  const { fmtPeso, fmtDate, escapeHtml } = KCMPS_DASH_SHELL;
  const m = KCMPS_DASH.getMonthData();

  document.getElementById("month-heading").textContent = "Headline KPIs — " + new Date(m.monthKey + "-01").toLocaleDateString("en-PH", { month: "long", year: "numeric" });

  function kpi(label, value, sub, tone) {
    return `<div class="card tile${tone ? " " + tone : ""}"><div class="t-label">${label}</div><div class="t-value">${value}</div>${sub ? `<div class="t-sub">${sub}</div>` : ""}</div>`;
  }
  const s = m.summary;
  const kpis = [
    kpi("OTIF", m.otifPct != null ? m.otifPct + "%" : "—", "vs. original promise date, never revised", m.otifPct != null && m.otifPct < 90 ? "warn" : "good"),
    kpi("NRFT", m.nrftPct != null ? m.nrftPct + "%" : "—", (s.nrftCount || 0) + " jobs not-right-first-time", m.nrftPct > 5 ? "bad" : "good"),
    kpi("Spoilage rate", m.spoilageRate != null ? m.spoilageRate + "%" : "—", "cost of spoilage / sales", m.spoilageRate > 3 ? "bad" : "good"),
    kpi("Revenue", fmtPeso(s.revenue), (s.jobCount || 0) + " jobs"),
    kpi("Est. vs actual cost", fmtPeso((s.actualCost || 0) - (s.estimatedCost || 0)), "actual − estimated, all jobs", (s.actualCost > s.estimatedCost) ? "warn" : "good"),
    kpi("Rush orders", "—", "wire up once rush-order flag ships"),
    kpi("Cash collected", fmtPeso(s.cashCollected)),
    kpi("Cash outstanding", fmtPeso(s.cashOutstanding), null, s.cashOutstanding > 0 ? "warn" : "good"),
    kpi("Repeat-order revenue", m.repeatRatePct != null ? m.repeatRatePct + "%" : "—", "share of revenue from B2B repeat accounts"),
    kpi("Inventory turns", "—", "wire up once turns are tracked"),
    kpi("Aging stock", "—", "wire up once turns are tracked"),
    kpi("Seasonal comparison", "—", "available once 12 months of data exist"),
  ];
  document.getElementById("kpi-row").innerHTML = kpis.join("");

  const fmt = (n) => fmtPeso(n);
  document.getElementById("pillar-body").innerHTML = m.pillars.map((p) => (
    `<tr><td>${escapeHtml(p.name)}</td><td class="num">${fmt(p.revenue)}</td><td class="num">${fmt(p.grossMargin)}</td>` +
    `<td class="num ${p.marginPct >= 30 ? "pos" : "neg"}">${p.marginPct != null ? p.marginPct + "%" : "—"}</td>` +
    `<td class="num ${p.costVariance <= 0 ? "pos" : "neg"}">${fmt(p.costVariance)} (${p.costVariancePct != null ? (p.costVariancePct > 0 ? "+" : "") + p.costVariancePct + "%" : "—"})</td></tr>`
  )).join("") || `<tr><td colspan="5" class="q-empty">No pillar data yet.</td></tr>`;

  const cols = document.getElementById("client-cols");
  const topRows = m.topClients.map((c) => `<tr><td>${escapeHtml(c.name)}</td><td class="num">${fmtPeso(c.totalRevenue)}</td></tr>`).join("");
  const quietRows = m.quietClients.length
    ? m.quietClients.map((c) => `<tr><td>${escapeHtml(c.name)}</td><td>${fmtDate(c.lastOrderAt)}</td><td><span class="client-flag">reorder overdue</span></td></tr>`).join("")
    : `<tr><td colspan="3" class="q-empty">No quiet B2B accounts right now.</td></tr>`;
  cols.innerHTML =
    `<div class="card"><h3 style="margin-top:0">Top 10 clients by revenue</h3><table class="table"><tbody>${topRows}</tbody></table></div>` +
    `<div class="card"><h3 style="margin-top:0">Quiet accounts — marketing outreach queue</h3><table class="table"><thead><tr><th>Client</th><th>Last order</th><th></th></tr></thead><tbody>${quietRows}</tbody></table></div>`;
})();
</script>
</body>
</html>
