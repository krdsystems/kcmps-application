<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://kcmps-auth.auth.ap-southeast-1.amazoncognito.com https://6msg2uho6c.execute-api.ap-southeast-1.amazonaws.com https://162ufc121j.execute-api.ap-southeast-1.amazonaws.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" />
<title>Settings — KCMPS Ops</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dash-gate-hide">

<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"><div id="dash-nav"></div></aside>
  <div class="dash-main">
    <header class="dash-topbar">
      <button type="button" id="dash-nav-toggle" class="dash-nav-toggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16Zm176,112H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
      </button>
      <div id="dash-topbar-content" style="display:flex;justify-content:space-between;align-items:center;flex:1;gap:var(--space-3)"></div>
    </header>

    <main class="dash-content">
      <!-- id is the deep-link target for the idle guard's "Set up a PIN"
           prompt in dashboard-shell.js — keep them in sync. -->
      <section class="dsec" id="idle-pin" style="scroll-margin-top:var(--space-5)">
        <div class="dsec-head">
          <h2>Idle-screen PIN</h2>
          <!-- The explanation this opens used to sit as a paragraph in the
               card below, where it pushed the actual PIN inputs down the
               page and made the section read as mostly prose. It is real
               information though — it corrects a wrong assumption (that a
               PIN-locked screen is secured) and tells you how to recover a
               forgotten PIN — so it moves behind this button rather than
               being deleted. -->
          <button type="button" class="dsec-help-btn" id="pin-help-btn"
                  aria-expanded="false" aria-controls="pin-help" aria-label="About the idle-screen PIN">?</button>
        </div>
        <div class="card">
          <p class="dsec-help" id="pin-help" hidden>
            This is a privacy screen, not a login — your Cognito sign-in is still the real
            security boundary. Forgot your PIN? Use "Log out instead" on the locked screen, log
            back in, and save a new one — the old PIN isn't needed to replace it.
          </p>
          <div id="pin-status" class="hint" style="margin-bottom:var(--space-3)"></div>
          <!-- Deliberately NOT type="password": that's what taught browser
               password managers to save the PIN and then autofill it into the
               idle lock screen, unlocking it by itself. CSS-masked text
               inputs instead — see dashboard.css's .dash-pin-mask and
               dashboard-shell.js's renderPinGate for the full story. -->
          <div class="dash-form-grid">
            <div class="field"><label for="pin-new">New PIN (4&ndash;6 digits)</label>
              <input class="input dash-pin-mask" id="pin-new" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                autocomplete="one-time-code" name="kcmps-idle-code-new" spellcheck="false"
                data-lpignore="true" data-1p-ignore data-bwignore /></div>
            <div class="field"><label for="pin-confirm">Confirm PIN</label>
              <input class="input dash-pin-mask" id="pin-confirm" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6"
                autocomplete="one-time-code" name="kcmps-idle-code-confirm" spellcheck="false"
                data-lpignore="true" data-1p-ignore data-bwignore /></div>
          </div>
          <div id="pin-error"></div>
          <div style="display:flex;gap:8px;margin-top:var(--space-3);flex-wrap:wrap">
            <button type="button" class="btn btn-primary" id="pin-save-btn">Save PIN</button>
            <button type="button" class="btn btn-secondary" id="pin-remove-btn">Remove PIN</button>
          </div>
        </div>
      </section>

      <!-- Per-staffer device-behaviour setting, same neighbourhood as
           Idle-screen PIN above (both are "how this device behaves for
           me", not order/job data) — backed by the existing dashboard
           prefs API (backend/staff-api/dashboard-prefs.js), not a new
           Lambda. See dashboard-shell.js's mount() for where this is
           read (2026-08-19). -->
      <section class="dsec" id="nav-auto-open">
        <div class="dsec-head">
          <h2>Navigation</h2>
        </div>
        <div class="card">
          <label class="cb-check" for="nav-auto-open-toggle" style="cursor:pointer">
            <input type="checkbox" id="nav-auto-open-toggle" checked />
            <span>Open the menu automatically on mobile</span>
          </label>
          <div id="nav-auto-open-status" class="hint" style="margin:var(--space-2) 0 0 26px"></div>

          <label class="cb-check" for="login-goto-dash-toggle" style="cursor:pointer;margin-top:var(--space-3)">
            <input type="checkbox" id="login-goto-dash-toggle" checked />
            <span>Go straight to the dashboard after logging in</span>
          </label>
          <div id="login-goto-dash-status" class="hint" style="margin:var(--space-2) 0 0 26px"></div>
        </div>
      </section>

    </main>
  </div>
</div>

<script src="../auth-refresh.js"></script>
<script src="dashboard-data.js"></script>
<script src="dashboard-shell.js"></script>
<script>
(() => {
  const claims = KCMPS_DASH_SHELL.mount("settings");
  if (!claims) return;
  const { escapeHtml, withBusy, showInlineError } = KCMPS_DASH_SHELL;

  /* ---- "?" help toggle on the Idle-screen PIN heading ----
     Plain show/hide, not a floating popover: a popover would need
     positioning, outside-click and viewport-collision handling to earn its
     keep, and this is two sentences that can simply appear at the top of
     the card they describe. aria-expanded on the button plus `hidden` on
     the paragraph is the whole contract, so assistive tech and sighted
     users read the same state. */
  const pinHelpBtn = document.getElementById("pin-help-btn");
  const pinHelp = document.getElementById("pin-help");
  function setPinHelp(open) {
    pinHelp.hidden = !open;
    pinHelpBtn.setAttribute("aria-expanded", String(open));
  }
  pinHelpBtn.addEventListener("click", () => setPinHelp(pinHelp.hidden));
  // Escape closes it from either the button or the revealed text, returning
  // focus to the trigger so a keyboard user isn't stranded mid-card.
  [pinHelpBtn, pinHelp].forEach((el) => el.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { setPinHelp(false); pinHelpBtn.focus(); }
  }));

  /* ---- idle-screen PIN (dashboard-shell.js's SESSION_GUARD gate) ----
     Server-verified since 2026-08-07 (backend/staff-api/staff-pin.js via
     dashboard-data.js's setStaffPin/clearStaffPin/getStaffPinStatus) —
     the backend keys the record off the verified JWT sub itself, so
     claims.sub is passed only for call-site compatibility. No "old PIN
     required to change" step: this page already sits behind a live
     Cognito session, which is a stronger check than the PIN itself, so
     re-asking for the PIN just to replace it would add friction with no
     real benefit — and it doubles as the forgot-my-PIN recovery path. */
  const pinStatus = document.getElementById("pin-status");
  const pinErrorHost = document.getElementById("pin-error");
  const pinNewInput = document.getElementById("pin-new");
  const pinConfirmInput = document.getElementById("pin-confirm");
  const pinSaveBtn = document.getElementById("pin-save-btn");
  const pinRemoveBtn = document.getElementById("pin-remove-btn");

  function paintPinStatus(set) {
    pinStatus.textContent = set
      ? "A PIN is set — the idle screen requires it before it will reopen."
      : "No PIN set yet — the idle screen reopens with a plain Resume button.";
    pinRemoveBtn.style.display = set ? "" : "none";
  }
  async function refreshPinStatus() {
    pinStatus.textContent = "Checking…";
    pinRemoveBtn.style.display = "none";
    try { paintPinStatus(await KCMPS_DASH.getStaffPinStatus()); }
    catch { pinStatus.textContent = "Couldn't reach the server to check the PIN status — you can still try saving one."; }
  }
  refreshPinStatus();

  pinSaveBtn.addEventListener("click", async () => {
    pinErrorHost.innerHTML = "";
    const a = pinNewInput.value.trim();
    const b = pinConfirmInput.value.trim();
    if (!/^\d{4,6}$/.test(a)) { showInlineError(pinErrorHost, "PIN must be 4-6 digits."); return; }
    if (a !== b) { showInlineError(pinErrorHost, "The two PINs don't match."); return; }
    await withBusy(pinSaveBtn, async () => {
      try {
        await KCMPS_DASH.setStaffPin(claims.sub, a);
        pinNewInput.value = "";
        pinConfirmInput.value = "";
        paintPinStatus(true);
      } catch (err) { showInlineError(pinErrorHost, err.message); }
    });
  });

  pinRemoveBtn.addEventListener("click", async () => {
    pinErrorHost.innerHTML = "";
    await withBusy(pinRemoveBtn, async () => {
      try {
        await KCMPS_DASH.clearStaffPin(claims.sub);
        paintPinStatus(false);
      } catch (err) { showInlineError(pinErrorHost, err.message); }
    });
  });

  /* ---- auto-open nav drawer on mobile (2026-08-19) ----
     Per-staffer, cross-device — the same dashboard-prefs.js seam jobs.html
     already uses for column order (GET/PATCH /staff/prefs, a shallow-
     merge blob keyed on the JWT sub, no key allowlist per CLAUDE.md — so
     this key needed zero backend change). Default ON: missing/undefined
     reads as true, so a staffer who's never touched this setting gets the
     owner-requested behaviour without having to opt in. See
     dashboard-shell.js's mount() for where this is actually applied. */
  const navAutoOpenToggle = document.getElementById("nav-auto-open-toggle");
  const navAutoOpenStatus = document.getElementById("nav-auto-open-status");
  (async () => {
    try {
      const { data } = await KCMPS_DASH.getDashboardPrefs();
      navAutoOpenToggle.checked = data.autoOpenNavOnMobile !== false;
    } catch {
      // Couldn't reach the server — leave the checkbox at its markup
      // default (checked) rather than blocking the page on this.
      navAutoOpenStatus.textContent = "Couldn't load your saved setting — showing the default.";
    }
  })();
  navAutoOpenToggle.addEventListener("change", async () => {
    const value = navAutoOpenToggle.checked;
    navAutoOpenStatus.textContent = "Saving…";
    try {
      await KCMPS_DASH.setDashboardPref("autoOpenNavOnMobile", value);
      navAutoOpenStatus.textContent = "Saved.";
      setTimeout(() => { navAutoOpenStatus.textContent = ""; }, 2000);
    } catch (err) {
      navAutoOpenToggle.checked = !value;
      navAutoOpenStatus.textContent = "Couldn't save — " + err.message;
    }
  });

  /* "Go straight to the dashboard after logging in" — same /staff/prefs blob,
     same default-ON convention (missing/undefined reads as true). Applied by
     index.html's maybeGoToDashboard(), NOT by anything on this page: the
     redirect happens on the storefront right after the token exchange, which
     is why that file reads this pref over the API directly rather than
     through KCMPS_DASH (dashboard-data.js isn't loaded on the storefront). */
  const loginGotoDashToggle = document.getElementById("login-goto-dash-toggle");
  const loginGotoDashStatus = document.getElementById("login-goto-dash-status");
  (async () => {
    try {
      const { data } = await KCMPS_DASH.getDashboardPrefs();
      loginGotoDashToggle.checked = data.goToDashboardOnLogin !== false;
    } catch {
      loginGotoDashStatus.textContent = "Couldn't load your saved setting — showing the default.";
    }
  })();
  loginGotoDashToggle.addEventListener("change", async () => {
    const value = loginGotoDashToggle.checked;
    loginGotoDashStatus.textContent = "Saving…";
    try {
      await KCMPS_DASH.setDashboardPref("goToDashboardOnLogin", value);
      loginGotoDashStatus.textContent = "Saved.";
      setTimeout(() => { loginGotoDashStatus.textContent = ""; }, 2000);
    } catch (err) {
      loginGotoDashToggle.checked = !value;
      loginGotoDashStatus.textContent = "Couldn't save — " + err.message;
    }
  });
})();
</script>
</body>
</html>
