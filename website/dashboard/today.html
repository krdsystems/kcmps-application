<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data:; connect-src 'self' https://6msg2uho6c.execute-api.ap-southeast-1.amazonaws.com https://162ufc121j.execute-api.ap-southeast-1.amazonaws.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" />
<title>Today — KCMPS Ops</title>
<meta name="robots" content="noindex" />
<link rel="stylesheet" href="../styles.css" />
<link rel="stylesheet" href="dashboard.css" />
</head>
<body class="dash-gate-hide">

<div class="dash-shell">
  <aside class="dash-sidebar" id="dash-sidebar"><div id="dash-nav"></div></aside>
  <div class="dash-main">
    <header class="dash-topbar">
      <button type="button" id="dash-nav-toggle" class="dash-nav-toggle" aria-label="Toggle menu">
        <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor"><path d="M224,128a8,8,0,0,1-8,8H40a8,8,0,0,1,0-16H216A8,8,0,0,1,224,128ZM40,72H216a8,8,0,0,0,0-16H40a8,8,0,0,0,0,16Zm176,112H40a8,8,0,0,0,0,16H216a8,8,0,0,0,0-16Z"/></svg>
      </button>
      <div id="dash-topbar-content" style="display:flex;justify-content:space-between;align-items:center;flex:1;gap:var(--space-3)"></div>
    </header>

    <main class="dash-content">

      <section class="dsec">
        <div class="dsec-head">
          <h2>Action queues</h2>
          <span class="hint">Sorted oldest-first — that's the aging order that matters</span>
        </div>
        <div class="queue-grid" id="queue-grid"><!-- queues render here --></div>
      </section>

      <section class="dsec">
        <div class="dsec-head">
          <h2>Today's numbers</h2>
          <span class="hint">Control metrics only — trends live on the Month view</span>
        </div>
        <div class="tile-grid" id="today-tiles"><!-- tiles render here --></div>
      </section>

      <!-- REMOVED 2026-08-06: "Blockers board" and "Low stock alerts".
           Both ran entirely on the localStorage mock (getBlockers/addBlocker/
           resolveBlocker/getLowStock), so the blocker form looked like it
           logged work for the team but wrote to one browser only — nobody
           else ever saw it and a cache clear erased it. Restore them when a
           real backend exists, not before; the markup is in git history. -->

    </main>
  </div>
</div>

<script src="dashboard-data.js"></script>
<script src="dashboard-shell.js"></script>
<script>
(() => {
  const claims = KCMPS_DASH_SHELL.mount("today");
  if (!claims) return;
  const { fmtPeso, fmtHours, fmtDate, fmtDateTime, escapeHtml } = KCMPS_DASH_SHELL;

  const QUEUE_DEFS = [
    { key: "pendingPaymentVerification", title: "Pending Payment Verification", empty: "Nothing waiting on verification." },
    { key: "awaitingQuote", title: "Awaiting Quote", empty: "No custom items waiting on a quote." },
    { key: "awaitingCustomerPayment", title: "Awaiting Customer Payment", empty: "Nothing waiting on the customer." },
    { key: "readyToProduce", title: "Ready to Produce", empty: "Nothing queued to start." },
    { key: "inProduction", title: "In Production", empty: "Nothing on the floor right now." },
    { key: "qcHoldRework", title: "QC Hold / Rework", empty: "No rework in progress." },
    { key: "readyForDispatch", title: "Ready for Dispatch", empty: "Nothing waiting on handoff." },
    // A review queue, not an action queue — nothing to advance here, just
    // visibility. No SLA color-coding (see getQueues() in dashboard-data.js).
    { key: "cancelled", title: "Cancelled", empty: "No cancellations to review." },
  ];

  async function renderQueues() {
    const grid = document.getElementById("queue-grid");
    let queues;
    try {
      queues = await KCMPS_DASH.getQueues();
    } catch (err) {
      grid.innerHTML = '<div class="empty-state">Couldn’t load today’s queues — ' + escapeHtml(err.message) + '</div>';
      return;
    }
    grid.innerHTML = QUEUE_DEFS.map((def) => {
      const items = queues[def.key] || [];
      const hasRed = items.some((i) => i.slaState === "red");
      const rows = items.length
        ? items.map((li) => {
            const cls = "q-item" + (li.slaState === "red" ? " sla-red" : li.slaState === "warn" ? " sla-warn" : "");
            const client = li.order.client ? escapeHtml(li.order.client.name) : "—";
            // Payment System file's staff-dashboard spec: the verification
            // queue must show the GCash reference number and claimed amount
            // inline, not just aging — that's what lets staff cross-check
            // against actual GCash transaction history without opening the
            // ticket first.
            const paymentLine = li.payment
              ? `<div class="q-line2"><span>Ref ${escapeHtml(li.payment.gcashRefNumber)} · claimed ${fmtPeso(li.payment.claimedAmount)}</span></div>`
              : "";
            // Cancelled queue: surface customer-cancelled vs. auto-expired at
            // a glance instead of making staff open the ticket to tell them
            // apart — the two carry very different follow-up (a customer
            // decision vs. a payment window that lapsed).
            const reasonLine = def.key === "cancelled"
              ? `<div class="q-line2"><span>${li.status === "Auto-Cancelled" ? "Auto-cancelled — payment window expired" : "Cancelled by customer"}</span></div>`
              : "";
            return (
              `<a class="${cls}" href="job-detail.html?order=${encodeURIComponent(li.orderId)}&line=${encodeURIComponent(li.lineItemId)}">` +
              // A future enteredStatusAt (operating-hours SLA clock not
              // started yet — see decorateLineItem()'s comment) shows the
              // real open time instead of a misleading "0m"/negative age.
              `<div class="q-line1"><span>${escapeHtml(li.description)}</span><span class="q-age">${li.queuedUntil ? "Opens " + fmtDateTime(li.queuedUntil) : fmtHours(li.agingHours)}</span></div>` +
              `<div class="q-line2"><span>${client}${li.dueDate ? " · due " + fmtDate(li.dueDate) : ""}</span>${li.dueRisk ? '<span style="color:#c0392b;font-weight:700">at risk</span>' : ""}</div>` +
              paymentLine + reasonLine +
              `</a>`
            );
          }).join("")
        : `<p class="q-empty">${def.empty}</p>`;
      return (
        `<div class="card queue-card">` +
        `<div class="q-head"><span class="q-title">${def.title}</span><span class="queue-count${hasRed ? " has-red" : ""}">${items.length}</span></div>` +
        `<div class="q-list">${rows}</div></div>`
      );
    }).join("");
  }

  function tile(label, value, sub, tone) {
    return `<div class="card tile${tone ? " " + tone : ""}"><div class="t-label">${label}</div><div class="t-value">${value}</div>${sub ? `<div class="t-sub">${sub}</div>` : ""}</div>`;
  }

  async function renderTiles() {
    const host = document.getElementById("today-tiles");
    let n;
    try {
      n = await KCMPS_DASH.getTodayNumbers();
    } catch (err) {
      host.innerHTML = '<div class="empty-state">Couldn’t load today’s numbers — ' + escapeHtml(err.message) + '</div>';
      return;
    }
    // Only the tiles derived from REAL orders survive. getTodayNumbers() also
    // returns output/spoilage/rework/cash-collected, but those read
    // state.metrics out of the localStorage mock — they would show one
    // browser's invented numbers next to genuine ones, which is worse than
    // not showing them, because nothing on screen says which is which.
    // Restore them when a metrics backend exists (Milestone 2).
    const tiles = [
      tile("Jobs due today", n.dueToday, `${n.dueTodayAtRisk} not yet in production`, n.dueTodayAtRisk > 0 ? "bad" : "good"),
      tile("WIP count", n.wipCount, "Confirmed → QC"),
    ];
    host.innerHTML = tiles.join("");
  }

  // Both pull from the real staff-api — show a loading placeholder for the
  // brief window before the first fetch resolves rather than leaving the
  // grid blank, which read identically to "nothing to do today."
  document.getElementById("queue-grid").innerHTML = '<p class="q-empty">Loading queues&hellip;</p>';
  document.getElementById("today-tiles").innerHTML = '<p class="q-empty">Loading numbers&hellip;</p>';
  renderQueues();
  renderTiles();

  // Live-ish refresh so a payment verified or a job advanced elsewhere shows
  // up without an F5 — see the matching note in jobs.html. Everything left on
  // this page is real order data, so everything left gets re-polled.
  setInterval(() => { renderQueues(); renderTiles(); }, 20000);
})();

</script>
</body>
</html>
