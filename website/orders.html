<title>My Orders — KCMPS</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand" style="text-decoration:none">
    <img src="assets/logo-mark.png" alt="" />
    <span style="margin:0">
      <span class="brand-short">KCMPS</span><span class="brand-sep" aria-hidden="true">|</span><span class="brand-long">Kaalyados Creatives Merchandise and Printing Services</span>
    </span>
  </a>
  <div class="nav-links" style="display:flex;gap:var(--space-4);align-items:center;margin-left:auto">
    <a href="index.html">Back to shop</a>
    <button type="button" id="cart-btn" class="btn btn-icon btn-secondary" aria-label="Cart" title="Cart">
      <svg width="18" height="18" viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M222.14,58.87A8,8,0,0,0,216,56H54.68L49.79,29.14A16,16,0,0,0,34.05,16H16a8,8,0,0,0,0,16h18l25.16,138.28A24,24,0,0,0,82.76,190H197.2a24,24,0,0,0,23.6-19.71l12.16-66.86A8,8,0,0,0,222.14,58.87ZM96,224a16,16,0,1,1-16-16A16,16,0,0,1,96,224Zm104,0a16,16,0,1,1-16-16A16,16,0,0,1,200,224Z"/></svg>
      <span id="cart-badge" class="is-hidden">0</span>
    </button>
    <button type="button" id="logout-btn" class="btn btn-ghost">Logout</button>
  </div>
</nav>

<main class="orders-wrap">
  <button type="button" id="new-message-banner" class="new-message-banner" style="display:none">
    New message! <span class="count" id="new-message-count"></span>
  </button>
  <section id="unread-messages-section" class="card unread-messages-card" style="display:none" tabindex="-1">
    <p class="detail-card-title">Unread messages</p>
    <div id="unread-messages-list"></div>
  </section>
  <div class="orders-head">
    <h1 style="margin:0">My Orders</h1>
  </div>
  <div class="orders-toolbar">
    <div class="tabs" data-tabs id="order-tabs">
      <div class="tab-list" role="tablist"></div>
    </div>
    <input class="input orders-search" id="orders-search" type="search" placeholder="Search order ID or item…" />
  </div>
  <div id="orders-root"><div class="orders-loading">Loading your orders&hellip;</div></div>
</main>

<script src="products.js"></script>
<script src="store.js"></script>
<script src="orders-data.js"></script>
<script>
(function () {
  var O = window.KCMPS_ORDERS;
  var session = O.requireSession();
  if (!session) return; // requireSession() already redirected

  document.getElementById("logout-btn").addEventListener("click", O.logout);

  var TAB_ORDER = ["all", "action", "progress", "completed", "cancelled"];
  var TAB_LABELS = { all: "All" };
  Object.keys(O.BUCKETS).forEach(function (k) { TAB_LABELS[k] = O.BUCKETS[k].label; });

  var allOrders = [];
  var activeTab = "all";
  var query = "";

  function initials(name) {
    return String(name || "?").trim().split(/\s+/).slice(0, 2).map(function (w) { return w[0]; }).join("").toUpperCase();
  }

  function renderLine(li) {
    var thumb = li.image
      ? '<img class="line-thumb" src="' + O.escapeHtml(li.image) + '" alt="" loading="lazy" />'
      : '<span class="line-thumb-fallback">' + O.escapeHtml(initials(li.name)) + '</span>';
    return (
      '<div class="line-row">' + thumb +
      '<div class="line-info"><div class="line-name">' + O.escapeHtml(li.name) + '</div>' +
      '<div class="line-meta">Qty ' + (li.qty || 1) + (li.amount ? " · " + O.fmtPeso(li.amount) : "") + '</div></div>' +
      '<span class="line-status">' + O.escapeHtml(li.status.label || li.status.raw) + '</span></div>'
    );
  }

  function renderProgress(order) {
    if (order.bucket === "cancelled") return ""; // a filled bar reading "Delivered" on a cancelled order is worse than no bar
    var stageIdx = order.status.stageIndex != null ? order.status.stageIndex : 0;
    var steps = O.STAGES.map(function (_, i) {
      var cls = i <= stageIdx ? "is-done" : "";
      if (order.status.tone === "bad" && i === stageIdx) cls = "is-bad";
      return '<div class="progress-step ' + cls + '"></div>';
    }).join("");
    return '<div class="order-progress">' + steps + '</div><div class="stage-label">' + O.escapeHtml(order.status.label || O.STAGES[stageIdx]) + '</div>';
  }

  function renderOrder(order) {
    var lines = order.lineItems.map(renderLine).join("");
    return (
      '<a class="card order-card" href="order-detail.html?id=' + encodeURIComponent(order.orderId) + '">' +
        '<div class="order-top">' +
          '<span class="order-id">Order ' + O.escapeHtml(order.orderId) + ' <span class="text-muted" style="font-weight:400">· ' + O.fmtDate(order.createdAt) + '</span></span>' +
          '<span class="tone-pill tone-' + order.status.tone + '">' + O.escapeHtml(order.status.label || order.status.raw) + '</span>' +
        '</div>' +
        (lines ? '<div class="line-list">' + lines + '</div>' : "") +
        '<div class="detail-row" style="border:none;padding-top:0"><span class="k">' + order.itemCount + ' item' + (order.itemCount === 1 ? "" : "s") + '</span>' +
        '<span class="order-total">' + O.fmtPeso(order.total) + '</span></div>' +
        renderProgress(order) +
      '</a>'
    );
  }

  function counts() {
    var c = { all: allOrders.length, action: 0, progress: 0, completed: 0, cancelled: 0 };
    allOrders.forEach(function (o) { c[o.bucket] = (c[o.bucket] || 0) + 1; });
    return c;
  }

  function buildTabs() {
    var c = counts();
    var list = document.querySelector("#order-tabs .tab-list");
    list.innerHTML = TAB_ORDER.map(function (key) {
      return '<button type="button" class="tab-btn" data-tab="' + key + '" aria-selected="' + (key === activeTab) + '">' +
        O.escapeHtml(TAB_LABELS[key]) + (c[key] ? ' (' + c[key] + ')' : "") + '</button>';
    }).join("");
    list.querySelectorAll(".tab-btn").forEach(function (btn) {
      btn.addEventListener("click", function () {
        activeTab = btn.dataset.tab;
        list.querySelectorAll(".tab-btn").forEach(function (b) { b.setAttribute("aria-selected", "false"); });
        btn.setAttribute("aria-selected", "true");
        renderList();
      });
    });
  }

  function matchesQuery(order, q) {
    if (!q) return true;
    q = q.toLowerCase();
    if (order.orderId.toLowerCase().indexOf(q) !== -1) return true;
    return order.lineItems.some(function (li) { return (li.name || "").toLowerCase().indexOf(q) !== -1; });
  }

  function renderList() {
    var root = document.getElementById("orders-root");
    var filtered = allOrders
      .filter(function (o) { return activeTab === "all" || o.bucket === activeTab; })
      .filter(function (o) { return matchesQuery(o, query); });
    if (!filtered.length) {
      root.innerHTML = allOrders.length
        ? '<div class="orders-empty">No orders match.</div>'
        : '<div class="orders-empty">No orders yet — start one from the shop.</div>';
      return;
    }
    root.innerHTML = filtered.map(renderOrder).join("");
  }

  document.getElementById("orders-search").addEventListener("input", function (e) {
    query = e.target.value.trim();
    renderList();
  });

  O.list().then(function (orders) {
    allOrders = orders;
    buildTabs();
    renderList();
  }).catch(function (err) {
    document.getElementById("orders-root").innerHTML = '<div class="orders-error">' + O.escapeHtml(err.message || "Couldn't load your orders right now. Please try again shortly.") + '</div>';
  });

  /* ---------- unread messages (backend/staff-api/get-unread-messages.js's
     customer branch) ----------
     Independent of the order list load above — a slow/failed order fetch
     shouldn't hide the message notice, and vice versa. Loaded once per
     page visit (no polling here — this is a summary banner, not a live
     thread; order-detail.html's own panel polls once the customer is
     actually looking at a thread). */
  function truncate(s, n) {
    s = String(s || "");
    return s.length > n ? s.slice(0, n).replace(/\s+\S*$/, "") + "…" : s;
  }

  function renderUnreadThread(t) {
    return (
      '<button type="button" class="unread-thread-row" data-order-id="' + O.escapeHtml(t.orderId) + '">' +
      '<div class="unread-thread-top">' +
      '<span class="order-id">Order ' + O.escapeHtml(t.orderId) + '</span>' +
      '<span class="unread-thread-count">' + (t.unreadCount > 9 ? "9+" : t.unreadCount) + '</span>' +
      '</div>' +
      '<span class="unread-thread-preview">' + O.escapeHtml(truncate(t.lastMessageBody, 90)) + '</span>' +
      '</button>'
    );
  }

  function goToThread(orderId) {
    window.location.href = "order-detail.html?id=" + encodeURIComponent(orderId) + "#messages";
  }

  O.getUnreadMessageSummary().then(function (summary) {
    var threads = (summary && summary.threads) || [];
    var total = (summary && summary.totalUnread) || 0;
    if (!total) return;

    var banner = document.getElementById("new-message-banner");
    var section = document.getElementById("unread-messages-section");
    document.getElementById("new-message-count").textContent = total;
    banner.style.display = "";
    section.style.display = "";

    document.getElementById("unread-messages-list").innerHTML = threads.map(renderUnreadThread).join("");
    document.querySelectorAll(".unread-thread-row").forEach(function (row) {
      row.addEventListener("click", function () { goToThread(row.dataset.orderId); });
    });

    banner.addEventListener("click", function () {
      section.scrollIntoView({ behavior: "smooth", block: "start" });
      section.focus({ preventScroll: true });
    });
  }).catch(function (err) {
    console.warn("[orders] unread message summary failed:", err.message);
  });
})();
</script>
</body>
</html>
