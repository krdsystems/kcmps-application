<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://media.base44.com data:; connect-src 'self' https://ap-southeast-1idvaeumnp.auth.ap-southeast-1.amazoncognito.com https://6msg2uho6c.execute-api.ap-southeast-1.amazonaws.com; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'none'" />
<title>My Orders — KCMPS</title>
<link rel="stylesheet" href="styles.css" />
<style>
  /* Order-card layout takes cues from Shopee/Lazada's order list: a slim
     header (order id/date + an at-a-glance status pill), item rows built
     around a thumbnail (never a wall of text with no visual anchor), and
     the progress detail below the fold rather than competing with the
     items for attention. */
  .orders-wrap { max-width: 880px; margin: 0 auto; padding: var(--space-6) var(--space-4) var(--space-8); }
  .orders-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-5); gap: var(--space-3); }
  .order-card + .order-card { margin-top: var(--space-4); }
  .order-top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-3); flex-wrap: wrap; padding-bottom: var(--space-3); border-bottom: 1px solid var(--color-border, #eee); }
  .order-id { font-family: var(--font-heading); font-weight: 700; }
  .order-status-pill {
    font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px;
    background: var(--color-accent-100); color: var(--color-accent-800);
  }
  .order-status-pill.is-rejected { background: #fbe4e1; color: #c0392b; }
  .order-status-pill.is-done { background: var(--color-green-100, #e3f6ea); color: var(--color-green, #1f8a4c); }
  .line-list { margin-top: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }
  .line-row { display: flex; align-items: center; gap: var(--space-3); font-size: 13.5px; padding: 6px 0; }
  .line-thumb {
    width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex-shrink: 0;
    background: var(--color-neutral-100, #f1f1f1); border: 1px solid var(--color-border, #eee);
  }
  .line-thumb-fallback {
    width: 52px; height: 52px; border-radius: 8px; flex-shrink: 0;
    background: var(--color-neutral-100, #f1f1f1); border: 1px solid var(--color-border, #eee);
    display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--color-text-muted, #999);
  }
  .line-info { flex: 1; min-width: 0; }
  .line-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .line-meta { font-size: 12px; color: var(--color-text-muted, #666); margin-top: 2px; }
  .line-status { font-size: 12px; font-weight: 600; color: var(--color-text-muted, #666); white-space: nowrap; }
  .progress { display: flex; gap: 4px; margin: var(--space-3) 0 0; }
  .progress-step { flex: 1; height: 6px; border-radius: 999px; background: var(--color-border, #e4e4e7); }
  .progress-step.is-done { background: var(--color-accent); }
  .progress-step.is-rejected { background: #c0392b; }
  .stage-label { font-size: 12.5px; color: var(--color-text-muted, #666); margin-top: 4px; }
  .orders-empty, .orders-loading, .orders-error { text-align: center; color: var(--color-text-muted, #666); padding: var(--space-6) 0; }
</style>
</head>
<body>

<nav class="nav">
  <a href="index.html" class="nav-brand" style="text-decoration:none">
    <img src="assets/logo-mark.png" alt="" />
    <span style="margin:0">
      <span class="brand-short">KCMPS</span><span class="brand-sep" aria-hidden="true">|</span><span class="brand-long">Kaalyados Creatives Merchandise and Printing Services</span>
    </span>
  </a>
  <div class="nav-links" style="display:flex;gap:var(--space-4);align-items:center;margin-left:auto">
    <a href="index.html">Back to shop</a>
    <button type="button" id="logout-btn" class="btn btn-ghost">Logout</button>
  </div>
</nav>

<main class="orders-wrap">
  <div class="orders-head">
    <h1 style="margin:0">My Orders</h1>
  </div>
  <div id="orders-root"><div class="orders-loading">Loading your orders&hellip;</div></div>
</main>

<script src="products.js"></script>
<script>
(function () {
  const COGNITO_CONFIG = {
    domain: "https://ap-southeast-1idvaeumnp.auth.ap-southeast-1.amazoncognito.com",
    clientId: "95rrk0mflffentqdiomg1fipc",
    redirectUri: window.location.origin + "/",
  };
  const TOKEN_STORAGE_KEY = "kcmps_tokens";
  const API_BASE = "https://6msg2uho6c.execute-api.ap-southeast-1.amazonaws.com";

  function loadTokens() {
    const raw = sessionStorage.getItem(TOKEN_STORAGE_KEY);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch { return null; }
  }
  function clearTokens() { sessionStorage.removeItem(TOKEN_STORAGE_KEY); }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function fmtPeso(n) { return "₱" + Number(n || 0).toLocaleString("en-PH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function fmtDate(iso) { if (!iso) return "—"; try { return new Date(iso).toLocaleDateString("en-PH", { month: "short", day: "numeric", year: "numeric" }); } catch { return iso; } }

  const tokens = loadTokens();
  if (!tokens || !tokens.id_token) {
    window.location.replace("index.html?login=required");
    return;
  }

  document.getElementById("logout-btn").addEventListener("click", () => {
    clearTokens();
    window.location.href = `${COGNITO_CONFIG.domain}/logout?${new URLSearchParams({
      client_id: COGNITO_CONFIG.clientId,
      logout_uri: COGNITO_CONFIG.redirectUri,
    }).toString()}`;
  });

  // 6-stage customer-facing progress model (Payment System spec):
  // Order Placed -> Payment Verification -> Confirmed -> In Production -> QC -> Delivered.
  // Every backend order-status value maps into one of these 6 slots (or the
  // Rejected branch, which isn't a numbered stage — it's a stop sign at stage 1).
  const STAGES = ["Order Placed", "Payment Verification", "Confirmed", "In Production", "Quality Check", "Delivered"];
  const STATUS_TO_STAGE = {
    "Quoted": 0, "Priced": 0,
    "Pending Payment Verification": 1,
    "Payment Rejected": 1, // branch — rendered separately, not just index 1
    "Confirmed": 2, "Scheduled": 2,
    "In Production": 3,
    "QC": 4, "Rework": 4,
    "Ready for Dispatch": 5, "Dispatched": 5, "Delivered": 5,
    "Cancelled": 5, "Auto-Cancelled": 5, "Quote Expired": 5,
  };

  // Product image lookup — mirrors store.js's thumbImage(): a line item's own
  // designRef (a real image path already chosen at checkout) wins, else fall
  // back to the matching catalog product's image, else its leaf's image.
  const DATA = (window.KCMPS_STORE_DATA) || { products: [], leaves: {} };
  const productBySku = {};
  (DATA.products || []).forEach((p) => { productBySku[p.id] = p; });
  function lineImage(li) {
    if (li.designRef) return li.designRef;
    const p = li.sku ? productBySku[li.sku] : null;
    if (p && p.image) return p.image;
    const leaf = p ? DATA.leaves[p.leaf] : null;
    return (leaf && leaf.image) || null;
  }
  function initials(name) {
    return String(name || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  }

  function overallStatusPill(status) {
    const rejected = status === "Payment Rejected";
    const done = status === "Delivered";
    const cls = rejected ? "is-rejected" : done ? "is-done" : "";
    return `<span class="order-status-pill ${cls}">${escapeHtml(status || "Order Placed")}</span>`;
  }

  function renderProgress(status) {
    const rejected = status === "Payment Rejected";
    const stageIdx = STATUS_TO_STAGE[status] != null ? STATUS_TO_STAGE[status] : 0;
    const steps = STAGES.map((_, i) => {
      const cls = rejected && i === 1 ? "is-rejected" : i <= stageIdx ? "is-done" : "";
      return `<div class="progress-step ${cls}"></div>`;
    }).join("");
    const label = rejected
      ? "Payment rejected — please resubmit your GCash proof, or contact us if you need help."
      : STAGES[stageIdx];
    return `<div class="progress">${steps}</div><div class="stage-label">${escapeHtml(label)}</div>`;
  }

  function renderOrder(order) {
    const lines = (order.lineItems || []).map((li) => {
      const name = li.description || li.name || "Item";
      const img = lineImage(li);
      const thumb = img
        ? `<img class="line-thumb" src="${escapeHtml(img)}" alt="" loading="lazy" />`
        : `<span class="line-thumb-fallback">${escapeHtml(initials(name))}</span>`;
      return (
        `<div class="line-row">${thumb}` +
        `<div class="line-info"><div class="line-name">${escapeHtml(name)}</div>` +
        `<div class="line-meta">Qty ${li.qty || 1}${li.amount ? " · " + fmtPeso(li.amount) : ""}</div></div>` +
        `<span class="line-status">${escapeHtml(li.status || "—")}</span></div>`
      );
    }).join("");
    return (
      `<div class="card order-card">` +
        `<div class="order-top">` +
          `<span class="order-id">Order ${escapeHtml((order.PK || "").replace("ORDER#", "") || order.orderId || "")} <span class="text-muted" style="font-weight:400">· ${fmtDate(order.createdAt)}</span></span>` +
          overallStatusPill(order.orderStatus) +
        `</div>` +
        (lines ? `<div class="line-list">${lines}</div>` : "") +
        renderProgress(order.orderStatus) +
      `</div>`
    );
  }

  fetch(API_BASE + "/orders", {
    headers: { Authorization: "Bearer " + tokens.id_token },
  }).then((res) => {
    if (res.status === 401) { clearTokens(); window.location.replace("index.html?login=required"); return null; }
    return res.json();
  }).then((body) => {
    if (!body) return;
    const root = document.getElementById("orders-root");
    const orders = body.orders || [];
    if (!orders.length) { root.innerHTML = '<div class="orders-empty">No orders yet — start one from the shop.</div>'; return; }
    root.innerHTML = orders.map(renderOrder).join("");
  }).catch(() => {
    document.getElementById("orders-root").innerHTML = '<div class="orders-error">Couldn’t load your orders right now. Please try again shortly.</div>';
  });
})();
</script>
</body>
</html>
